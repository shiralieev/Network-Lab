 cavabsız qalır) və ya əksinə: eyni network-dəkini uzaq sayıb gateway-ə göndərir.<\/td><\/tr>\n<tr><td>Gateway host-un subnet-indən kənardadır<\/td><td>Host gateway-ə çata bilmir. Başqa network-lərə çıxış yoxdur, eyni network daxilində isə hər şey işləyir. Bu çox yayılmış səhvdir.<\/td><\/tr>\n<tr><td>Network və ya broadcast ünvanı host-a verilib<\/td><td>Ünvan düzgün işləmir: bu ünvanlar xüsusi məqsəd üçün ayrılıb.<\/td><\/tr>\n<tr><td>İki host-a eyni IP verilib<\/td><td>IP conflict: hər iki host-un şəbəkə əlaqəsi qeyri-sabit olur.<\/td><\/tr><\/table><\/div>\n<div class=\"box box-warn\"><h4>İşdə tez rast gəlinən hal<\/h4><p>\"Eyni ofisdə hamı ilə danışa bilirəm, amma internetə çıxa bilmirəm\" şikayətinin ən yayılmış səbəblərindən biri yanlış gateway və ya mask-dır. Əvvəl <span class=\"m\">ipconfig<\/span>-də mask və gateway-i yoxla, sonra gateway-in subnet-də olduğuna əmin ol.<\/p><\/div>\n","p1/t03/cheat":"<h2>Qısa xülasə<\/h2>\n<div class=\"cheat-box\"><ul class=\"cheat\">\n<li>Layer-lər işi hissələrə bölür. Hər layer yalnız bir iş görür və yalnız qonşu layer ilə danışır.<\/li>\n<li>OSI: 7 Application, 6 Presentation, 5 Session, 4 Transport, 3 Network, 2 Data Link, 1 Physical.<\/li>\n<li>TCP/IP: Application (7-6-5), Transport (4), Internet (3), Network Access (2-1).<\/li>\n<li>PDU adları: Data → <b>Segment<\/b> (L4) → <b>Packet<\/b> (L3) → <b>Frame<\/b> (L2) → <b>Bits<\/b> (L1).<\/li>\n<li>Encapsulation: göndərən yuxarıdan aşağı gedir, hər layer öz header-ini əlavə edir.<\/li>\n<li>Decapsulation: qəbul edən aşağıdan yuxarı gedir, hər layer öz header-ini oxuyub silir.<\/li>\n<li>Ethernet <b>EtherType<\/b>: 0x0800 = IPv4, 0x0806 = ARP, 0x86DD = IPv6.<\/li>\n<li>IPv4 <b>Protocol<\/b>: 1 = ICMP, 6 = TCP, 17 = UDP.<\/li>\n<li>Port hansı proqrama çatdırılacağını göstərir. IP ünvanı hansı cihaza çatacağını göstərir.<\/li>\n<li>TCP: əlaqə qurur (SYN, SYN-ACK, ACK), çatdırılmanı təsdiqləyir, itəni təkrar göndərir.<\/li>\n<li>UDP: əlaqə qurmur, təsdiq yoxdur, sürətlidir (DNS, DHCP).<\/li>\n<li>Switch Ethernet header-ə baxır (MAC). Router Ethernet-i silir, IP-yə baxır, yeni Ethernet yazır, TTL-i 1 azaldır.<\/li>\n<li>Router-dən keçəndə <b>MAC ünvanları dəyişir<\/b>, <b>IP ünvanları dəyişmir<\/b> (NAT yoxdursa).<\/li>\n<li>Ethernet header 14 bayt. IPv4 header adətən 20 bayt (ilk bayt 45).<\/li>\n<li>Hex dump-da: bayt 0-5 Dst MAC, 6-11 Src MAC, 12-13 EtherType, 22 TTL, 23 Protocol, 26-29 Src IP, 30-33 Dst IP.<\/li>\n<li>Problem axtararkən aşağıdan yuxarı yoxla: Layer 1, 2, 3, 4, 7. Ping uğurlu isə Layer 1-3 işləyir.<\/li>\n<li>Hər log mənbəyi yalnız öz layer-inə qədər sübut verir (firewall log-u: IP və port, məzmun yox).<\/li>\n<\/ul><\/div>\n<h2>Bu mövzudakı əmrlər<\/h2>\n<table class=\"cmd-table\">\n<tr><td>ping &lt;ünvan&gt;<span class=\"where\">Windows CMD<\/span><\/td><td>Layer 1-3-ü yoxlayır. Uğurludursa kabel, link və IP işləyir.<\/td><\/tr>\n<tr><td>ipconfig<span class=\"where\">Windows CMD<\/span><\/td><td>Layer 3 ayarları: IP, mask, gateway.<\/td><\/tr>\n<tr><td>arp -a<span class=\"where\">Windows CMD<\/span><\/td><td>Layer 2: IP-lərə uyğun MAC ünvanları cədvəli.<\/td><\/tr>\n<tr><td>netstat -an<span class=\"where\">Windows CMD<\/span><\/td><td>Layer 4: açıq portlar və aktiv TCP əlaqələri.<\/td><\/tr>\n<\/table>\n<h2>Port nömrələri<\/h2>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Port<\/th><th>Protokol<\/th><th>Xidmət<\/th><\/tr>\n<tr><td class=\"m\">20, 21<\/td><td>TCP<\/td><td>FTP<\/td><\/tr><tr><td class=\"m\">22<\/td><td>TCP<\/td><td>SSH<\/td><\/tr><tr><td class=\"m\">23<\/td><td>TCP<\/td><td>Telnet<\/td><\/tr><tr><td class=\"m\">25<\/td><td>TCP<\/td><td>SMTP<\/td><\/tr>\n<tr><td class=\"m\">53<\/td><td>UDP (və TCP)<\/td><td>DNS<\/td><\/tr><tr><td class=\"m\">67, 68<\/td><td>UDP<\/td><td>DHCP<\/td><\/tr><tr><td class=\"m\">80<\/td><td>TCP<\/td><td>HTTP<\/td><\/tr><tr><td class=\"m\">443<\/td><td>TCP<\/td><td>HTTPS<\/td><\/tr><\/table><\/div>\n","p1/t03/explain":"<h2 id=\"why-layers\">Niyə layer-lər var?<\/h2>\n<p>Brauzerdə bir səhifə açanda minlərlə kiçik iş görülməlidir: səhifənin adı IP ünvanına çevrilməli, məlumat parçalara bölünməli, hər parça düzgün cihaza çatmalı, itən parça təkrar göndərilməli, nəhayət bitlər kabeldə siqnal olmalıdır. Bütün bunları bir proqram etsəydi, hər brauzer hər kabel növü (Ethernet, Wi-Fi, optik) üçün ayrıca kod saxlamalı olardı.<\/p>\n<p><b>Qayda:<\/b> şəbəkə işi layer-lərə (səviyyələrə) bölünüb. Hər layer yalnız bir işi görür və yalnız özündən bir yuxarı və bir aşağı layer ilə danışır.<\/p>\n<p><b>Niyə belədir:<\/b> layer-lər bir-birindən asılı olmadığı üçün birini dəyişəndə qalanlar dəyişmir. Məsələn, kompüteri Ethernet kabelindən Wi-Fi-a keçirəndə yalnız aşağı layer-lər (Layer 1-2) dəyişir. IP, TCP və brauzer eyni qalır. Eyni səbəbdən bir mühəndis problemi layer-layer axtara bilir (bu mövzunun sonunda görəcəksən).<\/p>\n<p><b>Burada necə tətbiq olunur:<\/b> hər cihaz məlumatı yalnız öz layer-inə qədər oxuyur. Switch Layer 2-yə qədər, router Layer 3-ə qədər, firewall isə konfiqurasiyadan asılı olaraq Layer 4 və ya 7-yə qədər baxır. Bu, \"hansı cihaz nəyi görür\" sualının cavabıdır və SOC-da log analizinin əsasıdır.<\/p>\n\n<h2 id=\"models\">OSI və TCP/IP modelləri<\/h2>\n<p>İki model var. <b>OSI<\/b> 7 layer-dən ibarətdir və nəzəri istinad modelidir. <b>TCP/IP<\/b> real internetin işlədiyi modeldir və 4 layer-dir. Real həyatda mühəndislər OSI-nin <b>layer nömrələrindən<\/b> danışıq dili kimi istifadə edirlər: \"Layer 2 switch\", \"Layer 3 switch\", \"Layer 7 firewall\", \"bu Layer 1 problemidir\".<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>OSI<\/th><th>Layer<\/th><th>PDU<\/th><th>Nə edir<\/th><th>Nümunə<\/th><th>Cihaz<\/th><\/tr>\n<tr><td class=\"m\">7<\/td><td>Application<\/td><td>Data<\/td><td>Proqramın şəbəkə ilə interfeysi<\/td><td>HTTP, DNS, DHCP<\/td><td>Proxy, WAF<\/td><\/tr>\n<tr><td class=\"m\">6<\/td><td>Presentation<\/td><td>Data<\/td><td>Format, şifrələmə<\/td><td>TLS, JPEG<\/td><td><\/td><\/tr>\n<tr><td class=\"m\">5<\/td><td>Session<\/td><td>Data<\/td><td>Əlaqənin açılması və bağlanması<\/td><td>RPC, sessiya idarəsi<\/td><td><\/td><\/tr>\n<tr><td class=\"m\">4<\/td><td>Transport<\/td><td>Segment<\/td><td>Portlar, etibarlı çatdırma<\/td><td>TCP, UDP<\/td><td>Firewall (port)<\/td><\/tr>\n<tr><td class=\"m\">3<\/td><td>Network<\/td><td>Packet<\/td><td>IP ünvanı, network-lər arası yönləndirmə<\/td><td>IP, ICMP<\/td><td>Router, L3 switch<\/td><\/tr>\n<tr><td class=\"m\">2<\/td><td>Data Link<\/td><td>Frame<\/td><td>MAC ünvanı, bir link daxilində çatdırma<\/td><td>Ethernet, ARP<\/td><td>Switch, NIC<\/td><\/tr>\n<tr><td class=\"m\">1<\/td><td>Physical<\/td><td>Bits<\/td><td>Bitlərin siqnal kimi ötürülməsi<\/td><td>Mis kabel, optik, Wi-Fi radio<\/td><td>Kabel, hub<\/td><\/tr><\/table><\/div>\n<p><b>TCP/IP modelində<\/b> Layer 5-6-7 bir layer olaraq <b>Application<\/b> sayılır, Layer 4 <b>Transport<\/b>, Layer 3 <b>Internet<\/b>, Layer 1-2 isə <b>Network Access<\/b> (Link) adlanır. Packet Tracer və bu kurs OSI nömrələrini işlədir.<\/p>\n<div class=\"box box-note\"><h4>Modelə həddindən artıq güvənmə<\/h4><p>Bəzi protokollar layer-lərə dəqiq oturmur. ARP Layer 2 ilə Layer 3 arasında işləyir, TLS Layer 4 ilə 7 arasında. Model qayda deyil, təsnifat vasitəsidir. Əzbərləmək lazım olan yalnız budur: <b>1 Physical, 2 Data Link, 3 Network, 4 Transport, 7 Application<\/b> və hər birinin PDU adı. 5 və 6-nı yalnız tanımaq kifayətdir.<\/p><\/div>\n\n<h2 id=\"encap\">Encapsulation: məlumat necə sarılır<\/h2>\n<p>Brauzer <span class=\"m\">GET / HTTP/1.1<\/span> məlumatını göndərmək istəyir. Bu məlumatın heç bir ünvanı yoxdur, sadəcə mətndir. Göndərmək üçün hər layer aşağıya ötürməzdən əvvəl məlumatın qarşısına öz <b>header<\/b>-ini əlavə edir.<\/p>\n<p><b>Qayda:<\/b> göndərən cihazda məlumat yuxarıdan aşağı gedir və hər layer öz başlığını əlavə edir. Bu prosesə <b>encapsulation<\/b> deyilir. Hər mərhələdə əldə edilən vahid <b>PDU<\/b> (Protocol Data Unit) adlanır və adı layer-ə görə dəyişir: Data → <b>Segment<\/b> (Layer 4) → <b>Packet<\/b> (Layer 3) → <b>Frame<\/b> (Layer 2) → <b>Bits<\/b> (Layer 1).<\/p>\n<p><b>Niyə belədir:<\/b> hər layer fərqli sual cavablandırır. Layer 4 \"bu məlumat hansı proqrama çatmalıdır?\" (port), Layer 3 \"hansı cihaza çatmalıdır?\" (IP ünvanı), Layer 2 \"bu link-də kimə verilməlidir?\" (MAC ünvanı) sualına cavab verir. Hər cavab ayrı başlıqda saxlanılır, çünki hər cihaz yalnız öz sualına baxır.<\/p>\n<p><b>Burada necə tətbiq olunur:<\/b> aşağıdakı simulyatorda iki ssenari var. Hər layer-i əlavə et, başlığa klik edib sahələrə bax və sonda üç cihazdan birini seçib onun hansı başlığı oxuduğuna bax.<\/p>\n<div data-sim=\"encap\"><\/div>\n<details class=\"box box-think\"><summary>Dayan və düşün: niyə Ethernet başlığı ən xaricdədir?<\/summary><div class=\"ans\">Kadrı kabeldən qəbul edən ilk cihaz (switch, router, hədəf PC) əvvəlcə link səviyyəsində baxır. Ona görə ilk açılan başlıq link-in başlığı, yəni Ethernet olmalıdır. Onu açandan sonra IP başlığı görünür, sonra TCP. Başlıqlar açılma sırasının tərsi ilə yığılır.<\/div><\/details>\n\n<h2 id=\"decap\">Decapsulation: qəbul edən tərəf nə edir<\/h2>\n<p>Hədəf PC kadrı alanda bütün prosesi tərsinə edir: <b>decapsulation<\/b>. Aşağıdan yuxarı gedir və hər layer öz başlığını oxuyur, yoxlayır və silib məlumatı yuxarı layer-ə verir.<\/p>\n<p><b>Niyə bu vacibdir:<\/b> hər başlıqda \"yuxarıdakı layer-ə kim cavabdehdir?\" sualının cavabını verən bir sahə var. Bu sahə olmasa qəbul edən cihaz məlumatı hansı proqrama verəcəyini bilməzdi.<\/p>\n<pre class=\"pre\"><span class=\"c\"># Qəbul edən cihazda zəncir<\/span>\nEthernet başlığı:  <span class=\"k\">EtherType<\/span> = 0x0800     → payload IPv4-dür, IP-yə ver\nIPv4 başlığı:      <span class=\"k\">Protocol<\/span>  = 6          → payload TCP-dir, TCP-yə ver\nTCP başlığı:       <span class=\"k\">Dest port<\/span> = 443        → 443-ü dinləyən proqrama ver\n<\/pre>\n<p>Beləliklə hər başlıqda bir \"növbəti kimdir\" sahəsi var. Ən çox görəcəyin dəyərlər:<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Başlıq<\/th><th>Sahə<\/th><th>Dəyər<\/th><th>Mənası<\/th><\/tr>\n<tr><td>Ethernet<\/td><td>EtherType<\/td><td class=\"m\">0x0800<\/td><td>IPv4<\/td><\/tr>\n<tr><td>Ethernet<\/td><td>EtherType<\/td><td class=\"m\">0x0806<\/td><td>ARP<\/td><\/tr>\n<tr><td>Ethernet<\/td><td>EtherType<\/td><td class=\"m\">0x86DD<\/td><td>IPv6<\/td><\/tr>\n<tr><td>IPv4<\/td><td>Protocol<\/td><td class=\"m\">1<\/td><td>ICMP<\/td><\/tr>\n<tr><td>IPv4<\/td><td>Protocol<\/td><td class=\"m\">6<\/td><td>TCP<\/td><\/tr>\n<tr><td>IPv4<\/td><td>Protocol<\/td><td class=\"m\">17<\/td><td>UDP<\/td><\/tr><\/table><\/div>\n<p>Əgər IPv4 başlığının Protocol sahəsi 1-dirsə, içəridə TCP yox, ICMP mesajı var. Wireshark və Packet Tracer məhz bu sahələrə baxaraq paketi düzgün şəkildə açıb göstərir.<\/p>\n\n<h2 id=\"hop\">Router-dən keçəndə nə dəyişir<\/h2>\n<p>İndi ən vacib hissə. PC1 (192.168.1.10) başqa network-dəki PC2-yə (192.168.2.20) paket göndərir. Paketin yolu: PC1 → Router → PC2. Bu iki link-də paketin başlıqları eyni olurmu?<\/p>\n<p><b>Qayda:<\/b> Ethernet başlığı yalnız <b>bir link<\/b> üçün keçərlidir. Router kadrı qəbul edəndə Ethernet başlığını açıb atır, IP başlığına baxır, çıxış interface-ini seçir və yeni link üçün <b>yeni Ethernet başlığı<\/b> yazır. IP ünvanları isə (Source IP və Destination IP) əvvəldən sona dəyişmir. Router yalnız <b>TTL<\/b> sahəsini 1 azaldır.<\/p>\n<p><b>Niyə belədir:<\/b> MAC ünvanı yalnız link daxilində mənalıdır (switch də yalnız bu link-in cihazlarını tanıyır). PC2-nin MAC ünvanı PC1-in link-ində heç bir mənası daşımır. IP ünvanı isə yönləndirmə üçündür və yol boyu eyni qalmalıdır, çünki hər router \"bu paket kimə gedir?\" sualını məhz onunla həll edir.<\/p>\n<div class=\"figure\"><svg viewBox=\"0 0 760 330\" role=\"img\" aria-label=\"PC1 router vasitəsilə PC2-yə paket göndərir: iki link-də başlıqlar necə dəyişir\">\n<rect x=\"14\" y=\"14\" width=\"120\" height=\"58\" rx=\"6\" class=\"fill-blue\"/><text x=\"74\" y=\"38\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">PC1<\/text><text x=\"74\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" class=\"t-m\">192.168.1.10<\/text>\n<line x1=\"134\" y1=\"43\" x2=\"320\" y2=\"43\" class=\"ln\"/>\n<circle cx=\"380\" cy=\"43\" r=\"36\" class=\"fill-yel\"/><text x=\"380\" y=\"40\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Router<\/text><text x=\"380\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" class=\"t-dim\">TTL − 1<\/text>\n<line x1=\"416\" y1=\"43\" x2=\"626\" y2=\"43\" class=\"ln\"/>\n<rect x=\"626\" y=\"14\" width=\"120\" height=\"58\" rx=\"6\" class=\"fill-blue\"/><text x=\"686\" y=\"38\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">PC2<\/text><text x=\"686\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" class=\"t-m\">192.168.2.20<\/text>\n<text x=\"226\" y=\"34\" text-anchor=\"middle\" font-size=\"12\" class=\"t-dim\">Link 1<\/text><text x=\"520\" y=\"34\" text-anchor=\"middle\" font-size=\"12\" class=\"t-dim\">Link 2<\/text>\n<rect x=\"14\" y=\"110\" width=\"350\" height=\"200\" rx=\"6\" class=\"box-s\"/>\n<text x=\"189\" y=\"136\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Link 1-də kadr (PC1 → Router)<\/text>\n<rect x=\"30\" y=\"150\" width=\"318\" height=\"26\" rx=\"3\" class=\"fill-yel\"/><text x=\"40\" y=\"168\" font-size=\"13\" class=\"t-m\">Dst MAC: Router-in Gi0/0 MAC-i<\/text>\n<rect x=\"30\" y=\"180\" width=\"318\" height=\"26\" rx=\"3\" class=\"fill-yel\"/><text x=\"40\" y=\"198\" font-size=\"13\" class=\"t-m\">Src MAC: PC1-in MAC-i<\/text>\n<text x=\"40\" y=\"228\" font-size=\"13\" class=\"t-m\">Src IP:  192.168.1.10<\/text>\n<text x=\"40\" y=\"250\" font-size=\"13\" class=\"t-m\">Dst IP:  192.168.2.20<\/text>\n<rect x=\"30\" y=\"262\" width=\"318\" height=\"26\" rx=\"3\" class=\"fill-yel\"/><text x=\"40\" y=\"280\" font-size=\"13\" class=\"t-m\">TTL: 128<\/text>\n<rect x=\"396\" y=\"110\" width=\"350\" height=\"200\" rx=\"6\" class=\"box-s\"/>\n<text x=\"571\" y=\"136\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Link 2-də kadr (Router → PC2)<\/text>\n<rect x=\"412\" y=\"150\" width=\"318\" height=\"26\" rx=\"3\" class=\"fill-yel\"/><text x=\"422\" y=\"168\" font-size=\"13\" class=\"t-m\">Dst MAC: PC2-nin MAC-i<\/text>\n<rect x=\"412\" y=\"180\" width=\"318\" height=\"26\" rx=\"3\" class=\"fill-yel\"/><text x=\"422\" y=\"198\" font-size=\"13\" class=\"t-m\">Src MAC: Router-in Gi0/1 MAC-i<\/text>\n<text x=\"422\" y=\"228\" font-size=\"13\" class=\"t-m\">Src IP:  192.168.1.10<\/text>\n<text x=\"422\" y=\"250\" font-size=\"13\" class=\"t-m\">Dst IP:  192.168.2.20<\/text>\n<rect x=\"412\" y=\"262\" width=\"318\" height=\"26\" rx=\"3\" class=\"fill-yel\"/><text x=\"422\" y=\"280\" font-size=\"13\" class=\"t-m\">TTL: 127<\/text>\n<\/svg><div class=\"fig-cap\">Sarı sahələr router-dən keçəndə dəyişir (iki MAC və TTL). IP ünvanları dəyişmir.<\/div><\/div>\n<details class=\"box box-think\"><summary>Dayan və düşün: PC1-in MAC ünvanı PC2-yə çatırmı?<\/summary><div class=\"ans\">Xeyr. Link 2-dəki kadrda Source MAC artıq router-in öz MAC-idir. PC2 paketin PC1-dən gəldiyini yalnız <b>Source IP<\/b> ünvanından bilir. Bu, SOC üçün vacibdir: başqa network-dən gələn trafikin log-unda MAC ünvanı həmişə sizə ən yaxın router-in MAC-i olacaq, əsl göndərənin yox.<\/div><\/details>\n<p>Bu cədvəl hansı cihazın nəyə baxdığını və nəyi dəyişdiyini yekunlaşdırır:<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Cihaz<\/th><th>Nəyi oxuyur<\/th><th>Nəyi dəyişir<\/th><\/tr>\n<tr><td>Switch<\/td><td>Ethernet başlığı (Dst və Src MAC)<\/td><td>Heç nəyi. Kadr eyni qalır.<\/td><\/tr>\n<tr><td>Router<\/td><td>Ethernet (qəbul üçün), IP (yönləndirmə üçün)<\/td><td>Yeni Ethernet başlığı yazır, TTL-i 1 azaldır<\/td><\/tr>\n<tr><td>Firewall<\/td><td>Konfiqurasiyaya görə IP, port (Layer 4) və ya məzmun (Layer 7)<\/td><td>Adətən heç nəyi (buraxır və ya atır)<\/td><\/tr>\n<tr><td>Hədəf PC<\/td><td>Bütün layer-ləri aşağıdan yuxarı<\/td><td>Başlıqları silir, məlumatı proqrama verir<\/td><\/tr><\/table><\/div>\n<p>Adi routing zamanı IP ünvanları dəyişmir. NAT adlı xüsusi funksiya istisnadır, onu 5-ci hissədə öyrənəcəksən.<\/p>\n<div class=\"box box-pt\"><h4>Packet Tracer-də sübut et<\/h4><p>Packet Tracer-i artıq tanıyırsansa (8-ci mövzuda öyrənəcəksən): Simulation mode-da PC1-dən PC2-yə ping at, event list-də paketə klik et. Açılan PDU Information pəncərəsində OSI Model və PDU Details tab-ları var (adlar versiyaya görə bir az fərqlənə bilər). Router-dən əvvəl və sonra Source MAC və Destination MAC dəyərlərinin dəyişdiyini, IP ünvanlarının isə eyni qaldığını yoxla. Bu mövzuda Packet Tracer tələb olunmur.<\/p><\/div>\n\n<h2 id=\"tcp-udp\">Layer 4: port, TCP və UDP<\/h2>\n<p>IP ünvanı məlumatı <b>cihaza<\/b> çatdırır. Amma cihazda eyni anda onlarla proqram şəbəkədən istifadə edir: brauzer, e-poçt, mesajlaşma. Məlumatın hansı proqrama aid olduğunu <b>port nömrəsi<\/b> (0-65535) göstərir.<\/p>\n<p><b>Qayda:<\/b> server proqramı müəyyən port nömrəsini \"dinləyir\" (məsələn, veb server 80 və ya 443). Client proqram isə kənara yüksək, təsadüfi port nömrəsi ilə çıxır (məsələn 51514). Hər əlaqə dörd dəyərlə fərqlənir: Source IP, Source port, Destination IP, Destination port.<\/p>\n<p>Transport layer iki protokolla işləyir:<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th><\/th><th>TCP<\/th><th>UDP<\/th><\/tr>\n<tr><td>Əlaqə qurulur?<\/td><td>Bəli, əvvəl 3-way handshake<\/td><td>Xeyr, birbaşa göndərir<\/td><\/tr>\n<tr><td>Çatdırılma təsdiqi<\/td><td>Bəli (Acknowledgment), itən parça təkrar göndərilir<\/td><td>Xeyr, itən məlumat itir<\/td><\/tr>\n<tr><td>Sıra<\/td><td>Sıra nömrəsi ilə düzgün sıralanır<\/td><td>Yoxdur<\/td><\/tr>\n<tr><td>Sürət / yük<\/td><td>Daha yavaş, başlıq böyükdür<\/td><td>Sürətli, başlıq 8 bayt<\/td><\/tr>\n<tr><td>İstifadə<\/td><td>Veb, e-poçt, fayl köçürməsi<\/td><td>DNS sorğusu, DHCP, səs və video<\/td><\/tr><\/table><\/div>\n<p><b>Niyə iki protokol var:<\/b> hər proqramın tələbi fərqlidir. Veb səhifənin bir parçası itərsə, səhifə yarımçıq açılır, ona görə etibarlılıq lazımdır (TCP). DNS sorğusu isə tək kiçik paketdir, itərsə proqram sadəcə təkrar göndərir; əlavə əlaqə qurmaq isə lazımsız yükdür (UDP).<\/p>\n<div class=\"figure\"><svg viewBox=\"0 0 760 250\" role=\"img\" aria-label=\"TCP 3-way handshake\">\n<defs><marker id=\"arr-hs\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" style=\"fill:var(--ink-2)\"/><\/marker><\/defs>\n<text x=\"140\" y=\"26\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">Client (PC)<\/text><text x=\"620\" y=\"26\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">Server (port 443)<\/text>\n<line x1=\"140\" y1=\"36\" x2=\"140\" y2=\"230\" class=\"ln\"/><line x1=\"620\" y1=\"36\" x2=\"620\" y2=\"230\" class=\"ln\"/>\n<line x1=\"140\" y1=\"72\" x2=\"618\" y2=\"102\" class=\"ln\" marker-end=\"url(#arr-hs)\"/>\n<text x=\"380\" y=\"76\" text-anchor=\"middle\" font-size=\"13\" class=\"t-m\">1. SYN  (\"əlaqə qurmaq istəyirəm\")<\/text>\n<line x1=\"620\" y1=\"130\" x2=\"142\" y2=\"160\" class=\"ln\" marker-end=\"url(#arr-hs)\"/>\n<text x=\"380\" y=\"124\" text-anchor=\"middle\" font-size=\"13\" class=\"t-m\">2. SYN-ACK  (\"qəbul etdim, mən də hazıram\")<\/text>\n<line x1=\"140\" y1=\"186\" x2=\"618\" y2=\"216\" class=\"ln\" marker-end=\"url(#arr-hs)\"/>\n<text x=\"380\" y=\"180\" text-anchor=\"middle\" font-size=\"13\" class=\"t-m\">3. ACK  (\"təsdiq, məlumat göndərirəm\")<\/text>\n<\/svg><div class=\"fig-cap\">TCP əlaqəsi üç mesajla qurulur. Yalnız bundan sonra proqram məlumatı (məsələn HTTP sorğusu) göndərilir.<\/div><\/div>\n<p>Ən çox rast gələcəyin port nömrələri (tanımaq kifayətdir, əzbərləmək məcburi deyil):<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Port<\/th><th>Protokol<\/th><th>Xidmət<\/th><th>Port<\/th><th>Protokol<\/th><th>Xidmət<\/th><\/tr>\n<tr><td class=\"m\">20, 21<\/td><td>TCP<\/td><td>FTP<\/td><td class=\"m\">53<\/td><td>UDP (və TCP)<\/td><td>DNS<\/td><\/tr>\n<tr><td class=\"m\">22<\/td><td>TCP<\/td><td>SSH<\/td><td class=\"m\">67, 68<\/td><td>UDP<\/td><td>DHCP<\/td><\/tr>\n<tr><td class=\"m\">23<\/td><td>TCP<\/td><td>Telnet<\/td><td class=\"m\">80<\/td><td>TCP<\/td><td>HTTP<\/td><\/tr>\n<tr><td class=\"m\">25<\/td><td>TCP<\/td><td>SMTP<\/td><td class=\"m\">443<\/td><td>TCP<\/td><td>HTTPS<\/td><\/tr><\/table><\/div>\n\n<h2 id=\"hex-read\">Hex dump-da başlıqları oxumaq<\/h2>\n<p>Wireshark, Packet Tracer-in packet inspector-u və bir çox log toplayıcı kadrı hex bayt şəklində göstərir. Başlıqların uzunluğu sabitdir, ona görə baytın harada olduğuna baxaraq hansı sahə olduğunu bilmək olar. Əvvəlki mövzudakı hex qaydası (2 hex rəqəm = 1 bayt) burada işləyir.<\/p>\n<pre class=\"pre\"><span class=\"c\"># Ping kadrının ilk 34 baytı (Ethernet 14 + IPv4 20)<\/span>\n<span class=\"k\">00 01 43 21 bb bb<\/span>  Destination MAC\n<span class=\"k\">00 01 43 21 aa aa<\/span>  Source MAC\n<span class=\"k\">08 00<\/span>              EtherType: IPv4\n<span class=\"k\">45<\/span>                 Version 4, header uzunluğu 5 x 4 = 20 bayt\n00                 DSCP/ECN\n00 3c              Total length = 60\n00 01 00 00        Identification, Flags\n<span class=\"k\">80<\/span>                 TTL = 128\n<span class=\"k\">01<\/span>                 Protocol = 1 (ICMP)\nb7 51              Header checksum\n<span class=\"k\">c0 a8 01 0a<\/span>        Source IP = 192.168.1.10\n<span class=\"k\">c0 a8 01 14<\/span>        Destination IP = 192.168.1.20\n<\/pre>\n<p><b>Qayda:<\/b> Ethernet başlığı həmişə 14 bayt (6 + 6 + 2). IPv4 başlığı adətən 20 bayt, ilk bayt <span class=\"m\">45<\/span> olanda (4 = IPv4, 5 = 5 x 4 bayt). Beləliklə bayt 0-5 Destination MAC, 6-11 Source MAC, 12-13 EtherType, 22-ci bayt TTL, 23-cü Protocol, 26-29 Source IP, 30-33 Destination IP-dir.<\/p>\n<p><b>Niyə bu işə yarayır:<\/b> SOC-da bəzən yalnız xam paket (pcap) olur. Hex-i oxuya bilsən, alətin göstərdiyi nəticəni yoxlaya və qeyri-adi paketi (məsələn qəribə TTL, gözlənilməz Protocol) özün tapa bilərsən.<\/p>\n<div data-sim=\"hexdump\" data-opts='{\"frame\":\"icmp\"}'><\/div>\n\n<h2 id=\"soc-layers\">Layer-lərlə problem axtarmaq<\/h2>\n<p>Layer modeli yalnız nəzəriyyə deyil, iş metodudur. İstifadəçi \"internet işləmir\" deyəndə <b>aşağıdan yuxarı<\/b> yoxlayırsan: hər layer-in işlədiyini sübut etmədən yuxarıya keçmə.<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Layer<\/th><th>Sual<\/th><th>Sübut<\/th><\/tr>\n<tr><td>1 Physical<\/td><td>Kabel qoşulub, link işığı yanır?<\/td><td>Switch portunun vəziyyəti (up/down), link LED<\/td><\/tr>\n<tr><td>2 Data Link<\/td><td>Eyni link-dəki cihazı MAC ilə görürmü?<\/td><td>arp -a, switch MAC address table<\/td><\/tr>\n<tr><td>3 Network<\/td><td>IP ünvanı düzgündür? Gateway-ə çatır?<\/td><td>ipconfig, ping gateway<\/td><\/tr>\n<tr><td>4 Transport<\/td><td>Hədəf portu açıqdır? Firewall buraxır?<\/td><td>Port testi, firewall log<\/td><\/tr>\n<tr><td>7 Application<\/td><td>Xidmət işləyir? Düzgün cavab verir?<\/td><td>Brauzer, proqram log-u, HTTP kodu<\/td><\/tr><\/table><\/div>\n<p><b>Nümunə:<\/b> <span class=\"m\">ping 192.168.1.20<\/span> uğurludur, amma server səhifəsi açılmır. Ping Layer 1-3-ün işlədiyini sübut edir (kabel, MAC çatdırılması, IP). Deməli problem yuxarıdadır: ya server-də veb xidməti işləmir (Layer 7), ya da firewall 80 portunu bağlayıb (Layer 4).<\/p>\n<details class=\"box box-think\"><summary>Dayan və düşün: firewall log-unda yalnız IP və port var. Nəyi bilə bilərsən?<\/summary><div class=\"ans\">Log belədir: <span class=\"m\">10.1.1.5:51234 → 203.0.113.9:443 TCP allow<\/span>. Bu, Layer 3-4 məlumatıdır. Bilirsən ki, 10.1.1.5 host-u 203.0.113.9 server-inin 443 portuna qoşulub və qoşulma buraxılıb. Amma 443 HTTPS-dir, məzmun şifrəlidir. Hansı URL-ə girildiyini və ya nə yüklənildiyini bu log-dan bilmək olmaz. Bunun üçün Layer 7 məlumatı olan alət (proxy, DNS log-u, TLS inspection) lazımdır. Hər log mənbəyi yalnız öz layer-inə qədər sübut verir. Bu fikir SOC-da hər investigation-un əsasıdır.<\/div><\/details>\n","p1/t04/cheat":"<h2>Qısa xülasə<\/h2>\n<div class=\"cheat-box\"><ul class=\"cheat\">\n<li>Dörd növ: <b>unicast<\/b> (1 hədəf), <b>broadcast<\/b> (network-dəki hamı), <b>multicast<\/b> (qrupa üzv olanlar), <b>anycast<\/b> (eyni IP-li serverlərdən ən yaxını).<\/li>\n<li>Unicast: Destination MAC və IP tək cihazı göstərir. Switch kadrı yalnız o porta göndərir.<\/li>\n<li>Switch cədvəldə MAC-i tapmasa unicast kadrı da bütün portlara göndərir (unknown unicast flooding).<\/li>\n<li>Broadcast MAC: <span class=\"m\">FF:FF:FF:FF:FF:FF<\/span>. Switch gələn port istisna olmaqla bütün portlara göndərir.<\/li>\n<li>Limited broadcast <span class=\"m\">255.255.255.255<\/span> network-dən çıxmır. Directed broadcast (məs. <span class=\"m\">192.168.1.255<\/span>) həmin subnet-in broadcast ünvanıdır.<\/li>\n<li>Broadcast ARP və DHCP üçün lazımdır: göndərən hədəfin kim olduğunu hələ bilmir.<\/li>\n<li><b>Broadcast domain<\/b> = bir-birinin broadcast-ını alan cihazlar. Router interface-i onu ayırır. Switch-lər onu böyüdür.<\/li>\n<li>IPv6-da broadcast yoxdur, multicast istifadə olunur.<\/li>\n<li>Multicast IPv4 aralığı: <span class=\"m\">224.0.0.0 – 239.255.255.255<\/span>. <span class=\"m\">224.0.0.0/24<\/span> router-dən keçmir.<\/li>\n<li>Multicast MAC = <span class=\"m\">01:00:5E<\/span> + IP-nin son 23 biti. İkinci oktet 128-dən böyükdürsə 128 çıx.<\/li>\n<li>32 fərqli multicast IP eyni MAC-i paylaşa bilər (28 bit dəyişir, 23 bit götürülür).<\/li>\n<li>IGMP: host group-a qoşulduğunu bildirir. IGMP snooping switch-in multicast-ı yalnız üzv portlara göndərməsini təmin edir.<\/li>\n<li>Adi switch multicast-ı bütün portlara göndərir, çünki multicast MAC heç vaxt Source olmur və öyrənilmir.<\/li>\n<li>Anycast ayrı paket növü deyil: eyni unicast IP bir neçə serverdədir, routing ən yaxınına aparır.<\/li>\n<li>Anycast-da client-in Destination MAC-i default gateway-in MAC-idir (server başqa network-dədir).<\/li>\n<li>Source MAC həmişə unicast olmalıdır. Source MAC-də broadcast və ya multicast görsən, bu anormaldır.<\/li>\n<li>Saniyədə minlərlə broadcast = broadcast storm əlaməti (çox vaxt Layer 2 loop).<\/li>\n<\/ul><\/div>\n<h2>Bu mövzudakı əmrlər<\/h2>\n<table class=\"cmd-table\">\n<tr><td>arp -a<span class=\"where\">Windows CMD<\/span><\/td><td>ARP cədvəlini göstərir. Statik sətirlərdə multicast (01-00-5e-...) və broadcast (ff-ff-ff-ff-ff-ff) MAC-lərini görürsən.<\/td><\/tr>\n<tr><td>ipconfig /all<span class=\"where\">Windows CMD<\/span><\/td><td>MAC və IP ünvanlarını göstərir.<\/td><\/tr>\n<\/table>\n<h2>Multicast ünvanları<\/h2>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>IP<\/th><th>MAC<\/th><th>İstifadə<\/th><\/tr>\n<tr><td class=\"m\">224.0.0.1<\/td><td class=\"m\">01:00:5E:00:00:01<\/td><td>Bütün host-lar<\/td><\/tr>\n<tr><td class=\"m\">224.0.0.2<\/td><td class=\"m\">01:00:5E:00:00:02<\/td><td>Bütün router-lər<\/td><\/tr>\n<tr><td class=\"m\">224.0.0.5<\/td><td class=\"m\">01:00:5E:00:00:05<\/td><td>OSPF<\/td><\/tr>\n<tr><td class=\"m\">224.0.0.9<\/td><td class=\"m\">01:00:5E:00:00:09<\/td><td>RIPv2<\/td><\/tr>\n<tr><td class=\"m\">224.0.0.22<\/td><td class=\"m\">01:00:5E:00:00:16<\/td><td>IGMPv3<\/td><\/tr>\n<tr><td class=\"m\">224.0.0.251<\/td><td class=\"m\">01:00:5E:00:00:FB<\/td><td>mDNS<\/td><\/tr>\n<tr><td class=\"m\">239.255.255.250<\/td><td class=\"m\">01:00:5E:7F:FF:FA<\/td><td>SSDP<\/td><\/tr><\/table><\/div>\n","p1/t04/explain":"<h2 id=\"cast-why\">Bir məlumat kimə göndərilir?<\/h2>\n<p>Şəbəkədə hər paketin bir sualı var: <b>kim qəbul etməlidir?<\/b> Cavab dörd formadan biri ola bilər. Bunlara <b>cast növləri<\/b> deyilir və hər biri fərqli iş üçündür.<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Növ<\/th><th>Kimə<\/th><th>Destination MAC<\/th><th>Destination IP<\/th><th>Nümunə<\/th><\/tr>\n<tr><td><b>Unicast<\/b><\/td><td>Bir hədəfə<\/td><td>Hədəfin MAC-i<\/td><td>Hədəfin IP-si<\/td><td>Veb sorğusu, ping<\/td><\/tr>\n<tr><td><b>Broadcast<\/b><\/td><td>Network-dəki hamıya<\/td><td class=\"m\">FF:FF:FF:FF:FF:FF<\/td><td class=\"m\">255.255.255.255<\/td><td>ARP sorğusu, DHCP Discover<\/td><\/tr>\n<tr><td><b>Multicast<\/b><\/td><td>Qrupa qoşulanlara<\/td><td class=\"m\">01:00:5E:...<\/td><td class=\"m\">224.0.0.0 – 239.255.255.255<\/td><td>OSPF hello, video yayımı<\/td><\/tr>\n<tr><td><b>Anycast<\/b><\/td><td>Eyni ünvanlı serverlərdən ən yaxınına<\/td><td>İlk hop-un MAC-i<\/td><td>Adi unicast ünvanı<\/td><td>Public DNS, CDN<\/td><\/tr><\/table><\/div>\n<p>Yadda saxla: ilk üçü <b>paket növü<\/b> kimi Destination ünvanından tanınır. Anycast isə ayrı paket növü deyil; adi unicast ünvanıdır, fərq yalnız bu ünvanın bir neçə serverdə olmasındadır.<\/p>\n<p>Aşağıdakı simulyatorda hər növü ayrıca seç. Əvvəl <b>təxmin et<\/b> (kimlər qəbul edəcək), sonra göndər.<\/p>\n<div data-sim=\"cast\"><\/div>\n\n<h2 id=\"unicast\">Unicast<\/h2>\n<p><b>Qayda:<\/b> unicast kadrın Destination MAC-i və Destination IP-si tək bir cihazı göstərir.<\/p>\n<p><b>Niyə belədir:<\/b> hər cihaza məlumat göndərmək lazım olanda çoxu üçün bu, əsasdır: veb səhifə, ping, e-poçt. Switch Destination MAC-ə baxıb MAC address table-da həmin cihazın portunu tapır və kadrı <b>yalnız o porta<\/b> göndərir. Digər cihazlar kadrı görmür.<\/p>\n<p><b>Burada necə tətbiq olunur:<\/b> switch cədvəldə MAC ünvanını tapmayıbsa (unknown unicast), kadrı gələn port istisna olmaqla bütün portlara göndərir (flood). Bu davranış və switch-in MAC-i necə öyrəndiyi 7-ci mövzuda ətraflı gələcək.<\/p>\n\n<h2 id=\"broadcast\">Broadcast<\/h2>\n<p><b>Qayda:<\/b> broadcast kadrın Destination MAC-i <span class=\"m\">FF:FF:FF:FF:FF:FF<\/span>-dir (bütün 48 bit 1). Switch bu kadrı gələn port istisna olmaqla <b>bütün portlara<\/b> göndərir. Router isə broadcast-ı <b>ötürmür<\/b>.<\/p>\n<p><b>Niyə lazımdır:<\/b> bəzən göndərən hədəfin kim olduğunu bilmir. ARP-da \"192.168.1.20-nin MAC-i nədir?\" soruşmaq lazımdır, amma cavab verənin MAC-i məhz bilinmir. DHCP-də isə yeni qoşulan PC-nin hələ IP ünvanı belə yoxdur. Bu hallarda yeganə yol hamıya soruşmaqdır.<\/p>\n<p><b>Bahası nədir:<\/b> hər cihaz broadcast kadrı qəbul edib prosessorunda emal etməlidir. Çox broadcast hər cihazı yavaşladır və şəbəkəni yükləyir. Ona görə broadcast-ın hara qədər yayıldığını bilmək vacibdir.<\/p>\n<p>Broadcast-ın yayıldığı sahəyə <b>broadcast domain<\/b> deyilir. Bir broadcast domain-dəki hər cihaz bir-birinin broadcast-ını alır. Router interface-ləri broadcast domain-in sərhədidir.<\/p>\n<div class=\"figure\"><svg viewBox=\"0 0 760 250\" role=\"img\" aria-label=\"Router iki broadcast domain-i ayırır\">\n<rect x=\"14\" y=\"30\" width=\"290\" height=\"190\" rx=\"8\" class=\"fill-blue\"/><text x=\"159\" y=\"54\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Broadcast domain 1<\/text>\n<rect x=\"34\" y=\"120\" width=\"70\" height=\"40\" rx=\"4\" class=\"box-s\"/><text x=\"69\" y=\"145\" text-anchor=\"middle\" font-size=\"13\">PC1<\/text>\n<rect x=\"124\" y=\"120\" width=\"70\" height=\"40\" rx=\"4\" class=\"box-s\"/><text x=\"159\" y=\"145\" text-anchor=\"middle\" font-size=\"13\">PC2<\/text>\n<rect x=\"214\" y=\"120\" width=\"70\" height=\"40\" rx=\"4\" class=\"box-s\"/><text x=\"249\" y=\"145\" text-anchor=\"middle\" font-size=\"13\">PC3<\/text>\n<rect x=\"110\" y=\"75\" width=\"100\" height=\"30\" rx=\"4\" class=\"box-s\"/><text x=\"160\" y=\"95\" text-anchor=\"middle\" font-size=\"13\">Switch 1<\/text>\n<line x1=\"69\" y1=\"120\" x2=\"140\" y2=\"105\" class=\"ln\"/><line x1=\"159\" y1=\"120\" x2=\"159\" y2=\"105\" class=\"ln\"/><line x1=\"249\" y1=\"120\" x2=\"180\" y2=\"105\" class=\"ln\"/>\n<circle cx=\"380\" cy=\"90\" r=\"38\" class=\"fill-yel\"/><text x=\"380\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Router<\/text>\n<line x1=\"304\" y1=\"90\" x2=\"342\" y2=\"90\" class=\"ln\"/><line x1=\"418\" y1=\"90\" x2=\"456\" y2=\"90\" class=\"ln\"/>\n<rect x=\"456\" y=\"30\" width=\"290\" height=\"190\" rx=\"8\" class=\"fill-ok\"/><text x=\"601\" y=\"54\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Broadcast domain 2<\/text>\n<rect x=\"476\" y=\"120\" width=\"70\" height=\"40\" rx=\"4\" class=\"box-s\"/><text x=\"511\" y=\"145\" text-anchor=\"middle\" font-size=\"13\">PC4<\/text>\n<rect x=\"566\" y=\"120\" width=\"70\" height=\"40\" rx=\"4\" class=\"box-s\"/><text x=\"601\" y=\"145\" text-anchor=\"middle\" font-size=\"13\">PC5<\/text>\n<rect x=\"656\" y=\"120\" width=\"70\" height=\"40\" rx=\"4\" class=\"box-s\"/><text x=\"691\" y=\"145\" text-anchor=\"middle\" font-size=\"13\">PC6<\/text>\n<rect x=\"552\" y=\"75\" width=\"100\" height=\"30\" rx=\"4\" class=\"box-s\"/><text x=\"602\" y=\"95\" text-anchor=\"middle\" font-size=\"13\">Switch 2<\/text>\n<line x1=\"511\" y1=\"120\" x2=\"582\" y2=\"105\" class=\"ln\"/><line x1=\"601\" y1=\"120\" x2=\"601\" y2=\"105\" class=\"ln\"/><line x1=\"691\" y1=\"120\" x2=\"622\" y2=\"105\" class=\"ln\"/>\n<text x=\"380\" y=\"160\" text-anchor=\"middle\" font-size=\"12\" class=\"t-dim\">broadcast<\/text><text x=\"380\" y=\"176\" text-anchor=\"middle\" font-size=\"12\" class=\"t-dim\">burada dayanır<\/text>\n<text x=\"159\" y=\"205\" text-anchor=\"middle\" font-size=\"12\">PC1 broadcast → PC2, PC3 alır<\/text><text x=\"601\" y=\"205\" text-anchor=\"middle\" font-size=\"12\">PC4-PC6 PC1-in broadcast-ını almır<\/text>\n<\/svg><div class=\"fig-cap\">Bir switch broadcast domain-i böyütür, router isə ayırır. Burada iki broadcast domain var, çünki router-in iki interface-i var.<\/div><\/div>\n<details class=\"box box-think\"><summary>Dayan və düşün: iki switch-i bir kabellə birləşdirsən broadcast domain sayı neçə olar?<\/summary><div class=\"ans\">Switch kadrı Layer 2-də ötürür, broadcast-ı da bütün portlara göndərir. İki switch kabel ilə birləşəndə onlar bir Layer 2 şəbəkəsi olur və bütün PC-lər eyni broadcast domain-də olur. Yəni switch-lər sayını artırmaq broadcast domain-i ayırmır; ayıran yalnız router (və ya VLAN, bunu 3-cü hissədə görəcəksən).<\/div><\/details>\n<p>Broadcast IP ünvanının iki növü var:<\/p>\n<ul>\n<li><b>Limited broadcast<\/b> <span class=\"m\">255.255.255.255<\/span>: yalnız öz network-ün daxilində qalır, heç vaxt router-dən keçmir.<\/li>\n<li><b>Directed broadcast<\/b> (məsələn <span class=\"m\">192.168.1.255<\/span>): həmin subnet-in broadcast ünvanı. İkinci mövzuda gördün: host bitləri hamısı 1.<\/li>\n<\/ul>\n<p>IPv4-də broadcast var. <b>IPv6-da broadcast yoxdur<\/b>: onun əvəzinə multicast istifadə olunur.<\/p>\n\n<h2 id=\"multicast\">Multicast<\/h2>\n<p>Broadcast-ın problemi: məlumat lazım olmayan cihazlara da çatır. Multicast bu problemi həll edir: məlumat yalnız bu qrupa <b>üzv olmaq istəyən<\/b> cihazlara çatır.<\/p>\n<p><b>Qayda:<\/b> multicast üçün IPv4-də ayrılmış aralıq <span class=\"m\">224.0.0.0 – 239.255.255.255<\/span>-dir. Hər ünvan bir <b>group<\/b>-u təmsil edir. Cihaz group-a qoşulmaq üçün <b>IGMP<\/b> protokolu ilə router-ə (və switch-ə) bildirir (\"239.1.1.1 qrupuna üzv oluram\"). Yalnız üzv olan cihazlar həmin group-un paketini emal edir.<\/p>\n<p><b>Multicast MAC ünvanı necə yaranır:<\/b> hər multicast IP üçün MAC ünvanı hesablanır. Qayda: <span class=\"m\">01:00:5E<\/span> + IP-nin <b>son 23 biti<\/b>.<\/p>\n<pre class=\"pre\"><span class=\"c\"># 239.129.1.1 üçün multicast MAC<\/span>\nIP:        239 . 129 . 1 . 1\n           11101111.<span class=\"k\">1<\/span>0000001.00000001.00000001\n                     <span class=\"c\">↑ bu bit atılır (23 bit götürülür, 24 yox)<\/span>\nSon 23 bit:   0000001.00000001.00000001   → 01 . 01 . 01\nMAC:       01:00:5E:<span class=\"k\">01:01:01<\/span>\n<\/pre>\n<p>İkinci oktetin ilk biti atılır, çünki MAC-də yalnız 23 bit yer var. Buna görə 128-dən böyük ikinci oktet üçün ondan 128 çıxırsan: 129 − 128 = 1. Eyni səbəblə <span class=\"m\">239.1.1.1<\/span>, <span class=\"m\">224.1.1.1<\/span> və <span class=\"m\">239.129.1.1<\/span> ünvanlarının hamısı eyni MAC-ə (<span class=\"m\">01:00:5E:01:01:01<\/span>) düşür. Bir MAC-i 32 fərqli IP group-u paylaşa bilər. Ona görə group ünvanı seçəndə qonşu group-larla toqquşmanı nəzərə almaq lazımdır.<\/p>\n<p>Bundan əvvəl öyrəndiyin I/G biti burada işləyir: MAC-in ilk baytı <span class=\"m\">01<\/span> = 00000001, yəni I/G biti 1: bu, group ünvanıdır (unicast deyil).<\/p>\n<p><b>Switch multicast-ı necə idarə edir:<\/b> adi switch MAC address table-da multicast MAC-i heç vaxt öyrənmir, çünki multicast ünvanı yalnız Destination olur, Source olmur. Buna görə adi switch multicast-a broadcast kimi davranır və <b>bütün portlara göndərir<\/b>. <b>IGMP snooping<\/b> aktiv olanda switch IGMP mesajlarına qulaq asır və hansı portun hansı group-a üzv olduğunu yadda saxlayır. Sonra multicast-ı yalnız üzv portlara göndərir.<\/p>\n<p>Real şəbəkədə ən çox görəcəyin multicast ünvanları (əzbərləmək lazım deyil, tanımaq kifayətdir):<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Ünvan<\/th><th>İstifadə<\/th><\/tr>\n<tr><td class=\"m\">224.0.0.1<\/td><td>Bu network-dəki bütün host-lar<\/td><\/tr>\n<tr><td class=\"m\">224.0.0.2<\/td><td>Bu network-dəki bütün router-lər<\/td><\/tr>\n<tr><td class=\"m\">224.0.0.5, 224.0.0.6<\/td><td>OSPF router-ləri (5-ci hissədə öyrənəcəksən)<\/td><\/tr>\n<tr><td class=\"m\">224.0.0.9<\/td><td>RIPv2 router-ləri<\/td><\/tr>\n<tr><td class=\"m\">224.0.0.22<\/td><td>IGMPv3 üzvlük mesajları<\/td><\/tr>\n<tr><td class=\"m\">224.0.0.251<\/td><td>mDNS (yerli ad axtarışı)<\/td><\/tr>\n<tr><td class=\"m\">239.255.255.250<\/td><td>SSDP (cihaz kəşfi, UPnP)<\/td><\/tr><\/table><\/div>\n<p><span class=\"m\">224.0.0.0/24<\/span> aralığı yalnız yerli link üçündür: router bu paketləri heç vaxt ötürmür.<\/p>\n<div class=\"box box-note\"><h4>Niyə PC-nin ARP cədvəlində 224.x sətirləri var?<\/h4><p>Windows-da <span class=\"m\">arp -a<\/span> yazanda <span class=\"m\">224.0.0.22<\/span>, <span class=\"m\">224.0.0.251<\/span>, <span class=\"m\">239.255.255.250<\/span> və <span class=\"m\">255.255.255.255<\/span> sətirləri statik olaraq görünür, MAC-ləri isə <span class=\"m\">01-00-5e-...<\/span> və <span class=\"m\">ff-ff-ff-ff-ff-ff<\/span> formasındadır. Bunlar yuxarıdakı qaydanın nəticəsidir: sistem bu ünvanlar üçün ARP soruşmur, MAC-i birbaşa hesablayır. Praktikada özün yoxlayacaqsan.<\/p><\/div>\n\n<h2 id=\"anycast\">Anycast<\/h2>\n<p><b>Qayda:<\/b> anycast-da <b>eyni IP ünvanı bir neçə serverə<\/b> təyin olunur. Client bu ünvana paket göndərəndə şəbəkə onu routing baxımından <b>ən yaxın<\/b> serverə çatdırır.<\/p>\n<p><b>Niyə belədir:<\/b> hər server öz yerində (məsələn, müxtəlif şəhərlərdə) həmin IP ünvanını routing protokolu ilə elan edir. Router-lər eyni ünvana iki yol görəndə ən qısa (ən aşağı cost) yolu seçir. Client heç nə bilmir: o, adi unicast kimi bir IP ünvanına göndərir.<\/p>\n<p><b>Burada necə tətbiq olunur:<\/b> ən məşhur nümunə public DNS server-lərdir. Eyni IP ünvanı dünyanın yüzlərlə yerində işləyir və hər client öz yaxınındakına qoşulur. Üstünlüyü: cavab sürətlidir və bir server söndükdə routing ünvanı növbəti ən yaxın serverə yönləndirir, client-in ayarı dəyişmir.<\/p>\n<p>Anycast uzun TCP əlaqələri üçün risklidir: əgər routing dəyişərsə, növbəti paket başqa serverə gedə bilər və əlaqə qırılar. Ona görə anycast daha çox qısa, tək paketlik mübadilələr (DNS, UDP) və ya hər serverin bilik daşıdığı xidmətlər üçün işlədilir.<\/p>\n<div class=\"figure\"><svg viewBox=\"0 0 760 270\" role=\"img\" aria-label=\"Dörd cast növü: kim qəbul edir\">\n<g><text x=\"95\" y=\"24\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Unicast<\/text>\n<rect x=\"60\" y=\"40\" width=\"70\" height=\"34\" rx=\"4\" class=\"fill-blue\"/><text x=\"95\" y=\"62\" text-anchor=\"middle\" font-size=\"12\">Göndərən<\/text>\n<rect x=\"20\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"box-s\"/><text x=\"45\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">A<\/text>\n<rect x=\"70\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"fill-ok\"/><text x=\"95\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">B<\/text>\n<rect x=\"120\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"box-s\"/><text x=\"145\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">C<\/text>\n<line x1=\"95\" y1=\"74\" x2=\"95\" y2=\"130\" class=\"ln\"/><text x=\"95\" y=\"190\" text-anchor=\"middle\" font-size=\"12\" class=\"t-dim\">yalnız B<\/text><\/g>\n<g><text x=\"285\" y=\"24\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Broadcast<\/text>\n<rect x=\"250\" y=\"40\" width=\"70\" height=\"34\" rx=\"4\" class=\"fill-blue\"/><text x=\"285\" y=\"62\" text-anchor=\"middle\" font-size=\"12\">Göndərən<\/text>\n<rect x=\"210\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"fill-ok\"/><text x=\"235\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">A<\/text>\n<rect x=\"260\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"fill-ok\"/><text x=\"285\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">B<\/text>\n<rect x=\"310\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"fill-ok\"/><text x=\"335\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">C<\/text>\n<line x1=\"285\" y1=\"74\" x2=\"235\" y2=\"130\" class=\"ln\"/><line x1=\"285\" y1=\"74\" x2=\"285\" y2=\"130\" class=\"ln\"/><line x1=\"285\" y1=\"74\" x2=\"335\" y2=\"130\" class=\"ln\"/><text x=\"285\" y=\"190\" text-anchor=\"middle\" font-size=\"12\" class=\"t-dim\">hamı<\/text><\/g>\n<g><text x=\"475\" y=\"24\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Multicast<\/text>\n<rect x=\"440\" y=\"40\" width=\"70\" height=\"34\" rx=\"4\" class=\"fill-blue\"/><text x=\"475\" y=\"62\" text-anchor=\"middle\" font-size=\"12\">Göndərən<\/text>\n<rect x=\"400\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"fill-ok\"/><text x=\"425\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">A<\/text>\n<rect x=\"450\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"box-s\"/><text x=\"475\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">B<\/text>\n<rect x=\"500\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"fill-ok\"/><text x=\"525\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">C<\/text>\n<line x1=\"475\" y1=\"74\" x2=\"425\" y2=\"130\" class=\"ln\"/><line x1=\"475\" y1=\"74\" x2=\"525\" y2=\"130\" class=\"ln\"/><text x=\"475\" y=\"190\" text-anchor=\"middle\" font-size=\"12\" class=\"t-dim\">yalnız üzv olanlar (A, C)<\/text><\/g>\n<g><text x=\"665\" y=\"24\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Anycast<\/text>\n<rect x=\"630\" y=\"40\" width=\"70\" height=\"34\" rx=\"4\" class=\"fill-blue\"/><text x=\"665\" y=\"62\" text-anchor=\"middle\" font-size=\"12\">Client<\/text>\n<rect x=\"590\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"fill-ok\"/><text x=\"615\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">S1<\/text>\n<rect x=\"640\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"box-s\"/><text x=\"665\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">S2<\/text>\n<rect x=\"690\" y=\"130\" width=\"50\" height=\"30\" rx=\"4\" class=\"box-s\"/><text x=\"715\" y=\"150\" text-anchor=\"middle\" font-size=\"12\">S3<\/text>\n<line x1=\"665\" y1=\"74\" x2=\"615\" y2=\"130\" class=\"ln\"/><text x=\"665\" y=\"190\" text-anchor=\"middle\" font-size=\"12\" class=\"t-dim\">eyni IP, ən yaxın (S1)<\/text><\/g>\n<text x=\"380\" y=\"240\" text-anchor=\"middle\" font-size=\"12\" class=\"t-dim\">Yaşıl = paketi qəbul edir<\/text>\n<\/svg><div class=\"fig-cap\">Dörd cast növü yan-yana. Broadcast hamıya, multicast yalnız üzvlərə, anycast ən yaxın serverə, unicast bir hədəfə çatır.<\/div><\/div>\n\n<h2 id=\"soc-cast\">Capture-də cast növlərini tanımaq<\/h2>\n<p>Wireshark və ya log-da trafik oxuyanda ilk baxdığın şey Destination ünvanıdır. O, trafikin növünü və normal olub-olmadığını deyir.<\/p>\n<ul>\n<li>Destination MAC <span class=\"m\">ff:ff:ff:ff:ff:ff<\/span>: broadcast. ARP, DHCP Discover. Normal və çox yayılmışdır.<\/li>\n<li>Destination IP <span class=\"m\">224.x.x.x<\/span> və MAC <span class=\"m\">01:00:5e:...<\/span>: multicast. Routing protokolları (OSPF), mDNS, SSDP. Tanımadığın bir multicast qrupu görəndə onun nə üçün olduğunu araşdır.<\/li>\n<li><b>Source MAC həmişə unicast olmalıdır.<\/b> Source MAC-də ilk baytın I/G biti 1-dirsə (məsələn <span class=\"m\">ff:ff:...<\/span> və ya <span class=\"m\">01:00:5e:...<\/span>), bu normal deyil: ya paket saxtadır (crafted), ya da cihaz xətalıdır. Heç bir normal cihaz öz kadrını broadcast ünvanından göndərmir.<\/li>\n<li>Çox sayda broadcast saniyədə: <b>broadcast storm<\/b> əlamətidir (adətən Layer 2 loop). Bunu 5-ci hissədə, STP mövzusunda görəcəksən.<\/li>\n<\/ul>\n<details class=\"box box-think\"><summary>Dayan və düşün: niyə Source MAC broadcast ola bilməz?<\/summary><div class=\"ans\">Source MAC kadrı göndərənin kimliyidir və switch onu \"bu MAC hansı portdadır\" cədvəlinə yazır. Group ünvanı (I/G = 1) bir cihazı göstərmir, yəni cihazın ünvanı ola bilməz. Standart Source MAC üçün yalnız unicast ünvana icazə verir. Ona görə belə kadr görsən, ya xətadır, ya da bilərəkdən hazırlanmış (saxta) paketdir.<\/div><\/details>\n<div class=\"box box-pt\"><h4>Packet Tracer-də sübut et<\/h4><p>Packet Tracer-i artıq tanıyırsansa: Simulation mode-da bir PC-dən başqa PC-yə ilk dəfə ping at. İlk paket ARP sorğusu olur və Destination MAC <span class=\"m\">FFFF.FFFF.FFFF<\/span> yazılır. Switch onu bütün portlara göndərir. Cavab (ARP reply) isə unicast olur. Bu mövzuda Packet Tracer tələb olunmur; 8-ci mövzudan sonra özün yoxlaya bilərsən.<\/p><\/div>\n","p1/t05/cheat":"<h2>Qısa xülasə<\/h2>\n<div class=\"cheat-box\"><ul class=\"cheat\">\n<li>ARP IP ünvanını eyni link-dəki cihazın MAC ünvanına çevirir.<\/li>\n<li>Kadr qurmaq üçün Destination MAC lazımdır. IP-dən MAC hesablanmır, soruşulur.<\/li>\n<li><b>ARP request<\/b>: broadcast (Dst MAC FF:FF:FF:FF:FF:FF), Opcode 1, Target MAC 00:00:00:00:00:00.<\/li>\n<li><b>ARP reply<\/b>: unicast, Opcode 2, Sender MAC axtarılan cavabdır.<\/li>\n<li>ARP Ethernet-də EtherType <span class=\"m\">0x0806<\/span> ilə gedir. IP-nin içində deyil. Mesaj 28 bayt.<\/li>\n<li>Eyni network: ARP hədəfin IP-sini soruşur.<\/li>\n<li>Fərqli network: ARP <b>gateway<\/b>-in IP-sini soruşur. Kadrda Dst MAC = gateway MAC, Dst IP = son hədəf.<\/li>\n<li>ARP broadcast router-dən keçmir.<\/li>\n<li>Nəticələr <b>ARP cache<\/b>-də saxlanır. Növbəti paketdə ARP təkrarlanmır.<\/li>\n<li>Dynamic girişlər vaxt keçəndə silinir. Static girişlər silinmir. Cisco IOS-da default timeout 4 saat.<\/li>\n<li>İlk ping-də ARP gözləndiyi üçün cavab adətən sonrakılardan yavaş olur.<\/li>\n<li>\"Yerli şəbəkə işləyir, internet işləmir\" əlaməti: gateway-in MAC-i öyrənilməyib (gateway IP səhvdir və ya cavab vermir).<\/li>\n<li>ARP cache (IP → MAC, host və router) ilə MAC address table (MAC → port, switch) fərqli cədvəllərdir.<\/li>\n<li><b>Gratuitous ARP<\/b>: cihaz öz IP-sini elan edir (Sender IP = Target IP). Duplicate IP yoxlaması və cache yeniləməsi üçündür.<\/li>\n<li><b>Proxy ARP<\/b>: router başqa network-dəki cihaz əvəzinə cavab verir.<\/li>\n<li><b>ARP spoofing<\/b>: ARP-da autentifikasiya yoxdur, hücumçu saxta reply ilə cache-i zəhərləyir (man-in-the-middle).<\/li>\n<li>Aşkar etmə: iki IP-nin eyni MAC-i, gateway MAC-inin dəyişməsi, soruşulmamış çoxlu ARP reply.<\/li>\n<li>Müdafiə: <b>Dynamic ARP Inspection (DAI)<\/b>, statik ARP, port security, şifrələnmiş protokollar.<\/li>\n<\/ul><\/div>\n<h2>Bu mövzudakı əmrlər<\/h2>\n<table class=\"cmd-table\">\n<tr><td>arp -a<span class=\"where\">Windows CMD, Linux, PT PC<\/span><\/td><td>ARP cache-i göstərir.<\/td><\/tr>\n<tr><td>arp -d *<span class=\"where\">Windows CMD (admin)<\/span><\/td><td>Bütün dinamik girişləri silir.<\/td><\/tr>\n<tr><td>arp -s &lt;IP&gt; &lt;MAC&gt;<span class=\"where\">Windows CMD (admin)<\/span><\/td><td>Statik giriş əlavə edir.<\/td><\/tr>\n<tr><td>show ip arp<span class=\"where\">Cisco router, L3 switch<\/span><\/td><td>Cihazın ARP cache-ini göstərir.<\/td><\/tr>\n<tr><td>clear arp-cache<span class=\"where\">Cisco router<\/span><\/td><td>Cihazın dinamik ARP girişlərini silir.<\/td><\/tr>\n<\/table>\n<h2>ARP request və reply<\/h2>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Sahə<\/th><th>Request<\/th><th>Reply<\/th><\/tr>\n<tr><td>Ethernet Dst MAC<\/td><td class=\"m\">FF:FF:FF:FF:FF:FF<\/td><td>Soruşanın MAC-i<\/td><\/tr>\n<tr><td>Opcode<\/td><td class=\"m\">1<\/td><td class=\"m\">2<\/td><\/tr>\n<tr><td>Sender MAC / IP<\/td><td>Soruşan<\/td><td>Cavab verən<\/td><\/tr>\n<tr><td>Target MAC<\/td><td class=\"m\">00:00:00:00:00:00<\/td><td>Soruşanın MAC-i<\/td><\/tr>\n<tr><td>Target IP<\/td><td>Axtarılan IP<\/td><td>Soruşanın IP-si<\/td><\/tr><\/table><\/div>\n","p1/t05/explain":"<h2 id=\"arp-why\">ARP nə üçün lazımdır?<\/h2>\n<p>Ping və ya veb sorğusu göndərəndə proqram yalnız <b>IP ünvanını<\/b> bilir. Amma kadr qurmaq üçün Ethernet başlığında <b>Destination MAC<\/b> lazımdır. Switch də, NIC də yalnız MAC-ə baxır. Deməli göndərməzdən əvvəl bir sual cavablandırılmalıdır: <b>bu IP ünvanının MAC-i nədir?<\/b><\/p>\n<p><b>Qayda:<\/b> bu suala cavab verən protokol <b>ARP<\/b>-dır (Address Resolution Protocol). ARP IP ünvanını eyni link-dəki cihazın MAC ünvanına çevirir.<\/p>\n<p><b>Niyə belədir:<\/b> IP ilə MAC arasında heç bir riyazi əlaqə yoxdur (birinci mövzuda gördün: MAC kartın içinə yazılır, IP isə administrator və ya DHCP təyin edir). Ona görə cavabı hesablamaq olmaz, kimdənsə soruşmaq lazımdır. ARP məhz bu soruşma mexanizmidir.<\/p>\n<p><b>Burada necə tətbiq olunur:<\/b> ARP Layer 2 ilə Layer 3 arasında işləyir. Hər host ARP nəticələrini <b>ARP cache<\/b> adlı cədvəldə saxlayır ki, hər paketdə yenidən soruşmasın.<\/p>\n\n<h2 id=\"arp-flow\">ARP necə işləyir: eyni network<\/h2>\n<p>PC1 (192.168.1.10) eyni network-dəki PC2-yə (192.168.1.20) ping göndərir. Əvvəl ikinci mövzudakı qərar: eyni network-dür, yəni paket birbaşa PC2-yə gedəcək. İndi MAC lazımdır:<\/p>\n<ol>\n<li><b>Cache yoxlanılır.<\/b> PC1 ARP cache-ində 192.168.1.20 axtarır. Giriş yoxdursa, ARP başlayır.<\/li>\n<li><b>ARP request.<\/b> PC1 \"192.168.1.20 kimdir? MAC-ini mənə de\" sualını <b>broadcast<\/b> kimi göndərir (Destination MAC = FF:FF:FF:FF:FF:FF). Çünki cavab verənin MAC-ini bilmir.<\/li>\n<li><b>Switch flood edir.<\/b> Switch broadcast-ı gələn port istisna olmaqla bütün portlara göndərir.<\/li>\n<li><b>Yalnız hədəf cavab verir.<\/b> Hamı sorğunu alır, amma Target IP yalnız PC2-yə uyğundur. Digərləri sorğunu atır.<\/li>\n<li><b>ARP reply.<\/b> PC2 <b>unicast<\/b> cavab göndərir: \"192.168.1.20 mənəm, MAC-im budur\". Unicast ola bilər, çünki PC2 sorğudan PC1-in MAC-ini artıq bilir (Sender MAC sahəsində var idi).<\/li>\n<li><b>Cache yenilənir.<\/b> PC1 cavabı cache-ə yazır. İndi ping paketi (ICMP echo request) düzgün Destination MAC ilə göndərilir.<\/li>\n<\/ol>\n<pre class=\"pre\"><span class=\"c\"># ARP mübadiləsi (iki kadr)<\/span>\nPC1 → hamı     <span class=\"k\">ARP request<\/span>  (broadcast)  \"192.168.1.20 kimdir?\"\nPC2 → PC1      <span class=\"k\">ARP reply<\/span>    (unicast)    \"192.168.1.20 mənəm, MAC: 0001.4321.BBBB\"\nPC1 → PC2      ICMP echo request  (indi MAC məlumdur)\n<\/pre>\n<p>Simulyatorda hər addımı özün keç. Əvvəl təxmin et, sonra cavabı gör:<\/p>\n<div data-sim=\"arpsim\"><\/div>\n<p>Switch də bu mübadilədən öyrənir: ARP request-də PC1-in Source MAC-ini, reply-da PC2-nin Source MAC-ini öz MAC address table-ına yazır. Bunu 7-ci mövzuda ətraflı görəcəksən.<\/p>\n<details class=\"box box-think\"><summary>Dayan və düşün: PC1 növbəti ping-i atanda ARP yenidən göndərilirmi?<\/summary><div class=\"ans\">Xeyr. PC1 192.168.1.20 → MAC cütünü ARP cache-ə yazıb. Növbəti paketdə cache-dən istifadə edir və kadrı birbaşa qurur. Cache girişi bir müddət sonra silinir (vaxt cihazdan asılıdır), ondan sonra ARP təkrarlanır. Ona görə ilk ping-də cavab müddəti adətən sonrakılardan uzun olur: ilk paket ARP-ı gözləyir.<\/div><\/details>\n\n<h2 id=\"arp-other-net\">Fərqli network üçün ARP: kimin MAC-i soruşulur?<\/h2>\n<p>İndi PC1 başqa network-dəki 10.0.0.5-ə ping göndərir. Mask yoxlaması: fərqli network. İkinci mövzudan bilirsən: PC1 paketi <b>default gateway-ə<\/b> göndərəcək.<\/p>\n<p><b>Qayda:<\/b> ARP həmişə <b>eyni link-dəki<\/b> cihazın MAC-ini soruşur. Hədəf fərqli network-dədirsə, ARP hədəfin yox, <b>gateway-in<\/b> IP-sini soruşur.<\/p>\n<p><b>Niyə belədir:<\/b> ARP sorğusu broadcast-dır və router-dən keçmir. 10.0.0.5 başqa broadcast domain-də olduğu üçün PC1 onun MAC-ini heç vaxt öyrənə bilməz. Üstəlik buna ehtiyac da yoxdur: kadr link-də gateway-ə çatmalıdır, gateway isə paketi sonra yönləndirir.<\/p>\n<p><b>Nəticə:<\/b> kadrda iki fərqli ünvan olur: <b>Destination MAC = gateway-in MAC-i<\/b> (bu link üçün hədəf) və <b>Destination IP = 10.0.0.5<\/b> (son hədəf). Üçüncü mövzuda gördüyün qayda budur: MAC bir link üçündür, IP isə son hədəf üçündür.<\/p>\n<pre class=\"pre\"><span class=\"c\"># PC1 (192.168.1.10/24, gateway 192.168.1.1) → 10.0.0.5<\/span>\n1. 10.0.0.5 eyni network-dədir?   Xeyr  → gateway-ə göndər\n2. ARP soruşur:   \"<span class=\"k\">192.168.1.1<\/span> kimdir?\"      <span class=\"c\">(10.0.0.5 yox!)<\/span>\n3. Router cavab verir: \"192.168.1.1 mənəm, MAC: ...DDDD\"\n4. ICMP kadrı:    Dst MAC = <span class=\"k\">...DDDD (router)<\/span>,  Dst IP = <span class=\"k\">10.0.0.5<\/span>\n<\/pre>\n<details class=\"box box-think\"><summary>Dayan və düşün: gateway ünvanı səhv yazılsa nə olar?<\/summary><div class=\"ans\">PC1 səhv IP üçün ARP göndərər, amma bu IP-də heç kim cavab vermədiyi üçün gateway-in MAC-i öyrənilmir. Kadr qurula bilmir və fərqli network-lərə heç bir paket çıxmır, amma eyni network-dəki cihazlara ping normal işləyir (onlar üçün ARP uğurludur). Bu klassik əlamətdir: \"yerli şəbəkə işləyir, internet işləmir\". Linux və Cisco cihazlarında cache-də belə giriş incomplete kimi görünür.<\/div><\/details>\n\n<h2 id=\"arp-packet\">ARP paketinin içi<\/h2>\n<p>ARP ayrıca protokoldur və IP-nin içində getmir: Ethernet başlığından sonra birbaşa ARP mesajı gəlir. Ethernet başlığında <b>EtherType = 0x0806<\/b> yazılır (IPv4 üçün 0x0800 idi). ARP mesajı 28 baytdır.<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Sahə<\/th><th>ARP request-də<\/th><th>ARP reply-da<\/th><\/tr>\n<tr><td>Opcode<\/td><td class=\"m\">1 (request)<\/td><td class=\"m\">2 (reply)<\/td><\/tr>\n<tr><td>Sender MAC<\/td><td>Soruşanın MAC-i<\/td><td>Cavab verənin MAC-i (axtarılan cavab)<\/td><\/tr>\n<tr><td>Sender IP<\/td><td>Soruşanın IP-si<\/td><td>Cavab verənin IP-si<\/td><\/tr>\n<tr><td>Target MAC<\/td><td class=\"m\">00:00:00:00:00:00 (bilinmir)<\/td><td>Soruşanın MAC-i<\/td><\/tr>\n<tr><td>Target IP<\/td><td>MAC-i axtarılan IP<\/td><td>Soruşanın IP-si<\/td><\/tr><\/table><\/div>\n<p>Request-də Target MAC sıfırdır, çünki məhz bunu soruşur. Reply-da Sender MAC axtarılan cavabdır. Aşağıda real ARP request kadrının baytları var. Hər baytın üstünə klik et və sahəsini gör (Destination MAC-in hamısı <span class=\"m\">ff<\/span>, EtherType <span class=\"m\">08 06<\/span>, Opcode <span class=\"m\">00 01<\/span>):<\/p>\n<div data-sim=\"hexdump\" data-opts='{\"frame\":\"arp\"}'><\/div>\n\n<h2 id=\"arp-cache\">ARP cache<\/h2>\n<p>ARP cache IP → MAC cütlərini saxlayan cədvəldir. Windows-da <span class=\"m\">arp -a<\/span> ilə baxırsan:<\/p>\n<pre class=\"pre\"><span class=\"p\">C:\\&gt;<\/span>arp -a\n\nInterface: 192.168.1.10 --- 0xb\n  Internet Address      Physical Address      Type\n  192.168.1.1           00-01-43-21-dd-dd     <span class=\"k\">dynamic<\/span>\n  192.168.1.20          00-01-43-21-bb-bb     <span class=\"k\">dynamic<\/span>\n  224.0.0.22            01-00-5e-00-00-16     <span class=\"k\">static<\/span>\n  255.255.255.255       ff-ff-ff-ff-ff-ff     <span class=\"k\">static<\/span>\n<\/pre>\n<p><b>dynamic<\/b> girişlər ARP ilə öyrənilib və bir müddət sonra silinir. <b>static<\/b> girişlər ya sistem tərəfindən (multicast və broadcast üçün, dördüncü mövzudakı kimi), ya da administrator tərəfindən əllə əlavə olunub və silinmir. Dinamik girişin ömrü sistemdən asılıdır: Windows-da adətən bir neçə dəqiqə, Cisco IOS-da default olaraq 4 saatdır.<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Əmr<\/th><th>Harada<\/th><th>Nə edir<\/th><\/tr>\n<tr><td class=\"m\">arp -a<\/td><td>Windows, Linux<\/td><td>ARP cache-i göstərir<\/td><\/tr>\n<tr><td class=\"m\">arp -d *<\/td><td>Windows (admin)<\/td><td>Cache-i təmizləyir<\/td><\/tr>\n<tr><td class=\"m\">arp -s IP MAC<\/td><td>Windows (admin)<\/td><td>Statik giriş əlavə edir<\/td><\/tr>\n<tr><td class=\"m\">show ip arp<\/td><td>Cisco router, L3 switch<\/td><td>Cihazın ARP cache-ini göstərir<\/td><\/tr>\n<tr><td class=\"m\">show mac address-table<\/td><td>Cisco switch<\/td><td>Bu ARP deyil: switch-in MAC → port cədvəlidir<\/td><\/tr><\/table><\/div>\n<div class=\"box box-note\"><h4>İki fərqli cədvəl<\/h4><p>Yeni başlayanlar tez-tez bunları qarışdırır. <b>ARP cache<\/b> host və router-lərdə olur və IP → MAC saxlayır (Layer 3-dən Layer 2-yə). <b>MAC address table<\/b> switch-də olur və MAC → port saxlayır (Layer 2). Switch ARP cache saxlamır (idarəetmə IP-si üçün istisna), host isə MAC address table saxlamır.<\/p><\/div>\n\n<h2 id=\"arp-special\">Xüsusi hallar: gratuitous ARP və proxy ARP<\/h2>\n<p><b>Gratuitous ARP:<\/b> cihaz heç kimin soruşmadığı halda öz IP-sinin MAC-ini elan edir (Sender IP = Target IP). İki məqsədi var: (1) yeni qoşulan cihaz öz IP-sini işlədən başqa cihaz olub-olmadığını yoxlayır (duplicate IP detection), (2) IP-nin MAC-i dəyişəndə (məsələn failover) digər cihazlar cache-lərini yeniləyir. Capture-də \"gratuitous\" yazılan sətri gördükdə bunun niyə olduğunu düşün: yeni qoşulma, IP dəyişikliyi və ya hücum.<\/p>\n<p><b>Proxy ARP:<\/b> router başqa network-dəki cihaz əvəzinə ARP cavabı verir. Host səhv mask-la hədəfi \"eyni network\" sayıb ARP göndərəndə router öz MAC-ini verir və paketi yönləndirir. Beləliklə yanlış konfiqurasiya bəzən gizli şəkildə işləyir. Proxy ARP Cisco router interface-lərində adətən default aktivdir; konfiqurasiya səhvləri qarşısını almaq üçün çox yerdə söndürülür. İkinci mövzudakı səhv mask hallarında niyə bəzən \"işləyir, amma qəribədir\" olduğunu bununla izah edə bilərsən.<\/p>\n\n<h2 id=\"arp-attack\">ARP spoofing: hücum və müdafiə<\/h2>\n<div class=\"box box-attack\"><h4>ARP spoofing (ARP poisoning)<\/h4>\n<p><b>Problem:<\/b> ARP-da heç bir yoxlama yoxdur. Cihaz ARP reply alanda \"bu cavabı verən doğrudan həmin IP-nin sahibidirmi?\" yoxlamır. Çox əməliyyat sistemi hətta soruşulmamış (unsolicited) reply-i də qəbul edib cache-ini yeniləyir.<\/p>\n<div class=\"attack-cols\">\n<div class=\"atk\"><h5>Hücum necə işləyir<\/h5><p>Eyni network-dəki hücumçu qurbana saxta ARP reply göndərir: \"192.168.1.1 (gateway) mənim MAC-imdədir\". Qurban cache-də gateway-in MAC-ini hücumçunun MAC-i ilə əvəz edir. Qurbanın trafiki gateway əvəzinə hücumçuya gedir. Hücumçu onu oxuyub gateway-ə ötürsə (man-in-the-middle), qurban heç nə hiss etmir.<\/p><\/div>\n<div class=\"def\"><h5>Necə aşkar edirsən<\/h5><p>İki fərqli IP-nin eyni MAC ilə cache-də görünməsi (xüsusən gateway IP-sinin MAC-inin dəyişməsi). Capture-də: soruşulmamış çoxlu ARP reply, eyni IP üçün fərqli MAC-lərdən cavablar (Wireshark bunu duplicate IP address warning kimi göstərir).<\/p><\/div>\n<\/div>\n<div class=\"attack-cols\">\n<div class=\"atk\"><h5>Nəticə<\/h5><p>Trafikin dinlənilməsi, parolların oğurlanması (şifrəsiz protokollarda), sessiyanın ələ keçirilməsi, ya da sadəcə trafiki atıb xidməti dayandırmaq.<\/p><\/div>\n<div class=\"def\"><h5>Müdafiə<\/h5><p><b>Dynamic ARP Inspection (DAI)<\/b>: switch hər ARP paketini DHCP snooping cədvəlindəki IP-MAC-port cütü ilə yoxlayır və uyğun gəlməyəni atır (4-cü hissədə öyrənəcəksən). Əlavə: kritik cihazlar (gateway) üçün statik ARP, port security, şifrələnmiş protokollar (HTTPS), şəbəkənin VLAN-larla bölünməsi.<\/p><\/div>\n<\/div><\/div>\n<p>Bu hücumun niyə işlədiyini artıq bilirsən: ARP broadcast-dır, hamı eşidir və kimliyin yoxlanması yoxdur. Müdafiənin switch-də olması da məntiqlidir: ARP kadrları switch-dən keçir, switch isə bu kadrları IP-MAC-port cütləri ilə müqayisə edə bilən ən əlverişli nöqtədir.<\/p>\n<div class=\"box box-pt\"><h4>Packet Tracer-də sübut et<\/h4><p>Packet Tracer-i artıq tanıyırsansa: iki PC və bir switch qur, PC-lərə eyni network-dən IP ver. Simulation mode-da bir PC-dən digərinə ping at və event list-də ilk iki paketə bax: ARP request (broadcast) və ARP reply (unicast). Sonra PC-nin Command Prompt-unda <span class=\"m\">arp -a<\/span> yaz. Packet Tracer-in PC-sində <span class=\"m\">arp -a<\/span> mövcuddur və cache-i göstərir. Bu mövzuda Packet Tracer tələb olunmur.<\/p><\/div>\n","p1/t06/cheat":"<h2>Qısa xülasə<\/h2>\n<div class=\"cheat-box\"><ul class=\"cheat\">\n<li><b>ICMP<\/b> IP-nin diaqnostika və xəta protokoludur. IP başlığında <span class=\"m\">Protocol = 1<\/span> ilə gedir. Port yoxdur, <b>Type<\/b> və <b>Code<\/b> var.<\/li>\n<li>Type 8 = <b>Echo Request<\/b>, Type 0 = <b>Echo Reply<\/b>, Type 3 = <b>Destination Unreachable<\/b>, Type 11 = <b>Time Exceeded<\/b>.<\/li>\n<li>Type 3 Code: 0 network, 1 host, 3 port, 4 fragmentasiya lazımdır (Path MTU Discovery üçün vacibdir).<\/li>\n<li>Ping cavabı = <b>iki istiqamətli<\/b> yol işləyir: sorğu getdi və cavab qayıtdı.<\/li>\n<li><span class=\"m\">Request timed out<\/span>: cavab gəlmədi, <b>səbəb məlum deyil<\/b> (söndürülüb, firewall, qayıdış marşrutu yoxdur və s.).<\/li>\n<li><span class=\"m\">Reply from &lt;öz IP&gt;: Destination host unreachable<\/span>: problem PC-nin yanındadır (ARP cavab almır).<\/li>\n<li><span class=\"m\">Reply from &lt;gateway&gt;: Destination host unreachable<\/span>: paket router-ə çatdı, router onu hədəfə çatdıra bilmir (çox vaxt marşrut yoxdur).<\/li>\n<li><span class=\"m\">TTL expired in transit<\/span>: paketin TTL-i yolda bitdi. Uzun yol və ya <b>routing loop<\/b>.<\/li>\n<li><b>TTL<\/b>: hər router 1 azaldır. 0 olanda router paketi atır və mənbəyə Time Exceeded göndərir.<\/li>\n<li>İlkin TTL: <b>64<\/b> Linux/macOS, <b>128<\/b> Windows, <b>255<\/b> Cisco IOS. Cavabdakı TTL = ilkin − keçən router sayı.<\/li>\n<li>TTL-dən OS və hop sayı çıxarmaq <b>təxmindir<\/b>, sübut deyil.<\/li>\n<li><b>tracert<\/b> TTL-i 1, 2, 3 ... artırır. Hər atan router Time Exceeded ilə özünü bildirir. Sonuncu sətir hədəfdirsə, yol işləyir.<\/li>\n<li>Ortada tək <span class=\"m\">* * *<\/span> və sonra hədəf cavab verirsə: yol işləyir (həmin router sadəcə cavab vermir). Bütün sonrakı hop-lar <span class=\"m\">*<\/span>-dırsa: yol <b>son cavab verən hop-dan sonra<\/b> qırılır.<\/li>\n<li>Ping ardıcıllığı: 127.0.0.1 → öz IP → gateway → uzaq IP → ad. İlk uğursuz addım problemin layer-ini göstərir.<\/li>\n<li>IP ilə ping işləyir, ad ilə işləmir: problem <b>DNS<\/b>-dir.<\/li>\n<li>SOC: bir mənbə, çoxlu fərqli hədəf, Echo Request = <b>ping sweep<\/b> (kəşfiyyat). Ping cavabları (Type 0) sweep deyil.<\/li>\n<li>ICMP-ni tamamilə bloklama: Path MTU Discovery və diaqnostika pozulur. Lazım olan tiplərə icazə ver, qalanını məhdudlaşdır və log-a yaz.<\/li>\n<\/ul><\/div>\n<h2>Bu mövzudakı əmrlər<\/h2>\n<table class=\"cmd-table\">\n<tr><td>ping &lt;ip&gt;<span class=\"where\">Windows CMD, Linux, PT PC<\/span><\/td><td>Echo Request göndərir, cavabları və itkini göstərir.<\/td><\/tr>\n<tr><td>ping -n 10 &lt;ip&gt;<span class=\"where\">Windows CMD<\/span><\/td><td>10 sorğu göndərir. Linux-da: <span class=\"m\">ping -c 10<\/span>.<\/td><\/tr>\n<tr><td>ping -t &lt;ip&gt;<span class=\"where\">Windows CMD<\/span><\/td><td>Dayandırana qədər (Ctrl+C) göndərir.<\/td><\/tr>\n<tr><td>ping -l 1400 &lt;ip&gt;<span class=\"where\">Windows CMD<\/span><\/td><td>Məlumat hissəsinin ölçüsünü 1400 bayt edir.<\/td><\/tr>\n<tr><td>ping 127.0.0.1<span class=\"where\">hər yerdə<\/span><\/td><td>PC-nin öz TCP/IP stack-ını yoxlayır (şəbəkəyə çıxmır).<\/td><\/tr>\n<tr><td>tracert &lt;ip&gt;<span class=\"where\">Windows CMD, PT PC<\/span><\/td><td>Hədəfə gedən yolun router-lərini göstərir.<\/td><\/tr>\n<tr><td>traceroute &lt;ip&gt;<span class=\"where\">Linux, macOS, Cisco IOS<\/span><\/td><td>Windows tracert-in analoqu.<\/td><\/tr>\n<\/table>\n<h2>Ping nəticələrinin xəritəsi<\/h2>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Ekranda<\/th><th>Kim yazdı<\/th><th>İlk baxacağın yer<\/th><\/tr>\n<tr><td class=\"m\">Reply from hədəf<\/td><td>Hədəf<\/td><td>Heç nə: yol işləyir<\/td><\/tr>\n<tr><td class=\"m\">Request timed out<\/td><td>Heç kim<\/td><td>tracert ilə yol, hədəfin firewall-u, qayıdış marşrutu<\/td><\/tr>\n<tr><td><span class=\"m\">Reply from öz IP: unreachable<\/span><\/td><td>PC<\/td><td>Hədəfin IP-si, ARP, kabel, VLAN<\/td><\/tr>\n<tr><td><span class=\"m\">Reply from gateway: unreachable<\/span><\/td><td>Router<\/td><td>Router-in marşrut cədvəli<\/td><\/tr>\n<tr><td><span class=\"m\">TTL expired in transit<\/span><\/td><td>Router<\/td><td>tracert-də təkrarlanan hop-lar (routing loop)<\/td><\/tr>\n<tr><td class=\"m\">General failure<\/td><td>PC<\/td><td>Adapter, default gateway<\/td><\/tr><\/table><\/div>\n","p1/t06/explain":"<h2 id=\"icmp-what\">ICMP nədir və niyə lazımdır?<\/h2>\n<p>IP paketi göndərəndə heç bir təminat yoxdur: paket çatmaya bilər, router atmış ola bilər, hədəf söndürülmüş ola bilər. Üstəlik IP özü bu barədə göndərənə heç nə demir. Göndərən paketin harada və niyə itdiyini bilməlidir, yoxsa şəbəkədəki problemi tapmaq mümkün olmazdı.<\/p>\n<p><b>Qayda:<\/b> <b>ICMP<\/b> (Internet Control Message Protocol) IP-nin kömək protokoludur. O, diaqnostika və xəta mesajları daşıyır: \"hədəf tapılmadı\", \"paketin TTL-i bitdi\", \"sənə cavab verirəm\".<\/p>\n<p><b>Niyə belədir:<\/b> xəta məlumatını daşıyacaq ayrıca kanal yoxdur, ona görə bu mesajlar da IP paketinin içində gedir. IPv4 başlığındakı <b>Protocol = 1<\/b> sahəsi içəridə ICMP olduğunu göstərir (üçüncü mövzuda gördün: 6 TCP, 17 UDP, 1 ICMP).<\/p>\n<p><b>Mühüm fərq:<\/b> ICMP-də <b>port yoxdur<\/b>. Port TCP və UDP başlığının sahəsidir. ICMP-də isə <b>Type<\/b> və <b>Code<\/b> sahələri var: Type mesajın növünü, Code isə onun dəqiq səbəbini göstərir.<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Type<\/th><th>Ad<\/th><th>Mənası<\/th><\/tr>\n<tr><td class=\"m\">8<\/td><td>Echo Request<\/td><td>\"Orada kimsə var?\" Ping sorğusu<\/td><\/tr>\n<tr><td class=\"m\">0<\/td><td>Echo Reply<\/td><td>\"Bəli, buradayam.\" Ping cavabı<\/td><\/tr>\n<tr><td class=\"m\">3<\/td><td>Destination Unreachable<\/td><td>Hədəfə çatmaq mümkün olmadı. Code səbəbi deyir: 0 network, 1 host, 3 port, 4 fragmentasiya lazımdır<\/td><\/tr>\n<tr><td class=\"m\">11<\/td><td>Time Exceeded<\/td><td>Paketin TTL-i 0 oldu, router atdı<\/td><\/tr><\/table><\/div>\n<p>ICMP-nin başqa tipləri də var (məsələn Redirect, Router Advertisement), amma gündəlik işdə bu dördünü tanıyırsan. Type 3-də Code səbəbi dəqiqləşdirir: Code 0 \"network\", Code 1 \"host\" deməkdir. Windows ekranında bu <span class=\"m\">Destination net unreachable<\/span> və ya <span class=\"m\">Destination host unreachable<\/span> kimi görünür.<\/p>\n\n<h2 id=\"ping\">Ping necə işləyir<\/h2>\n<p><b>Qayda:<\/b> <span class=\"m\">ping<\/span> hədəfə ICMP <b>Echo Request<\/b> (Type 8) göndərir. Hədəf cihaz bunu alırsa, <b>Echo Reply<\/b> (Type 0) ilə cavab verir. Ping cavabı alınıbsa, <b>iki istiqamətdə<\/b> yol işləyir: sorğu getdi və cavab qayıtdı.<\/p>\n<p><b>Niyə bu vacibdir:<\/b> yalnız bir istiqamətin işləməsi kifayət etmir. Əgər sorğu çatır, amma cavabın qayıdış marşrutu yoxdursa, ping uğursuz olacaq. Bu, \"ping işləmir\" şikayətlərinin çoxunun səbəbidir və sonrakı hissələrdə routing-də tez-tez qarşılaşacaqsan.<\/p>\n<pre class=\"pre\"><span class=\"p\">C:\\&gt;<\/span>ping 192.168.1.20\n\nPinging 192.168.1.20 with 32 bytes of data:\nReply from 192.168.1.20: bytes=32 time&lt;1ms TTL=128\nReply from 192.168.1.20: bytes=32 time&lt;1ms TTL=128\nReply from 192.168.1.20: bytes=32 time&lt;1ms TTL=128\nReply from 192.168.1.20: bytes=32 time&lt;1ms TTL=128\n\nPing statistics for 192.168.1.20:\n    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),\n<\/pre>\n<p>Çıxışın hər hissəsinin mənası var:<\/p>\n<ul>\n<li><b>bytes=32<\/b>: ICMP məlumat hissəsinin ölçüsü (Windows-da default 32 bayt, Linux-da 56).<\/li>\n<li><b>time<\/b>: sorğu göndərilən andan cavab alınana qədər keçən vaxt (round-trip time).<\/li>\n<li><b>TTL<\/b>: <b>cavab<\/b> paketinin gəldikdə qalan TTL-i. Bunu bir azdan oxumağı öyrənəcəyik.<\/li>\n<li><b>Sent / Received / Lost<\/b>: neçə sorğu getdi, neçə cavab gəldi. Hər ikisi kritikdir: 100% loss ayrı, 25% loss ayrı problemdir.<\/li>\n<\/ul>\n<p>Əsas parametrlər (Windows): <span class=\"m\">ping -n 10 ünvan<\/span> (10 sorğu), <span class=\"m\">ping -t ünvan<\/span> (dayandırana qədər, Ctrl+C), <span class=\"m\">ping -l 1400 ünvan<\/span> (məlumat ölçüsünü 1400 bayt et). Linux-da <span class=\"m\">-n<\/span> əvəzinə <span class=\"m\">-c<\/span> yazılır.<\/p>\n<div class=\"box box-pt\"><h4>Packet Tracer-də ilk ping<\/h4><p>Packet Tracer-də ilk ping-də ilk paket çox vaxt <span class=\"m\">Request timed out<\/span> göstərir, qalanları isə uğurlu olur. Səbəb çox vaxt ARP-dır (beşinci mövzu): ilk paket hədəfin MAC-i öyrənilənə qədər gözləyir. Real şəbəkədə də ilk ping adətən daha yavaşdır. Bunu 8-ci mövzudan sonra özün Simulation mode-da görə bilərsən. Bu mövzuda Packet Tracer tələb olunmur.<\/p><\/div>\n\n<h2 id=\"ping-results\">Ping nəticələrini oxumaq<\/h2>\n<p>Ping uğursuz olanda mesajın <b>mətni<\/b> və <b>kim göndərdiyi<\/b> səbəbin haradan axtarılacağını göstərir. Əsas fərqlər:<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Mesaj<\/th><th>Kim göndərir<\/th><th>Nə deməkdir<\/th><\/tr>\n<tr><td><span class=\"m\">Reply from 10.0.0.5: bytes=32 ...<\/span><\/td><td>Hədəf<\/td><td>Uğurlu. İki istiqamətdə yol işləyir.<\/td><\/tr>\n<tr><td class=\"m\">Request timed out<\/td><td>Heç kim<\/td><td>Cavab gəlmədi. Səbəb məlum deyil: hədəf söndürülüb, firewall atır, qayıdış marşrutu yoxdur və s.<\/td><\/tr>\n<tr><td><span class=\"m\">Reply from <b>PC-nin öz IP-si<\/b>: Destination host unreachable<\/span><\/td><td>PC özü<\/td><td>PC paketi çıxara bilmir: eyni network üçün ARP cavabı gəlmir, ya da yerli marşrut yoxdur.<\/td><\/tr>\n<tr><td><span class=\"m\">Reply from <b>192.168.1.1<\/b> (gateway): Destination host unreachable<\/span><\/td><td>Router<\/td><td>Paket router-ə çatdı, amma router onu hədəfə çatdıra bilmir (çox vaxt marşrut yoxdur). Cihazdan asılı olaraq <span class=\"m\">net unreachable<\/span> da yazıla bilər.<\/td><\/tr>\n<tr><td><span class=\"m\">Reply from 192.168.1.1: TTL expired in transit<\/span><\/td><td>Router<\/td><td>Paketin TTL-i yolda bitdi: ya yol çox uzundur, ya da routing loop var.<\/td><\/tr>\n<tr><td><span class=\"m\">PING: transmit failed. General failure.<\/span><\/td><td>PC özü<\/td><td>PC paketi çıxarmaq üçün marşrut tapa bilmir: adapter qoşulmayıb və ya fərqli network üçün default gateway yoxdur. Windows versiyasından asılı olaraq bəzən <span class=\"m\">Destination net unreachable<\/span> yazılır.<\/td><\/tr><\/table><\/div>\n<p>Burada ən vacib fərq: <b>Reply from ... Destination host unreachable<\/b> mesajında IP ünvanı kimin göndərdiyini deyir. Öz IP-nidirsə, problem sənin PC-nin yanındadır (ARP). Router-in IP-sidirsə, problem router-də və ondan sonradır. <b>Timeout<\/b> isə ən az məlumat verən haldır: heç kim cavab vermədi və səbəbi sən hələ bilmirsən.<\/p>\n<details class=\"box box-think\"><summary>Dayan və düşün: timeout niyə \"hədəf söndürülüb\" demək deyil?<\/summary><div class=\"ans\">Timeout yalnız \"cavab gəlmədi\" deməkdir. Bu hallardan hər biri eyni nəticəni verir: (1) hədəf söndürülüb, (2) hədəfin firewall-u Echo Request-i atır, (3) paket hədəfə çatır, amma cavabın qayıdış marşrutu yoxdur, (4) yolda router paketi ACL ilə atır. Bunları ayırmaq üçün traceroute və hədəfə yaxın nöqtələrdən ping lazımdır.<\/div><\/details>\n\n<h2 id=\"ttl\">TTL: paketin ömrü<\/h2>\n<p><b>Qayda:<\/b> IP başlığında <b>TTL<\/b> (Time To Live) sahəsi var. Hər router paketi ötürəndə TTL-i <b>1 azaldır<\/b>. TTL 0 olanda router paketi <b>atır<\/b> və mənbəyə ICMP <b>Time Exceeded<\/b> (Type 11) mesajı göndərir.<\/p>\n<p><b>Niyə belədir:<\/b> routing-də səhv ola bilər və paket router-lər arasında sonsuz dövr edə bilər (routing loop). TTL olmasaydı belə paketlər şəbəkəni əbədi doldururdu. TTL hər paketə \"ömür\" verir və loop-u məhdudlaşdırır.<\/p>\n<p>Simulyatorda TTL seç və paketin harada öldüyünə bax. Əvvəl proqnozlaşdır:<\/p>\n<div data-sim=\"pingttl\"><\/div>\n<h3 id=\"ttl-read\">Ping cavabındakı TTL-i oxumaq<\/h3>\n<p>Ping cavabında gördüyün TTL <b>qalan<\/b> TTL-dir. Hər əməliyyat sistemi paketi müəyyən <b>ilkin TTL<\/b> ilə göndərir:<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>ilkin TTL<\/th><th>Adətən<\/th><\/tr><tr><td class=\"m\">64<\/td><td>Linux, macOS, bir çox şəbəkə cihazı<\/td><\/tr><tr><td class=\"m\">128<\/td><td>Windows<\/td><\/tr><tr><td class=\"m\">255<\/td><td>Cisco router və switch-lər (IOS)<\/td><\/tr><\/table><\/div>\n<p><b>Metod:<\/b> cavabdakı TTL-dən böyük ən yaxın ilkin dəyəri seç və fərqi hesabla. Məsələn <span class=\"m\">TTL=52<\/span>: ən yaxın ilkin dəyər 64, deməli 64 − 52 = <b>12 router<\/b> keçib və hədəf, ehtimal ki, Linux-dur. <span class=\"m\">TTL=126<\/span> olsa: 128 − 126 = 2 router, hədəf Windows-dur. <span class=\"m\">TTL=128<\/span> eyni network-dəki Windows cihazdır (heç bir router keçməyib).<\/p>\n<p>Bu yalnız <b>təxmindir<\/b>: ilkin TTL dəyişdirilə bilər və bəzi cihazlar fərqli dəyər işlədir. Yəni sübut deyil, işçi fərziyyədir.<\/p>\n\n<h2 id=\"tracert\">Tracert: yolu görmək<\/h2>\n<p>Ping yalnız \"çatdı, ya çatmadı\" deyir. Əgər çatmırsa, <b>harada<\/b> dayandığını bilmək lazımdır. Bunu <span class=\"m\">tracert<\/span> (Windows) və ya <span class=\"m\">traceroute<\/span> (Linux, macOS, Cisco) edir.<\/p>\n<p><b>Qayda:<\/b> tracert hədəfə ardıcıl paketlər göndərir və hər dəfə TTL-i artırır: əvvəl TTL=1, sonra 2, 3... TTL=1 olan paket ilk router-də ölür və o, <b>Time Exceeded<\/b> göndərib öz ünvanını bildirir. TTL=2 olan paket ikinci router-də ölür və s. Hər cavab bir hop-u üzə çıxarır.<\/p>\n<p><b>Niyə belədir:<\/b> tracert yeni mexanizm yaratmır, mövcud TTL qaydasından istifadə edir. TTL bitəndə hər router özü haqqında məlumat göndərir və beləliklə siyahıya düşür.<\/p>\n<pre class=\"pre\"><span class=\"p\">C:\\&gt;<\/span>tracert 172.16.0.10\n\n  1    &lt;1 ms    &lt;1 ms    &lt;1 ms  192.168.1.1\n  2    &lt;1 ms    &lt;1 ms    &lt;1 ms  10.0.12.2\n  3     1 ms     1 ms     1 ms  10.0.23.3\n  4     1 ms     1 ms     1 ms  172.16.0.10\n\nTrace complete.\n<\/pre>\n<p><b>Nəticəni oxumaq:<\/b> sonuncu sətir hədəfdirsə, yol işləyir. Hop-da <span class=\"m\">* * * Request timed out<\/span> görürsənsə, həmin router Time Exceeded göndərmir (çox vaxt filtr səbəbindən) və bu özü-özlüyündə problem demək deyil. Əgər sonrakı hop-lar normal görünürsə, yol işləyir. Əgər bütün sonrakı hop-lar da <span class=\"m\">*<\/span>-dırsa, yol həmin nöqtədə qırılır.<\/p>\n<p>Əməliyyat sistemləri arasında fərq: Windows tracert ICMP Echo Request göndərir. Linux traceroute default olaraq UDP paketləri göndərir (ICMP üçün <span class=\"m\">traceroute -I<\/span> lazımdır). Hər iki halda mexanizm TTL artırmaqdır.<\/p>\n\n<h2 id=\"ping-method\">Ping ardıcıllığı: aşağıdan yuxarı yoxlama<\/h2>\n<p>\"Internet işləmir\" şikayətində ping-ləri təsadüfi atmaq əvəzinə <b>ardıcıl<\/b> atırsan. Hər ping bir sualı cavablandırır və yalnız irəli keçməyə imkan verir:<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Addım<\/th><th>Əmr<\/th><th>Nəyi sübut edir<\/th><th>Uğursuzluq nəyə işarədir<\/th><\/tr>\n<tr><td>1<\/td><td class=\"m\">ping 127.0.0.1<\/td><td>PC-nin TCP/IP stack-ı işləyir<\/td><td>Əməliyyat sistemi və ya şəbəkə proqram təminatı<\/td><\/tr>\n<tr><td>2<\/td><td class=\"m\">ping &lt;öz IP&gt;<\/td><td>Adapter ünvanla qurulub<\/td><td>Adapter söndürülüb və ya IP təyin olunmayıb<\/td><\/tr>\n<tr><td>3<\/td><td class=\"m\">ping &lt;gateway&gt;<\/td><td>Layer 1-2 və yerli network işləyir<\/td><td>Kabel, port, VLAN, ARP, səhv IP/mask<\/td><\/tr>\n<tr><td>4<\/td><td class=\"m\">ping &lt;uzaq IP&gt;<\/td><td>Router-lər və internet yolu işləyir<\/td><td>Routing, ISP, firewall, NAT<\/td><\/tr>\n<tr><td>5<\/td><td class=\"m\">ping &lt;ad&gt;<\/td><td>DNS adı IP-yə çevirir<\/td><td>DNS (məsələn IP ilə ping işləyir, adla yox)<\/td><\/tr><\/table><\/div>\n<p>5-ci addım xüsusi diqqətə layiqdir: <span class=\"m\">ping 8.8.8.8<\/span> uğurludur, amma <span class=\"m\">ping google.com<\/span> \"could not find host\" deyirsə, şəbəkə yoludur və problem DNS-dədir. Bunu ikinci hissədə DNS mövzusunda dərindən görəcəksən.<\/p>\n\n<h2 id=\"soc-icmp\">SOC baxışı: ICMP log-larda<\/h2>\n<p>Hücumçu şəbəkəni kəşf edəndə ilk iş canlı host-ları tapmaqdır. ICMP bunun ən sadə yoludur:<\/p>\n<ul>\n<li><b>Ping sweep:<\/b> bir mənbədən ardıcıl IP-lərə (192.168.1.1, .2, .3 ...) qısa müddətdə çoxlu Echo Request. Log-da bir Source IP, çox sayda Destination IP, eyni Type 8. Bu, host discovery (kəşfiyyat) əlamətidir.<\/li>\n<li><b>Qeyri-adi ölçü və tezlik:<\/b> adi ping 32 və ya 56 bayt data daşıyır. Böyük, dəyişən və ya tez-tez təkrarlanan ICMP payload-lar gizli məlumat ötürməsi (ICMP tunneling) əlaməti ola bilər.<\/li>\n<li><b>Çoxlu Time Exceeded və ya Unreachable:<\/b> şəbəkədə routing loop və ya skanlama izləri.<\/li>\n<\/ul>\n<p>Müdafiə tərəfdə sual belə qoyulur: ICMP-ni tamamilə bloklamaq olarmı? <b>Yox.<\/b> Type 3 Code 4 (\"fragmentasiya lazımdır\") mesajı Path MTU Discovery üçün vacibdir; onu bloklasan, bəzi bağlantılar qəribə şəkildə donur. Tracert və ping də diaqnostika üçün lazımdır. Düzgün yanaşma: lazım olan tipləri seçərək icazə vermək, qalanını məhdudlaşdırmaq və log-a yazmaq.<\/p>\n<details class=\"box box-think\"><summary>Dayan və düşün: bir host saniyədə 250 fərqli daxili IP-yə Echo Request göndərir. Bu hücumdurmu?<\/summary><div class=\"ans\">Birbaşa hücum deyil, amma kəşfiyyat əlamətidir. Əvvəl sənin inventarına bax: bu host monitoring sistemi və ya şəbəkə skaneridir? Əgər yoxdursa, host ələ keçirilib və şəbəkəni kəşf edir. Analitik verdikt verməmişdən əvvəl bu hostun rolunu, başqa log-larını (hansı proseslər, hansı hesab) və trafikin başqa növlərini (port skan) yoxlayır.<\/div><\/details>\n\n<h2 id=\"host-cmds\">Host əmrləri xəritəsi<\/h2>\n<p>Əvvəlki mövzulardakı əmrlərlə birlikdə, indi hər əmrin hansı layer-i yoxladığını bilirsən:<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Əmr<\/th><th>Layer<\/th><th>Nə göstərir<\/th><\/tr>\n<tr><td><span class=\"m\">ipconfig, ipconfig /all<\/span><\/td><td>2-3<\/td><td>IP, mask, gateway, MAC, DHCP, DNS<\/td><\/tr>\n<tr><td class=\"m\">getmac<\/td><td>2<\/td><td>MAC ünvanı<\/td><\/tr>\n<tr><td class=\"m\">arp -a<\/td><td>2-3<\/td><td>IP → MAC cache<\/td><\/tr>\n<tr><td class=\"m\">ping<\/td><td>1-3<\/td><td>Hədəfə iki istiqamətli yol<\/td><\/tr>\n<tr><td class=\"m\">tracert<\/td><td>3<\/td><td>Yoldakı router-lər<\/td><\/tr>\n<tr><td class=\"m\">netstat -an<\/td><td>4<\/td><td>Açıq portlar və TCP əlaqələri<\/td><\/tr>\n<tr><td class=\"m\">nslookup<\/td><td>7<\/td><td>DNS sorğusu (DNS mövzusunda)<\/td><\/tr><\/table><\/div>\n","p1/t07/cheat":"<h2>Qısa xülasə<\/h2>\n<div class=\"cheat-box\"><ul class=\"cheat\">\n<li><b>Hub<\/b> (Layer 1) siqnalı bütün portlara təkrarlayır. <b>Switch<\/b> (Layer 2) kadrı oxuyur və yalnız lazım olan porta göndərir.<\/li>\n<li><b>MAC address table<\/b> (CAM table): <b>MAC → port<\/b>. Switch özü öyrənir, heç kim əllə yazmır.<\/li>\n<li>Cədvəl sütunları: <b>Vlan<\/b>, <b>Mac Address<\/b>, <b>Type<\/b> (DYNAMIC / STATIC), <b>Ports<\/b>.<\/li>\n<li>Hər kadrda switch əvvəl <b>öyrənir<\/b> (Source MAC), sonra <b>qərar verir<\/b> (Destination MAC).<\/li>\n<li><b>Learn:<\/b> Source MAC → gələn port. Yoxdursa əlavə, varsa aging yenilə, başqa portdadırsa portu dəyiş.<\/li>\n<li><b>Forward:<\/b> Destination MAC cədvəldə başqa portdadır → yalnız o porta.<\/li>\n<li><b>Filter:<\/b> Destination MAC gələn portun özündədir → kadr atılır.<\/li>\n
