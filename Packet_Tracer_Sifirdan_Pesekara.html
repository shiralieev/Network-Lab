/* 10_tokens.css */
:root {
  --font-ui: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace;

  --bg: #EBEFF4;
  --panel: #FFFFFF;
  --panel-2: #F4F6F9;
  --ink: #0F1B29;
  --ink-2: #3B4C63;
  --ink-3: #586A82;
  --line: #C5CFDB;
  --line-2: #DCE3EB;

  --blue: #1858C4;
  --btn: #1858C4;
  --btn-ink: #FFFFFF;
  --blue-soft: #E4EEFC;
  --yel: #F2B705;
  --yel-ink: #2A2000;
  --yel-soft: #FFF3C4;
  --ok: #0B7A42;
  --ok-soft: #DCF2E5;
  --warn: #9A5200;
  --warn-soft: #FDE9CF;
  --bad: #B4281F;
  --bad-soft: #FBE1DF;

  --led-off: #8393A8;
  --jack: #E8EDF3;
  --jack-edge: #75869D;

  --term-bg: #0B121B;
  --term-bar: #141E2B;
  --term-ink: #E6EDF5;
  --term-dim: #93A5BA;
  --term-prompt: #F5C530;
  --term-ok: #5FD99A;
  --term-bad: #FF8F88;
  --term-mark: #1F3B63;

  --r-sm: 3px;
  --r-md: 5px;
  --r-lg: 8px;
  --stage-w: 1240px;
  --prose-w: 66ch;
}

[data-theme="dark"] {
  --bg: #0D1520;
  --panel: #15202D;
  --panel-2: #1B2837;
  --ink: #E8EEF5;
  --ink-2: #B6C3D3;
  --ink-3: #93A3B7;
  --line: #2B3A4E;
  --line-2: #223245;

  --blue: #7DB1FF;
  --btn: #2F6FDE;
  --btn-ink: #FFFFFF;
  --blue-soft: #17304F;
  --yel: #F5C530;
  --yel-ink: #241B00;
  --yel-soft: #3A3010;
  --ok: #4FD58D;
  --ok-soft: #14392A;
  --warn: #F2A650;
  --warn-soft: #3A2A14;
  --bad: #FF8A82;
  --bad-soft: #44201F;

  --led-off: #5E7189;
  --jack: #1F2D3E;
  --jack-edge: #6A809B;
}

/* 20_base.css */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  font-weight: 420;
  line-height: 1.55;
  min-height: 100vh;
}
#app { min-height: 100vh; display: flex; flex-direction: column; }
h1, h2, h3, h4 { margin: 0; color: var(--ink); text-wrap: balance; }
p { margin: 0 0 1em; }
a { color: var(--blue); }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
code, kbd, samp, pre { font-family: var(--font-mono); }
:focus-visible { outline: 3px solid var(--yel); outline-offset: 2px; border-radius: var(--r-sm); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hide { display: none !important; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; min-height: 42px;
  border: 1.5px solid var(--line); border-radius: var(--r-md);
  background: var(--panel); color: var(--ink);
  font-weight: 620; font-stretch: 104%;
  text-decoration: none; line-height: 1.2;
}
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--btn); }
.btn-quiet { background: transparent; }
.btn-sm { padding: 6px 12px; min-height: 34px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* 30_chrome.css */
/* ---- top bar ---- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 20px; height: 58px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.brand-mark { flex: none; width: 34px; height: 26px; }
.brand-name { font-weight: 780; font-stretch: 118%; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap; }
.brand-sub { color: var(--ink-3); font-weight: 480; font-size: 14px; white-space: nowrap; }
.brand-txt { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.tb-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px; min-width: 40px; padding: 0 12px; justify-content: center;
  background: transparent; border: 1.5px solid transparent; border-radius: var(--r-md);
  color: var(--ink-2); font-weight: 560; font-size: 14px;
}
.icon-btn:hover { background: var(--panel-2); border-color: var(--line); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; flex: none; }

/* ---- rack tabs ---- */
.rack-tabs {
  display: flex; gap: 0; overflow-x: auto; scrollbar-width: thin;
  background: var(--panel-2); border-bottom: 1px solid var(--line);
  padding: 0 12px;
}
.rack-tab {
  position: relative; flex: none;
  display: flex; flex-direction: column; justify-content: center; gap: 5px;
  min-width: 148px; padding: 9px 30px 10px; margin: 0;
  background: transparent; border: 0; border-bottom: 4px solid transparent;
  text-align: left;
}
.rack-tab::before, .rack-tab::after {
  content: ''; position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -4.5px;
  border-radius: 50%; border: 2px solid var(--jack-edge); background: var(--panel-2);
}
.rack-tab::before { left: 10px; }
.rack-tab::after { right: 10px; }
.rack-tab:hover { background: var(--panel); }
.rack-tab.is-active { background: var(--panel); border-bottom-color: var(--btn); }
.rack-tab.is-active::before, .rack-tab.is-active::after { background: var(--panel); }
.rt-label { font-weight: 720; font-stretch: 108%; font-size: 15px; line-height: 1.1; white-space: nowrap; }
.rt-sub { font-size: 12.5px; color: var(--ink-3); line-height: 1.1; white-space: nowrap; }
.rt-dots { display: flex; gap: 3px; flex-wrap: nowrap; margin-top: 1px; }
.dot { width: 9px; height: 9px; border-radius: 2px; background: var(--led-off); }
.dot.d-open { background: var(--yel); }
.dot.d-pass { background: var(--ok); }
.dot.d-soon { background: transparent; border: 1.5px solid var(--led-off); }

/* ---- stage ---- */
.stage { width: 100%; max-width: var(--stage-w); margin: 0 auto; padding: 22px 20px 56px; flex: 1; }

.footer { padding: 18px 20px 28px; text-align: center; color: var(--ink-3); font-size: 13.5px; }

/* ---- part page ---- */
.part { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
.side {
  position: sticky; top: 76px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
  max-height: calc(100vh - 96px); overflow: auto;
}
.side-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--line-2); }
.side-title { font-weight: 760; font-stretch: 112%; font-size: 18px; line-height: 1.2; }
.side-desc { font-size: 14px; color: var(--ink-2); margin: 6px 0 10px; line-height: 1.45; }
.bar { height: 7px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; }
.bar-txt { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
.tlist { list-style: none; margin: 0; padding: 6px; }
.titem {
  width: 100%; display: grid; grid-template-columns: 22px 1fr; column-gap: 10px;
  padding: 10px 10px; border: 0; border-radius: var(--r-md); background: transparent; text-align: left;
  align-items: start;
}
.titem:hover { background: var(--panel-2); }
.titem.is-active { background: var(--blue-soft); }
.titem-led { margin-top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
.titem.is-open .titem-led { background: var(--yel); }
.titem.is-pass .titem-led { background: var(--ok); }
.titem-title { font-weight: 600; font-size: 15px; line-height: 1.3; }
.titem-meta { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.titem.is-locked .titem-title { color: var(--ink-3); }
.side-toggle { display: none; }

.main { min-width: 0; }

@media (max-width: 900px) {
  .topbar { padding: 0 12px; }
  .brand-sub { display: none; }
  .brand-name { font-size: 15.5px; }
  .brand { gap: 8px; }
  .icon-btn { padding: 0 8px; min-width: 38px; }
  .icon-btn .lbl { display: none; }
  .stage { padding: 16px 14px 44px; }
  .part { grid-template-columns: 1fr; gap: 14px; }
  .side { position: static; max-height: none; }
  .side-toggle { display: flex; width: 100%; }
  .side .tlist { display: none; }
  .side.is-open .tlist { display: block; }
  .rack-tab { min-width: 128px; padding: 8px 26px 9px; }
}

/* 40_home.css */
.home-hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 36px; align-items: start; padding: 10px 0 26px; }
.home-hero > div:first-child { position: sticky; top: 150px; }
.hero-title { font-weight: 800; font-stretch: 122%; font-size: clamp(30px, 4.4vw, 50px); line-height: 1.04; letter-spacing: -0.02em; margin-bottom: 14px; }
.hero-sub { font-size: 17.5px; line-height: 1.6; color: var(--ink-2); max-width: 46ch; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 8px; }
.hero-meta { color: var(--ink-3); font-size: 14.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; font-size: 14px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend .dot { width: 12px; height: 12px; border-radius: 50%; }

.rack { display: flex; flex-direction: column; gap: 14px; }
.panel-unit {
  position: relative;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 22px 16px;
}
.panel-unit::before, .panel-unit::after {
  content: ''; position: absolute; top: 14px; width: 9px; height: 9px; border-radius: 50%;
  border: 2px solid var(--jack-edge); background: var(--panel-2);
}
.panel-unit::before { left: 7px; } .panel-unit::after { right: 7px; }
.pu-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.pu-num { font-weight: 780; font-stretch: 116%; font-size: 17px; }
.pu-title { font-weight: 480; color: var(--ink-2); font-size: 15.5px; }
.pu-count { margin-left: auto; font-size: 13.5px; color: var(--ink-3); }
.pu-ports { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px 8px; }

.port {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 8px 4px 8px; background: transparent; border: 1.5px solid transparent; border-radius: var(--r-md);
  text-align: center; position: relative;
}
.port:hover { background: var(--panel-2); border-color: var(--line); }
.port-led { width: 12px; height: 12px; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 0 0 2px rgba(0,0,0,.1); }
.port.is-open .port-led { background: var(--yel); }
.port.is-pass .port-led { background: var(--ok); }
.port-jack {
  position: relative; width: 46px; height: 36px;
  background: var(--jack); border: 2px solid var(--jack-edge); border-radius: 3px 3px 6px 6px;
}
.port-jack::before { /* contact pins */
  content: ''; position: absolute; left: 6px; right: 6px; top: 6px; height: 9px;
  background: repeating-linear-gradient(90deg, var(--jack-edge) 0 2px, transparent 2px 5px);
  opacity: .8;
}
.port-jack::after { /* latch notch */
  content: ''; position: absolute; left: 50%; bottom: -2px; width: 14px; height: 7px; margin-left: -7px;
  background: var(--panel); border: 2px solid var(--jack-edge); border-bottom: 0; border-radius: 2px 2px 0 0;
}
.port.is-pass .port-jack { border-color: var(--ok); }
.port.is-pass .port-jack::before { background: repeating-linear-gradient(90deg, var(--ok) 0 2px, transparent 2px 5px); opacity: 1; }
.port.is-locked .port-jack { opacity: .5; }
.plug { /* cable plugged into passed ports */
  position: absolute; left: 50%; bottom: -13px; width: 20px; height: 20px; margin-left: -10px; pointer-events: none;
}
.plug::before { content: ''; position: absolute; left: 3px; right: 3px; top: 0; height: 9px; background: var(--btn); border-radius: 2px 2px 0 0; }
.plug::after { content: ''; position: absolute; left: 8px; width: 4px; top: 8px; bottom: -14px; background: var(--btn); border-radius: 2px; }
.port-lock { position: absolute; top: 31px; left: 50%; margin-left: -8px; width: 16px; height: 16px; color: var(--ink-2); }
.port-name { font-size: 12.8px; line-height: 1.25; color: var(--ink); font-weight: 520; margin-top: 12px; max-width: 100%; hyphens: auto; overflow-wrap: anywhere; }
.port.is-locked .port-name { color: var(--ink-3); }
.port-idx { font-size: 12px; color: var(--ink-3); font-weight: 640; }
.port-status { font-size: 12px; color: var(--ink-3); }

@media (max-width: 980px) { .home-hero { grid-template-columns: 1fr; gap: 22px; } .home-hero > div:first-child { position: static; } }
@media (max-width: 520px) { .pu-ports { grid-template-columns: repeat(3, 1fr); } .panel-unit { padding: 12px 16px 14px; } }

/* 50_content.css */
/* ---- topic header ---- */
.t-head { margin-bottom: 18px; }
.t-title { font-weight: 790; font-stretch: 118%; font-size: clamp(27px, 3.6vw, 40px); line-height: 1.08; letter-spacing: -0.015em; margin-bottom: 8px; }
.t-sub { color: var(--ink-2); font-size: 15.5px; margin-bottom: 14px; }
.objectives { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--btn); border-radius: var(--r-md); padding: 14px 18px 12px; }
.objectives h2 { font-size: 15.5px; font-weight: 700; font-stretch: 104%; margin-bottom: 6px; }
.objectives ul { margin: 0; padding-left: 20px; }
.objectives li { margin: 3px 0; }

/* ---- stepper (explanation -> cheat sheet -> lab -> quiz) ---- */
.stepper { display: flex; gap: 0; margin: 18px 0 22px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.st {
  position: relative; flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  background: transparent; border: 0; border-right: 1px solid var(--line-2); text-align: left;
}
.st:last-child { border-right: 0; }
.st:hover { background: var(--panel-2); }
.st.is-active { background: var(--blue-soft); box-shadow: inset 0 -4px 0 var(--btn); }
.st-led { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 0 0 2px rgba(0,0,0,.1); }
.st.is-done .st-led { background: var(--ok); }
.st.is-locked .st-led { background: transparent; border: 2px solid var(--led-off); box-shadow: none; }
.st-txt { display: flex; flex-direction: column; min-width: 0; }
.st-name { font-weight: 680; font-stretch: 106%; font-size: 15px; line-height: 1.15; }
.st-note { font-size: 12.5px; color: var(--ink-3); line-height: 1.2; margin-top: 2px; }
.st.is-locked { cursor: not-allowed; }
.st.is-locked .st-name { color: var(--ink-3); }

@media (max-width: 640px) {
  .stepper { flex-wrap: wrap; }
  .st { flex: 1 1 50%; border-bottom: 1px solid var(--line-2); }
  .st-note { display: none; }
}

/* ---- prose ---- */
.prose { max-width: var(--prose-w); font-size: 17px; line-height: 1.68; }
.prose.wide { max-width: none; }
.prose > * { max-width: var(--prose-w); }
.prose > .sim, .prose > .box-wide, .prose > .tbl-wrap, .prose > figure, .prose > .box, .prose > pre, .prose > .figure { max-width: 100%; }
.prose h2 { font-weight: 750; font-stretch: 112%; font-size: 26px; line-height: 1.18; margin: 2.1em 0 .55em; letter-spacing: -0.01em; scroll-margin-top: 80px; }
.prose h2:first-child { margin-top: .4em; }
.prose h3 { font-weight: 700; font-stretch: 106%; font-size: 20px; line-height: 1.25; margin: 1.6em 0 .4em; scroll-margin-top: 80px; }
.prose ul, .prose ol { padding-left: 1.3em; margin: 0 0 1em; }
.prose li { margin: .3em 0; }
.prose code, .cheat code, .box code, .opt code, .lab code, .qcard code {
  background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r-sm);
  padding: 1px 6px; font-size: .86em; word-break: break-word;
}
.prose pre, .pre {
  background: var(--term-bg); color: var(--term-ink); border-radius: var(--r-md);
  padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; margin: 1em 0;
  white-space: pre; tab-size: 4;
}
.prose pre code, .pre code { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; }
.pre .p { color: var(--term-prompt); }
.pre .c { color: var(--term-dim); }
.pre .k { color: var(--term-ok); }
.pre .e { color: var(--term-bad); }
.kw { font-weight: 640; }
.fine { color: var(--ink-3); font-size: 14.5px; }

.tbl-wrap { overflow-x: auto; margin: 1em 0; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); }
.tbl { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.45; }
.tbl th, .tbl td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line-2); }
.tbl th { font-weight: 700; font-stretch: 104%; background: var(--panel-2); font-size: 14.5px; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.m, .tbl th.m { font-family: var(--font-mono); font-size: 13.5px; white-space: nowrap; }

/* ---- boxes ---- */
.box { margin: 1.3em 0; padding: 14px 18px 12px; background: var(--panel); border: 1px solid var(--line); border-left-width: 5px; border-radius: var(--r-md); font-size: 16px; line-height: 1.6; }
.box > h4 { font-size: 15.5px; font-weight: 720; font-stretch: 106%; margin-bottom: 6px; }
.box p:last-child, .box ul:last-child, .box ol:last-child { margin-bottom: 0; }
.box-pt { border-left-color: var(--btn); background: var(--blue-soft); border-color: transparent; border-left-color: var(--btn); }
.box-note { border-left-color: var(--ok); }
.box-warn { border-left-color: var(--warn); background: var(--warn-soft); border-color: transparent; border-left-color: var(--warn); }
.box-think { border-left-color: var(--yel); background: var(--yel-soft); border-color: transparent; border-left-color: var(--yel); }
.box-think summary { cursor: pointer; font-weight: 640; list-style: none; }
.box-think summary::-webkit-details-marker { display: none; }
.box-think summary::before { content: '+'; display: inline-block; width: 22px; font-family: var(--font-mono); font-weight: 700; }
.box-think[open] summary::before { content: '–'; }
.box-think .ans { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,.12); }
.box-attack { border-left-color: var(--bad); padding-bottom: 6px; }
.attack-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 6px 0 6px; }
.attack-cols > div { padding: 10px 12px; border-radius: var(--r-md); background: var(--panel-2); border: 1px solid var(--line-2); }
.attack-cols h5 { margin: 0 0 4px; font-size: 14.5px; font-weight: 720; }
.attack-cols .atk h5 { color: var(--bad); }
.attack-cols .def h5 { color: var(--ok); }
@media (max-width: 700px) { .attack-cols { grid-template-columns: 1fr; } }

/* ---- figures (drawn diagrams) ---- */
.figure { margin: 1.4em 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; overflow-x: auto; }
.figure svg { display: block; width: 100%; height: auto; min-width: 620px; max-width: 880px; margin: 0 auto; }
.figure figcaption, .fig-cap { font-size: 14px; color: var(--ink-2); margin-top: 8px; max-width: 80ch; line-height: 1.45; }
svg text { font-family: var(--font-ui); fill: var(--ink); }
svg .t-m { font-family: var(--font-mono); }
svg .t-dim { fill: var(--ink-3); }
svg .ln { stroke: var(--ink-2); stroke-width: 2; fill: none; }
svg .box-s { fill: var(--panel-2); stroke: var(--ink-2); stroke-width: 1.8; }
svg .fill-blue { fill: var(--blue-soft); stroke: var(--btn); stroke-width: 1.8; }
svg .fill-yel { fill: var(--yel-soft); stroke: var(--yel); stroke-width: 1.8; }
svg .fill-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.8; }
svg .fill-bad { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.8; }

/* ---- cheat sheet ---- */
.cheat-wrap { max-width: 860px; }
.cheat-wrap h2 { font-weight: 750; font-stretch: 112%; font-size: 24px; margin: 1.6em 0 .5em; }
.cheat-wrap h2:first-child { margin-top: 0; }
.cheat { list-style: none; margin: 0; padding: 0; }
.cheat li { position: relative; padding: 9px 12px 9px 34px; border-bottom: 1px solid var(--line-2); font-size: 16.5px; line-height: 1.5; }
.cheat li::before { content: ''; position: absolute; left: 12px; top: 18px; width: 9px; height: 9px; background: var(--btn); border-radius: 2px; }
.cheat-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px 6px; }
.cmd-table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.cmd-table td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; font-size: 15.5px; }
.cmd-table tr:last-child td { border-bottom: 0; }
.cmd-table td:first-child { width: 42%; font-family: var(--font-mono); font-size: 14px; word-break: break-word; }
.cmd-table .where { display: block; color: var(--ink-3); font-family: var(--font-ui); font-size: 12.8px; margin-top: 3px; }
@media (max-width: 640px) { .cmd-table td:first-child { width: 48%; } }

.step-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }

.soon { max-width: 640px; background: var(--panel); border: 1px dashed var(--jack-edge); border-radius: var(--r-md); padding: 26px 24px; }
.soon h2 { font-size: 22px; font-weight: 760; font-stretch: 112%; margin-bottom: 8px; }
.soon ul { margin: 12px 0 0; padding-left: 20px; color: var(--ink-2); }

/* 60_interactive.css */
/* ---- simulators ---- */
.sim { margin: 1.6em 0; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.sim-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.sim-title { font-weight: 720; font-stretch: 108%; font-size: 16px; }
.sim-hint { font-size: 13.5px; color: var(--ink-3); }
.sim-body { padding: 16px; }
.sim-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 0; }
.sim-ctrl label { font-size: 14.5px; font-weight: 560; }
.sim-ctrl select, .sim-ctrl input[type=text], .sim-ctrl input[type=number] {
  min-height: 36px; padding: 4px 10px; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r-md); color: var(--ink);
}
.sim-log { margin-top: 12px; padding: 10px 14px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r-md); font-size: 15px; line-height: 1.55; min-height: 52px; }
.sim-log b { font-weight: 680; }
.sim-stage { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 8px; overflow-x: auto; }
.sim-stage svg { display: block; width: 100%; min-width: 520px; height: auto; margin: 0 auto; max-width: 900px; }
.predict { background: var(--yel-soft); border: 1px solid var(--yel); border-radius: var(--r-md); padding: 12px 14px; margin-top: 12px; }
.predict h4 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.predict .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip {
  padding: 7px 12px; min-height: 36px; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r-md); font-weight: 580; font-size: 14.5px;
}
.chip:hover { border-color: var(--ink-3); }
.chip.is-on { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.chip.is-ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ink); }
.chip.is-bad { background: var(--bad-soft); border-color: var(--bad); color: var(--ink); }

/* bit grid */
.bits { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0; }
.oct { display: flex; flex-direction: column; gap: 4px; }
.oct-bits { display: flex; gap: 3px; }
.bit {
  width: 24px; height: 38px; padding: 0; border-radius: var(--r-sm); border: 1.5px solid var(--line);
  background: var(--panel); font-family: var(--font-mono); font-weight: 700; font-size: 16px;
}
.bit.net { background: var(--blue-soft); border-color: var(--btn); }
.bit.host { background: var(--yel-soft); border-color: var(--yel); }
.oct-dec { text-align: center; font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); }
.oct-wt { display: flex; gap: 3px; font-size: 10.5px; color: var(--ink-3); font-family: var(--font-mono); }
.oct-wt span { width: 24px; text-align: center; }
.bit-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); margin: 6px 0 2px; }
.bit-legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; margin-top: 12px; }
.res { padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r-md); }
.res small { display: block; color: var(--ink-3); font-size: 12.5px; }
.res b { font-family: var(--font-mono); font-size: 15.5px; font-weight: 700; word-break: break-all; }
@media (max-width: 560px) { .bit { width: 19px; height: 32px; font-size: 13.5px; } .oct-wt span { width: 19px; font-size: 8.5px; } .bits { gap: 6px 8px; } }

/* hex dump */
.hex { display: grid; grid-template-columns: auto 1fr; gap: 0 14px; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.7; background: var(--term-bg); color: var(--term-ink); border-radius: var(--r-md); padding: 12px 14px; overflow-x: auto; }
.hex .off { color: var(--term-dim); user-select: none; }
.hex .bytes { display: flex; flex-wrap: wrap; gap: 0; }
.hb { padding: 0 3px; border-radius: 3px; cursor: pointer; }
.hb:hover { background: var(--term-mark); }
.hb.sel { background: var(--yel); color: var(--yel-ink); }
.hb.dim { opacity: .55; }
.fields { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }

/* ---- quiz ---- */
.qwrap { max-width: 820px; }
.q-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 14.5px; color: var(--ink-2); }
.q-progress .bar { flex: 1; }
.qcard { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 20px 22px 18px; }
.q-stem { font-size: 18px; line-height: 1.55; margin-bottom: 16px; font-weight: 520; }
.q-stem p:last-child { margin-bottom: 0; }
.q-stem pre { font-size: 13px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%;

(function () {
  const PT = window.PT; const h = PT.h;

  const TYPES = [{ name: 'FastEthernet', abbr: 'Fa' }, { name: 'GigabitEthernet', abbr: 'Gi' }, { name: 'Vlan', abbr: 'Vlan' }];
  const clone = o => JSON.parse(JSON.stringify(o));

  const isMask = s => { if (!isIp(s)) return false; const n = ip2n(s); const inv = (~n) >>> 0; return ((inv + 1) & inv) === 0 && n !== 0; };

    const m = /^([a-zA-Z]+)\s*(\d+(?:\/\d+)*)$/.exec(String(txt).trim()); if (!m) return null;
    const t = m[1].toLowerCase(); const ty = TYPES.find(x => x.name.toLowerCase().startsWith(t)); if (!ty) return null;

    const ports = (cfg.ports || (kind === 'switch' ? ['FastEthernet0/1', 'FastEthernet0/2', 'FastEthernet0/3', 'GigabitEthernet0/1'] : ['GigabitEthernet0/0', 'GigabitEthernet0/1'])).map(p => parseIf(p) || p);

  }

  /* ------------------------------------------------------------ command tree */
  const K = (w, help, o) => Object.assign({ w, help }, o || {});
  const A = (id, help, test, o) => Object.assign({ arg: id, help, test }, o || {});
  const REST = (id, help, run) => ({ arg: id, help, test: () => true, rest: true, run });

  function buildTree(dev, api) {
    const isRouter = dev.kind === 'router';
    const ifArg = (run) => ({ arg: 'TYPE NUMBER', help: 'Interface, for example fa0/1 or gi0/0', test: () => true, rest: true, validate: v => !!parseIf(v), norm: v => parseIf(v), run });
    const showCmds = (priv) => {
      const L = [];
      L.push(K('interfaces', 'Interface status and configuration', { children: [ifArg(c => api.showIf(c)), ...(isRouter ? [] : [K('status', 'Interface line status', { run: c => api.showIfStatus(c) })])] }));
      L.push(K('ip', 'IP information', { children: [K('interface', 'IP interface status and configuration', { children: [K('brief', 'Brief summary of IP status and configuration', { run: c => api.showIpBrief(c) })] })] }));
      if (!isRouter) {
        L.push(K('mac', 'MAC configuration', { children: [K('address-table', 'MAC forwarding table', { run: c => api.showMac(c), children: [K('dynamic', 'dynamic entries only', { run: c => api.showMac(c) })] })] }));
      }
      if (priv) {
        L.push(K('running-config', 'Current operating configuration', { run: c => api.showRun(c) }));
        L.push(K('startup-config', 'Contents of startup configuration', { run: c => api.showStart(c) }));
      }
      return L;
    };
    const ping = K('ping', 'Send echo messages', { children: [A('WORD', 'Ping destination address or hostname', isIp, { run: (c) => api.ping(c) })] });
    const user = [
      K('enable', 'Turn on privileged commands', { run: c => { dev.mode = 'priv'; } }),
      K('exit', 'Exit from the EXEC', { run: c => { c.out(''); c.out(dev.run.hostname + ' con0 is now available'); c.out(''); c.out('Press RETURN to get started.', 'dim'); } }),
      ping,
      K('show', 'Show running system information', { children: showCmds(false) }),
    ];
    const priv = [
      K('clear', 'Reset functions', { children: isRouter ? [] : [K('mac', 'MAC forwarding table', { children: [K('address-table', 'MAC forwarding table', { children: [K('dynamic', 'dynamic entries only', { run: c => { dev.macs = dev.macs.filter(m => m.type !== 'DYNAMIC'); } })] })] })] }),
      K('configure', 'Enter configuration mode', { children: [K('terminal', 'Configure from the terminal', { run: c => { dev.mode = 'config'; c.out('Enter configuration commands, one per line.  End with CNTL/Z.'); } })] }),
      K('copy', 'Copy from one file to another', { children: [K('running-config', 'Copy from current system configuration', { children: [K('startup-config', 'Copy to startup configuration', { run: c => api.copyRunStart(c) })] })] }),
      K('disable', 'Turn off privileged commands', { run: c => { dev.mode = 'user'; } }),
      K('erase', 'Erase a filesystem', { children: [K('startup-config', 'Erase contents of configuration memory', { run: c => api.erase(c) })] }),
      K('exit', 'Exit from the EXEC', { run: c => { dev.mode = 'user'; c.out(''); c.out(dev.run.hostname + ' con0 is now available'); c.out(''); c.out('Press RETURN to get started.', 'dim'); } }),
      ping,
      K('reload', 'Halt and perform a cold restart', { run: c => api.reload(c) }),
      K('show', 'Show running system information', { children: showCmds(true) }),
      K('write', 'Write running configuration to memory', { run: c => api.writeMem(c), children: [K('memory', 'Write to NV memory', { run: c => api.writeMem(c) })] }),
    ];
    const doCmd = K('do', 'To run exec commands in config mode', { children: [REST('LINE', 'Exec command', c => api.doExec(c))] });
    const hostnameCmd = K('hostname', 'Set system\'s network name', { negOk: true, runNeg: c => { dev.run.hostname = dev.factory().hostname; }, children: [A('WORD', 'This system\'s network name', t => /^\S+$/.test(t), { run: c => { dev.run.hostname = c.args[0]; } })] });
    const ipGlobal = K('ip', 'Global IP configuration subcommands', {
      negOk: true,
      children: [
        K('domain-lookup', 'Enable IP Domain Name System hostname translation', { run: c => { dev.run.noLookup = !!c.neg; } }),
        ...(isRouter ? [] : [K('default-gateway', 'Specify default gateway (if not routing IP)', { children: [A('A.B.C.D', 'IP address of default gateway', isIp, { run: c => { dev.run.defGw = c.args[0]; } })], runNeg: c => { dev.run.defGw = null; } })]),
      ],
    });
    const intCmd = K('interface', 'Select an interface to configure', { children: [ifArg(c => { if (!dev.run.ifs[c.args[0]]) { c.errLine('% Invalid interface type and number'); return; } dev.curIf = c.args[0]; dev.mode = 'if'; })] });
    const no = K('no', 'Negate a command or set its defaults', { isNo: true });
    const config = [no, doCmd, hostnameCmd, ipGlobal, intCmd,
      K('exit', 'Exit from configure mode', { run: c => { dev.mode = 'priv'; } }),
      K('end', 'Exit from configure mode', { run: c => { dev.mode = 'priv'; } }),
    ];
    const ifCmds = [no, doCmd,
      K('description', 'Interface specific description', { negOk: true, runNeg: c => { dev.run.ifs[dev.curIf].desc = ''; }, children: [REST('LINE', 'Up to 240 characters describing this interface', c => { dev.run.ifs[dev.curIf].desc = c.args[0]; })] }),
      K('shutdown', 'Shutdown the selected interface', { negOk: true, run: c => { dev.run.ifs[dev.curIf].shut = !c.neg; api.linkMsg(c); } }),
      K('interface', 'Select an interface to configure', { children: [ifArg(c => { if (!dev.run.ifs[c.args[0]]) { c.errLine('% Invalid interface type and number'); return; } dev.curIf = c.args[0]; })] }),
      K('exit', 'Exit from interface configuration mode', { run: c => { dev.mode = 'config'; dev.curIf = null; } }),
      K('end', 'Exit from configure mode', { run: c => { dev.mode = 'priv'; dev.curIf = null; } }),
    ];
    const ipIf = K('ip', 'Interface Internet Protocol config commands', {
      negOk: true,
      vis: () => isRouter || (dev.curIf && dev.curIf.startsWith('Vlan')),
      children: [K('address', 'Set the IP address of an interface', {
        runNeg: c => { const i = dev.run.ifs[dev.curIf]; i.ip = null; i.mask = null; },
        children: [A('A.B.C.D', 'IP address', isIp, { children: [A('A.B.C.D', 'IP subnet mask', isMask, { run: c => { const i = dev.run.ifs[dev.curIf]; i.ip = c.args[0]; i.mask = c.args[1]; } })] })],
      })],
    });
    ifCmds.splice(2, 0, ipIf);
    return { user, priv, config, if: ifCmds };
  }

  /* ------------------------------------------------------------ parser */
  function tokenize(line) { const toks = []; const re = /\S+/g; let m; while ((m = re.exec(line))) toks.push({ t: m[0], i: m.index }); return toks; }
  const kids = (list, ctx) => (typeof list === 'function' ? list(ctx) : (list || [])).filter(n => !n.vis || n.vis(ctx));

  function walk(tree, mode, line, toks, ctx) {
    const root = tree[mode];
    let level = root; let node = null;
    for (let k = 0; k < toks.length; k++) {
      const tk = toks[k]; const low = tk.t.toLowerCase(); const list = kids(level, ctx);
      const kw = list.filter(n => n.w);
      const exact = kw.find(n => n.w === low);
      const cand = exact ? [exact] : kw.filter(n => n.w.startsWith(low));
      if (cand.length > 1) return { err: 'ambiguous', k, node, level };
      let pick = cand[0];
      if (!pick) pick = list.find(n => n.arg && n.test(tk.t, ctx));
      if (!pick) return { err: 'invalid', k, node, level };
      if (pick.isNo) { ctx.neg = true; level = root.filter(n => n.negOk); node = pick; continue; }
      node = pick;
      if (pick.arg) {
        const v = pick.rest ? line.slice(tk.i).trim() : (pick.val ? pick.val(tk.t) : tk.t);
        if (pick.validate && !pick.validate(v)) return { err: 'invalid', k, node, level };
        ctx.args.push(pick.norm ? pick.norm(v) : v);
        if (pick.rest) { level = []; break; }
      }
      level = pick.children || [];
    }
    return { node, level };
  }

  function helpFor(tree, mode, line, ctx) {
    const trailing = /\s$/.test(line) || line === '';
    const toks = tokenize(line);
    if (!trailing && toks.length) {
      const last = toks.pop(); const w = walk(tree, mode, line, toks, ctx);
      if (w.err) return { err: true };
      const cand = kids(w.level, ctx).filter(n => n.w && n.w.startsWith(last.t.toLowerCase()));
      return cand.length ? { words: cand.map(n => n.w) } : { err: true, unrec: true };
    }
    const w = walk(tree, mode, line, toks, ctx);
    if (w.err) return { err: true };
    const rows = kids(w.level, ctx).map(n => n.w ? [n.w, n.help] : [n.arg === 'LINE' ? 'LINE' : (n.arg === 'WORD' ? 'WORD' : n.arg), n.help]);
    const fn = w.node ? (ctx.neg ? (w.node.runNeg || w.node.run) : w.node.run) : null;
    if (fn) rows.push(['<cr>', '']);
    if (ctx.neg && !w.node.arg && w.node.isNo) { /* only no-able list */ }
    return { rows };
  }

  /* ------------------------------------------------------------ widget */
  PT.mountTerminal = function (container, cfg) {
    cfg = cfg || {};
    const dev = makeDevice(cfg);
    const bodyEl = h('div', { class: 'term-body', role: 'log', 'aria-live': 'polite', 'aria-label': 'Terminal çıxışı' });
    const inEl = h('input', { class: 'term-input', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Əmr xətti' });
    const promptEl = h('span', { class: 'term-prompt' });
    const lineEl = h('div', { class: 'term-in' }, promptEl, inEl);
    bodyEl.append(lineEl);
    let hist = [], hi = 0;

    function print(text, cls) {
      String(text).split('\n').forEach(t => { const d = h('div', { class: 'ln' + (cls ? ' ' + cls : '') }, t === '' ? ' ' : t); bodyEl.insertBefore(d, lineEl); });
    }
    function scroll() { bodyEl.scrollTop = bodyEl.scrollHeight; }
    function setPrompt() { promptEl.textContent = dev.prompt(); }

    /* ---- api used by commands ---- */
    const api = {};
    api.showIpBrief = c => {
      c.out(pad('Interface', 23) + pad('IP-Address', 16) + pad('OK?', 4) + pad('Method', 7) + pad('Status', 22) + 'Protocol');
      dev.listIfs().forEach(n => { const i = dev.run.ifs[n]; const l = dev.link(n); c.out(pad(n, 23) + pad(i.ip || 'unassigned', 16) + pad('YES', 4) + pad(i.ip ? 'manual' : 'unset', 7) + pad(l.st, 22) + l.pr); });
    };
    api.showIfStatus = c => {
      c.out(pad('Port', 10) + pad('Name', 19) + pad('Status', 13) + pad('Vlan', 11) + pad('Duplex', 8) + pad('Speed', 7) + 'Type');
      dev.ports.forEach(n => {
        const i = dev.run.ifs[n]; const l = dev.link(n); const st = i.shut ? 'disabled' : (l.pr === 'up' ? 'connected' : 'notconnect'); const up = st === 'connected';
        c.out(pad(short(n), 10) + pad((i.desc || '').slice(0, 18), 19) + pad(st, 13) + pad('1', 11) + pad(up ? 'a-full' : 'auto', 8) + pad(up ? (n.startsWith('Gi') ? 'a-1000' : 'a-100') : 'auto', 7) + (n.startsWith('Gi') ? '10/100/1000BaseTX' : '10/100BaseTX'));
      });
    };
    api.showIf = c => {
      const n = c.args[0]; const i = dev.run.ifs[n]; if (!i) { c.out('% Invalid interface type and number', 'err'); return; }
      const l = dev.link(n); const tag = dev.kind === 'switch' && !n.startsWith('Vlan') ? ' (' + (i.shut ? 'disabled' : (l.pr === 'up' ? 'connected' : 'notconnect')) + ')' : '';
      c.out(n + ' is ' + l.st + ', line protocol is ' + l.pr + tag);
      if (i.desc) c.out('  Description: ' + i.desc);
      if (i.ip) c.out('  Internet address is ' + i.ip + '/' + i.mask.split('.').reduce((a, x) => a + (+x).toString(2).replace(/0/g, '').length, 0));
      c.out('  MTU 1500 bytes, BW 100000 Kbit/sec');
      c.out('  [the remaining lines are not shown in this practice terminal]', 'dim');
    };
    api.showMac = c => {
      c.out('          Mac Address Table'); c.out('-------------------------------------------'); c.out('');
      c.out('Vlan    Mac Address       Type        Ports'); c.out('----    -----------       --------    -----');
      dev.macs.forEach(m => c.out(pad(String(m.vlan).padStart(4, ' '), 8) + pad(m.mac.toLowerCase(), 18) + pad(m.type, 12) + m.port));
      c.out('Total Mac Addresses for this criterion: ' + dev.macs.length);
    };
    api.showRun = c => {
      const L = dev.cfgLines(dev.run); c.out('Building configuration...'); c.out('');
      c.out('Current configuration : ' + (L.join('\n').length + 120) + ' bytes'); L.forEach(l => c.out(l));
    };
    api.showStart = c => {
      if (!dev.start) { c.out('startup-config is not present'); return; }
      c.out('Using ' + (dev.cfgLines(dev.start).join('\n').length + 120) + ' bytes'); dev.cfgLines(dev.start).forEach(l => c.out(l));
    };
    api.linkMsg = c => {
      const n = dev.curIf; const l = dev.link(n); const ifn = n;
      const before = c.prevLink; if (before && before.st === l.st && before.pr === l.pr) return;
      if (l.pr === 'up') { c.out('%LINK-3-UPDOWN: Interface ' + ifn + ', changed state to up', 'dim'); c.out('%LINEPROTO-5-UPDOWN: Line protocol on Interface ' + ifn + ', changed state to up', 'dim'); }
      else if (l.st === 'administratively down') { c.out('%LINK-5-CHANGED: Interface ' + ifn + ', changed state to administratively down', 'dim'); if (before && before.pr === 'up') c.out('%LINEPROTO-5-UPDOWN: Line protocol on Interface ' + ifn + ', changed state to down', 'dim'); }
    };
    api.ping = c => {
      const ip = c.args[0]; c.out('Type escape sequence to abort.'); c.out('Sending 5, 100-byte ICMP Echos to ' + ip + ', timeout is 2 seconds:');
      let ok = false;
      dev.listIfs().forEach(n => { const i = dev.run.ifs[n]; if (i.ip === ip && dev.link(n).pr === 'up') ok = true; });
      if (!ok && dev.reachable) ok = !!dev.reachable(dev, ip);
      if (ok) { c.out('!!!!!'); c.out('Success rate is 100 percent (5/5), round-trip min/avg/max = 1/1/2 ms'); }
      else { c.out('.....'); c.out('Success rate is 0 percent (0/5)'); }
    };
    api.copyRunStart = c => {
      dev.pending = { prompt: 'Destination filename [startup-config]? ', next: txt => { dev.start = clone(dev.run); dev.saves++; print('Building configuration...'); print('[OK]'); } };
    };
    api.writeMem = c => { dev.start = clone(dev.run); dev.saves++; c.out('Building configuration...'); c.out('[OK]'); };
    api.erase = c => {
      dev.pending = { prompt: 'Erasing the nvram filesystem will remove all configuration files! Continue? [confirm]', next: txt => { if (txt === '' || /^y/i.test(txt)) { dev.start = null; dev.erased++; print('[OK]'); print('Erase of nvram: complete'); print('%SYS-7-NV_BLOCK_INIT: Initialized the geometry of nvram', 'dim'); } } };
    };
    api.reload = c => {
      const doReload = () => {
        dev.pending = { prompt: 'Proceed with reload? [confirm]', next: txt => {
          if (txt === '' || /^y/i.test(txt)) {
            dev.run = dev.start ? clone(dev.start) : dev.factory(); dev.mode = 'user'; dev.curIf = null; dev.reloads++; dev.macs = dev.macs.filter(m => m.type !== 'DYNAMIC');
            print(''); print('Reload requested by console.', 'dim'); print('[Booting... the boot messages are omitted in this practice terminal]', 'dim'); print(''); print('Press RETURN to get started!');
          }
        } };
      };
      if (dev.unsaved()) {
        const ask = () => { dev.pending = { prompt: 'System configuration has been modified. Save? [yes/no]: ', next: txt => {
          if (/^y(es)?$/i.test(txt)) { dev.start = clone(dev.run); dev.saves++; print('Building configuration...'); print('[OK]'); doReload(); }
          else if (/^n(o)?$/i.test(txt)) doReload();
          else { print("Please answer 'yes' or 'no'."); ask(); }
        } }; };
        ask();
      } else doReload();
    };
    api.doExec = c => { runLine(c.args[0], 'priv', true, c); };

    /* ---- executing a line ---- */
    function runLine(line, mode, nested, parentCtx) {
      const tree = TREE; const out = parentCtx ? parentCtx.out : (t, cls) => print(t, cls);
      const ctx = { neg: false, args: [], dev, out, errLine: t => out(t, 'err'), prevLink: null };
      if (dev.curIf && dev.run.ifs[dev.curIf]) ctx.prevLink = dev.link(dev.curIf);
      const toks = tokenize(line);
      if (!toks.length) return;
      const promptLen = (nested ? '' : dev.prompt()).length;
      const w = walk(tree, mode, line, toks, ctx);
      const fail = kind => { dev.errCount++; dev.errKinds[kind] = (dev.errKinds[kind] || 0) + 1; };
      if (w.err === 'ambiguous') { fail('ambiguous'); out('% Ambiguous command:  "' + line.trim() + '"', 'err'); return; }
      if (w.err === 'invalid') {
        if (w.k === 0 && (mode === 'user' || mode === 'priv') && !dev.run.noLookup) { fail('unknown'); out('Translating "' + toks[0].t + '"', 'dim'); out('% Unknown command or computer name, or unable to find computer address', 'err'); return; }
        if (w.k === 0 && (mode === 'user' || mode === 'priv')) { fail('unknown'); out('% Unknown command or computer name, or unable to find computer address', 'err'); return; }
        fail('invalid'); out(' '.repeat(promptLen + toks[w.k].i) + '^', 'err'); out("% Invalid input detected at '^' marker.", 'err'); return;
      }
      const node = w.node;
      const fn = node ? (ctx.neg ? (node.runNeg || node.run) : node.run) : null;
      if (!fn) { fail('incomplete'); out('% Incomplete command.', 'err'); return; }
      fn(ctx);
    }

    function submit(raw) {
      const line = raw;
      print(dev.prompt() + line);
      const before = snapshot();
      if (dev.pending) {
        const p = dev.pending; dev.pending = null; p.next(line.trim());
      } else if (line.trim()) {
        dev.history.push(line.trim()); hist.push(line); hi = hist.length;
        const mode = dev.mode; runLine(line, mode, false, null);
      }
      setPrompt(); scroll(); renderState(before); if (cfg.onChange) cfg.onChange(dev);
    }

    /* ---- help / tab ---- */
    function showHelp() {
      const v = inEl.value; const mode = dev.mode;
      const ctx = { neg: false, args: [], dev, out: print };
      print(dev.prompt() + v + '?');
      const r = helpFor(TREE, mode, v, ctx);
      if (r.err) { print(r.unrec ? '% Unrecognized command' : '% Unrecognized command', 'err'); }
      else if (r.words) print(r.words.join('  '));
      else { const wd = Math.max(...r.rows.map(x => x[0].length)) + 2; r.rows.forEach(x => print('  ' + pad(x[0], wd) + x[1])); }
      dev.history.push(v + '?'); noteHelp(v); scroll(); if (cfg.onChange) cfg.onChange(dev);
    }
    function noteHelp() { dev.helpUsed = (dev.helpUsed || 0) + 1; }
    function tab() {
      const v = inEl.value; if (!v || /\s$/.test(v)) return;
      const toks = tokenize(v); const last = toks.pop(); const ctx = { neg: false, args: [], dev, out: print };
      const w = walk(TREE, dev.mode, v, toks, ctx); if (w.err) return;
      const cand = kids(w.level, ctx).filter(n => n.w && n.w.startsWith(last.t.toLowerCase()));
      if (cand.length === 1) { inEl.value = v.slice(0, last.i) + cand[0].w + ' '; dev.tabUsed = (dev.tabUsed || 0) + 1; }
    }

    inEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); const v = inEl.value; inEl.value = ''; submit(v); }
      else if (e.key === '?' && !dev.pending) { e.preventDefault(); showHelp(); }
      else if (e.key === 'Tab') { e.preventDefault(); if (!dev.pending) tab(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi > 0) { hi--; inEl.value = hist[hi]; } }
      else if (e.key === 'ArrowDown') { e.preventDefault(); if (hi < hist.length - 1) { hi++; inEl.value = hist[hi]; } else { hi = hist.length; inEl.value = ''; } }
      else if (e.key.toLowerCase() === 'z' && e.ctrlKey) { e.preventDefault(); if (dev.mode === 'config' || dev.mode === 'if') { print(dev.prompt() + '^Z'); const b = snapshot(); dev.mode = 'priv'; dev.curIf = null; setPrompt(); renderState(b); if (cfg.onChange) cfg.onChange(dev); scroll(); } }
    });
    bodyEl.addEventListener('click', () => { if (!window.getSelection().toString()) inEl.focus(); });

    /* ---- state panel ---- */
    const stateBody = h('div', { class: 'state-body' });
    const modeBadge = h('span', { class: 'mode' });
    const stateHead = h('div', { class: 'state-head' }, h('span', null, 'Cihazın vəziyyəti'), modeBadge);
    const statePanel = h('div', { class: 'state' }, stateHead, stateBody);

    function snapshot() { const s = {}; dev.listIfs().forEach(n => { const i = dev.run.ifs[n]; const l = dev.link(n); s[n] = [i.shut, i.ip, i.mask, i.desc, l.st, l.pr].join('|'); }); s._host = dev.run.hostname; s._macs = dev.macs.length; return s; }

    function diff(a, b) {
      const n = a.length, m = b.length; const T = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
      for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) T[i][j] = a[i] === b[j] ? T[i + 1][j + 1] + 1 : Math.max(T[i + 1][j], T[i][j + 1]);
      const out = []; let i = 0, j = 0;
      while (i < n && j < m) { if (a[i] === b[j]) { out.push({ t: 's', x: a[i] }); i++; j++; } else if (T[i + 1][j] >= T[i][j + 1]) { out.push({ t: 'd', x: a[i] }); i++; } else { out.push({ t: 'a', x: b[j] }); j++; } }
      while (i < n) out.push({ t: 'd', x: a[i++] }); while (j < m) out.push({ t: 'a', x: b[j++] });
      return out;
    }

    function renderState(before) {
      setPrompt();
      modeBadge.textContent = dev.pending ? 'sual gözləyir' : ({ user: 'User EXEC', priv: 'Privileged EXEC', config: 'Global config', if: 'Interface config' }[dev.mode]);
      stateBody.innerHTML = '';
      const hn = h('div', null, h('b', null, 'Hostname: '), h('span', { style: 'font-family:var(--font-mono)' }, dev.run.hostname));
      stateBody.append(hn);
      // interfaces
      const t = h('table'); t.append(h('tr', null, h('th', null, 'Port'), h('th', null, 'IP'), h('th', null, 'Status'), h('th', null, 'Kabel')));
      const after = snapshot();
      dev.listIfs().forEach(n => {
        const i = dev.run.ifs[n]; const l = dev.link(n); const c = dev.cables[n];

      nextK ? h('button', { class: 'btn btn-primary', type: 'button', onclick: () => PT.go('/' + part.id + '/' + id + '/' + nextK) }, 'Növbəti: ' + STEPS.find(s => s.k === nextK).n) : h('span'));
    if (step === 'explain') {

    } else if (step === 'cheat') {
      const el = h('div', { class: 'cheat-wrap', html: T.cheat }); body.append(el);
      body.append(h('div', { class: 'sim-ctrl', style: 'margin-top:18px' }, h('button', { class: 'btn btn-sm', type: 'button', onclick: () => window.print() }, 'Çap et (PDF kimi saxla)')));
      PT.glossify(el); PT.progress.markSeen(id, 'cheat'); body.append(nav('explain', 'lab'));

    return h('div', { class: 'part' }, side(part, id), main);

  PT.boot = function () {

PT.frag = {"p1/t01/cheat":"<h2>Qısa xülasə<\/h2>\n<div class=\"cheat-box\"><ul class=\"cheat\">\n<li>Hər cihazın iki ünvanı var: <b>MAC<\/b> (Layer 2) və <b>IP<\/b> (Layer 3).<\/li>\n<li>MAC eyni link daxilində çatdırılma üçündür. IP network-lər arasında yönləndirmə üçündür.<\/li>\n<li>Router MAC-a görə yönləndirmir, çünki MAC-da network hissəsi yoxdur.<\/li>\n<li>MAC 48 bitdir = 6 bayt = 12 hex rəqəm.<\/li>\n<li>Bir hex rəqəm = 4 bit. İki hex rəqəm = 1 bayt.<\/li>\n<li>MAC-ın ilk 3 baytı OUI-dir (istehsalçı). Son 3 bayt istehsalçının verdiyi nömrədir.<\/li>\n<li>İlk baytın sağdan 1-ci biti (I/G): 0 = unicast, 1 = group (multicast/broadcast).<\/li>\n<li>İlk baytın sağdan 2-ci biti (U/L): 0 = universal, 1 = locally administered.<\/li>\n<li><span class=\"m\">FF:FF:FF:FF:FF:FF<\/span> = broadcast MAC.<\/li>\n<li>IPv4 = 32 bit = 4 oktet. Hər oktet 8 bitdir, dəyəri 0–255.<\/li>\n<li>Bit çəkiləri: 128 64 32 16 8 4 2 1.<\/li>\n<li>IP ünvanı network hissəsi + host hissəsindən ibarətdir. Sərhədi mask göstərir.<\/li>\n<li>Private: 10.0.0.0/8, 172.16.0.0–172.31.255.255, 192.168.0.0/16.<\/li>\n<li>127.0.0.1 = loopback (öz cihazın). Paket kabelə çıxmır.<\/li>\n<li>169.254.x.x = APIPA. DHCP işləməyib, ünvan yalnız lokal link üçündür.<\/li>\n<li>ipconfig-də \"Physical Address\" = MAC. \"IPv4 Address\" = IP.<\/li>\n<\/ul><\/div>\n<h2>Bu mövzudakı əmrlər<\/h2>\n<table class=\"cmd-table\">\n<tr><td>ipconfig<span class=\"where\">Windows CMD<\/span><\/td><td>IP, mask və gateway-i qısa göstərir.<\/td><\/tr>\n<tr><td>ipconfig /all<span class=\"where\">Windows CMD<\/span><\/td><td>Hər şeyi göstərir, o cümlədən MAC (Physical Address), DHCP, DNS.<\/td><\/tr>\n<tr><td>getmac<span class=\"where\">Windows CMD<\/span><\/td><td>Yalnız MAC ünvanını göstərir.<\/td><\/tr>\n<tr><td>ifconfig  /  ip addr<span class=\"where\">Linux, macOS terminal<\/span><\/td><td>Windows-da ipconfig-in qarşılığı.<\/td><\/tr>\n<\/table>\n","p1/t01/explain":"<h2 id=\"why-addresses\">Niyə bir cihazın iki ünvanı var?<\/h2>\n<p>Şəbəkədəki hər cihazın (PC, server, router interface-i) iki ayrı ünvanı olur: <b>MAC ünvanı<\/b> (Layer 2) və <b>IP ünvanı<\/b> (Layer 3). İlk baxışda biri kifayət etməli kimi görünür, amma bu iki ünvan iki fərqli iş görür.<\/p>\n<p><b>Qayda:<\/b> MAC ünvanı yalnız bir link daxilində (eyni network segmentində) çatdırılma üçün işlənir. IP ünvanı isə cihazı bütün şəbəkələr arasında tapmaq üçün işlənir.<\/p>\n<p><b>Niyə belədir:<\/b> MAC ünvanının daxilində heç bir quruluş yoxdur. Onu istehsalçı kartın içinə yazır və ünvan cihazın harada olduğunu göstərmir. Router MAC ünvanı ilə işləsəydi, dünyadakı hər cihaz üçün ayrıca qeyd saxlamalı olardı. IP ünvanı isə iki hissədən ibarətdir: <b>network hissəsi<\/b> və <b>host hissəsi<\/b>. Router yalnız network hissəsinə baxır, yəni milyonlarla cihaz əvəzinə bir neçə network üçün qeyd saxlayır.<\/p>\n<p><b>Burada necə tətbiq olunur:<\/b> eyni network-dəki cihazlar bir-birinə MAC ünvanı ilə çatdırılır (switch bunu edir). Fərqli network-lər arasında paket IP ünvanına görə yönləndirilir (router bunu edir). Hər iki ünvan eyni paketdə eyni anda olur.<\/p>\n<div class=\"figure\"><svg viewBox=\"0 0 760 210\" role=\"img\" aria-label=\"PC, switch və router: hər biri hansı ünvana baxır\">\n<rect x=\"14\" y=\"40\" width=\"190\" height=\"120\" rx=\"6\" class=\"fill-blue\"/>\n<text x=\"109\" y=\"68\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\">PC1<\/text>\n<text x=\"109\" y=\"100\" text-anchor=\"middle\" font-size=\"13\" class=\"t-m\">IP:  192.168.1.10<\/text>\n<text x=\"109\" y=\"122\" text-anchor=\"middle\" font-size=\"13\" class=\"t-m\">MAC: 0001.4321.AAAA<\/text>\n<text x=\"109\" y=\"146\" text-anchor=\"middle\" font-size=\"12\" class=\"t-dim\">iki ünvanı da var<\/text>\n<line x1=\"204\" y1=\"100\" x2=\"300\" y2=\"100\" class=\"ln\"/>\n<rect x=\"300\" y=\"64\" width=\"150\" height=\"72\" rx=\"6\" class=\"box-s\"/>\n<text x=\"375\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Switch<\/text>\n<text x=\"375\" y=\"116\" text-anchor=\"middle\" font-size=\"13\">yalnız MAC-a baxır<\/text>\n<line x1=\"450\" y1=\"100\" x2=\"560\" y2=\"100\" class=\"ln\"/>\n<circle cx=\"620\" cy=\"100\" r=\"52\" class=\"fill-yel\"/>\n<text x=\"620\" y=\"96\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Router<\/text>\n<text x=\"620\" y=\"116\" text-anchor=\"middle\" font-size=\"13\">IP-yə baxır<\/text>\n<text x=\"375\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" class=\"t-dim\">Eyni network daxilində: MAC · Network-lər arasında: IP<\/text>\n<\/svg><div class=\"fig-cap\">Bir paket hər iki ünvanı daşıyır. Hansı cihazın hansı ünvana baxdığı onun hansı layer-də işlədiyindən asılıdır.<\/div><\/div>\n<details class=\"box box-think\"><summary>Dayan və düşün: yalnız MAC ünvanı ilə internet işləyə bilərdimi?<\/summary><div class=\"ans\">Texniki olaraq bəli, amma hər router dünyadakı bütün cihazların MAC ünvanını öz cədvəlində saxlamalı olardı. Yeni cihaz qoşulanda hamısı yenilənməli olardı. IP-də network hissəsi olduğu üçün router yalnız \"bu network hansı yoldadır\" bilir. MAC ünvanında isə bu quruluş yoxdur, ona görə yönləndirmə üçün yararsızdır.<\/div><\/details>\n\n<h2 id=\"hex\">Hex nədir və MAC niyə hex ilə yazılır?<\/h2>\n<p>MAC ünvanını oxumaq üçün <b>hexadecimal<\/b> (onaltılıq) say sistemini bilmək lazımdır. Bu sistemdə 16 rəqəm var: <span class=\"m\">0-9<\/span> və <span class=\"m\">A-F<\/span> (A=10, B=11, C=12, D=13, E=14, F=15).<\/p>\n<p><b>Qayda:<\/b> bir hex rəqəm düz 4 bitə bərabərdir, iki hex rəqəm düz 1 bayta (8 bit). <b>Niyə belədir:<\/b> 16 = 2<sup>4<\/sup>. 4 bit 0-dan 15-ə qədər 16 dəyər verir, hər dəyər üçün bir hex rəqəm. Bu, uzun bit sətirlərini qısa yazmağa imkan verir və heç nə itirmir: <span class=\"m\">11111111<\/span> = <span class=\"m\">FF<\/span> = 255.<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Hex<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><th>9<\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>D<\/th><th>E<\/th><th>F<\/th><\/tr>\n<tr><td>Bit<\/td><td class=\"m\">0000<\/td><td class=\"m\">0001<\/td><td class=\"m\">0010<\/td><td class=\"m\">0011<\/td><td class=\"m\">0100<\/td><td class=\"m\">0101<\/td><td class=\"m\">0110<\/td><td class=\"m\">0111<\/td><td class=\"m\">1000<\/td><td class=\"m\">1001<\/td><td class=\"m\">1010<\/td><td class=\"m\">1011<\/td><td class=\"m\">1100<\/td><td class=\"m\">1101<\/td><td class=\"m\">1110<\/td><td class=\"m\">1111<\/td><\/tr><\/table><\/div>\n<p>Beləliklə, hex baytı bitə çevirmək asandır: <span class=\"m\">3C<\/span> → <span class=\"m\">3<\/span> = 0011, <span class=\"m\">C<\/span> = 1100 → <span class=\"m\">00111100<\/span>.<\/p>\n\n<h2 id=\"mac\">MAC ünvanı<\/h2>\n<p><b>MAC ünvanı 48 bitdir<\/b> (6 bayt), hex ilə 12 rəqəmlə yazılır. Eyni ünvan müxtəlif formatlarda yazıla bilər, dəyər dəyişmir:<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Format<\/th><th>Nümunə<\/th><th>Harada görürsən<\/th><\/tr>\n<tr><td>Cisco (nöqtəli)<\/td><td class=\"m\">0001.4321.AAAA<\/td><td>Cisco IOS və Packet Tracer<\/td><\/tr>\n<tr><td>Tire ilə<\/td><td class=\"m\">00-01-43-21-AA-AA<\/td><td>Windows (ipconfig /all)<\/td><\/tr>\n<tr><td>İkinoqtalı<\/td><td class=\"m\">00:01:43:21:AA:AA<\/td><td>Linux, macOS, Wireshark<\/td><\/tr><\/table><\/div>\n<h3 id=\"mac-parts\">MAC ünvanının iki yarısı<\/h3>\n<p>Ünvan iki hissəyə bölünür. İlk 3 bayt (24 bit) <b>OUI<\/b> adlanır: bu hissəni IEEE istehsalçıya verir, yəni ilk yarı \"kart kimin istehsalıdır\" deməkdir. Son 3 bayt istehsalçının özünün verdiyi nömrədir; istehsalçı hər kartı üçün fərqli nömrə verir ki, iki kartın tam ünvanı eyni olmasın.<\/p>\n<h3 id=\"mac-bits\">İlk baytdakı iki xüsusi bit<\/h3>\n<p>İlk baytın sağdan <b>1-ci biti (I/G)<\/b> ünvanın növünü göstərir: 0 olsa <b>unicast<\/b> (bir cihaz), 1 olsa <b>group<\/b> ünvanıdır (multicast və broadcast). Sağdan <b>2-ci biti (U/L)<\/b> ünvanı kimin təyin etdiyini göstərir: 0 olsa universal (istehsalçı), 1 olsa locally administered (administrator və ya proqram).<\/p>\n<p><b>Niyə bu vacibdir:<\/b> switch və NIC kadrı qəbul edib-etməməyə bu bitə baxaraq qərar verir. Məsələn, <span class=\"m\">01:00:5E:...<\/span> ilə başlayan ünvanda ilk bayt 01 = 0000000<b>1<\/b>, yəni I/G biti 1-dir: bu, unicast deyil, multicast ünvanıdır. <span class=\"m\">FF:FF:FF:FF:FF:FF<\/span> ünvanında bütün bitlər 1-dir, bu, broadcast-dır. Bunların hər birini növbəti mövzularda (Cast növləri) ətraflı görəcəksən.<\/p>\n<div data-sim=\"macview\"><\/div>\n<div class=\"box box-note\"><h4>MAC ünvanı dəyişə bilərmi?<\/h4><p>Kartın içinə yazılan ünvan (burned-in address) istehsalda təyin olunur. Amma əməliyyat sistemi öz ünvanını proqramla dəyişə bilər (spoofing). Buna görə MAC ünvanı kimliyin sübutu deyil: onu yalnız \"link-də cihazı tanıma etiketi\" kimi düşün. Bunun təhlükəsizlik nəticələrini Part 4-də görəcəksən.<\/p><\/div>\n\n<h2 id=\"ip-binary\">IPv4 ünvanı: 32 bit<\/h2>\n<p>IPv4 ünvanı <b>32 bitdir<\/b>. Oxumaq üçün rahat olsun deyə 8-lik qruplara (oktet) bölünür və hər oktet onluq say ilə yazılır: <span class=\"m\">192.168.1.10<\/span>.<\/p>\n<p><b>Qayda:<\/b> hər oktet 8 bitdir, ona görə dəyəri 0-dan 255-ə qədərdir. <b>Niyə belədir:<\/b> 8 bit 2<sup>8<\/sup> = 256 fərqli kombinasiya verir (0-dan 255-ə qədər). Ən böyük dəyər <span class=\"m\">11111111<\/span> = 255. Buna görə <span class=\"m\">192.168.1.300<\/span> mümkün deyil: 300 səkkiz bitə sığmır.<\/p>\n<h3 id=\"convert\">Onluqdan ikiliyə çevirmə<\/h3>\n<p>Hər bit mövqeyinin öz çəkisi var: soldan sağa <span class=\"m\">128, 64, 32, 16, 8, 4, 2, 1<\/span>. Rəqəmi ikiliyə çevirmək üçün soldan başlayıb soruşursan: \"bu çəki qalan rəqəmə sığırmı?\" Sığırsa bit 1 olur və çəkini çıxırsan, sığmırsa bit 0 olur.<\/p>\n<p>Misal: <b>130<\/b>. 128 sığır → 1, qalan 2. 64, 32, 16, 8, 4 sığmır → 0. 2 sığır → 1, qalan 0. 1 sığmır → 0. Nəticə: <span class=\"m\">10000010<\/span>.<\/p>\n<p>Tərsinə: ikilikdən onluğa çevirmək üçün 1 olan bitlərin çəkilərini toplayırsan. <span class=\"m\">11000000<\/span> = 128 + 64 = <b>192<\/b>.<\/p>\n<div data-sim=\"bitgrid\" data-opts='{\"ip\":\"192.168.1.10\",\"prefix\":24,\"showMask\":false,\"showResult\":false,\"editPrefix\":false,\"title\":\"Bit grid: onluq ↔ ikilik\"}'><\/div>\n<details class=\"box box-think\"><summary>Dayan və düşün: 11000000 onluqda neçədir?<\/summary><div class=\"ans\">Birinci bit (128) və ikinci bit (64) 1-dir: 128 + 64 = <b>192<\/b>. Gələcəkdə subnetting-də bu dəyəri çox görəcəksən: 192 mask-ın ilk iki biti 1 olan oktetidir.<\/div><\/details>\n\n<h2 id=\"ip-parts\">IP ünvanının iki hissəsi<\/h2>\n<p>IP ünvanının bir hissəsi <b>network<\/b>-ü, qalan hissəsi isə o network daxilindəki <b>host<\/b>-u göstərir. Sərhədin harada olduğunu ünvanın özü deyil, <b>subnet mask<\/b> deyir. Məsələn, <span class=\"m\">192.168.1.10<\/span> ünvanı <span class=\"m\">255.255.255.0<\/span> maskası ilə birlikdə \"192.168.1 network-ündə 10 nömrəli host\" deməkdir.<\/p>\n<p>Bunu növbəti mövzuda (Subnet mask və subnetting) ətraflı görəcəksən. İndi yadda saxla: <b>IP ünvanı tək başına tam məlumat vermir, mask-la birlikdə məna daşıyır.<\/b><\/p>\n\n<h2 id=\"special\">Xüsusi IP ünvanları<\/h2>\n<p>Bütün IPv4 ünvanları internetdə adi ünvan deyil. Bəziləri xüsusi məqsəd üçün ayrılıb və yeni başlayanlar tez-tez bunları qarışdırırlar.<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Ünvan aralığı<\/th><th>Adı<\/th><th>Nə üçündür<\/th><\/tr>\n<tr><td class=\"m\">10.0.0.0 – 10.255.255.255<\/td><td>Private<\/td><td>Ofis və ev şəbəkələrində daxili istifadə. İnternetdə route olunmur.<\/td><\/tr>\n<tr><td class=\"m\">172.16.0.0 – 172.31.255.255<\/td><td>Private<\/td><td>Eyni məqsəd. Diqqət: yalnız 172.16-dan 172.31-ə qədər. 172.32.x.x public-dir.<\/td><\/tr>\n<tr><td class=\"m\">192.168.0.0 – 192.168.255.255<\/td><td>Private<\/td><td>Eyni məqsəd. Ev router-lərində ən çox bu görünür.<\/td><\/tr>\n<tr><td class=\"m\">127.0.0.0 – 127.255.255.255<\/td><td>Loopback<\/td><td>Cihazın özü. <span class=\"m\">127.0.0.1<\/span> həmişə \"mən özüm\" deməkdir. Bu ünvana göndərilən paket heç vaxt kabelə çıxmır.<\/td><\/tr>\n<tr><td class=\"m\">169.254.0.0 – 169.254.255.255<\/td><td>Link-local (APIPA)<\/td><td>DHCP server tapılmayanda Windows özü verir. Yalnız eyni link daxilində işləyir.<\/td><\/tr>\n<tr><td class=\"m\">0.0.0.0<\/td><td>\"Bilinmir / hamısı\"<\/td><td>Hələ ünvanı olmayan host, və ya default route (Part 3).<\/td><\/tr>\n<tr><td class=\"m\">255.255.255.255<\/td><td>Limited broadcast<\/td><td>Bu network daxilində hamıya. Router bunu başqa network-ə ötürmür.<\/td><\/tr><\/table><\/div>\n<p><b>Private ünvanlar niyə var?<\/b> IPv4-də cəmi 2<sup>32<\/sup> (təxminən 4,3 milyard) ünvan var və bu, dünyadakı cihazlar üçün çatmır. Hər ofis eyni private ünvanlardan istifadə edə bilir, çünki bu ünvanlar internetdə route olunmur. İnternetə çıxanda private ünvan public ünvana çevrilir. Bu çevirməni (NAT) Part 5-də öyrənəcəksən.<\/p>\n<div class=\"box box-note\"><h4>Köhnə kitablardakı \"Class A/B/C\"<\/h4><p>Köhnə dərsliklərdə ünvanlar ilk oktetə görə Class A, B, C siniflərinə bölünürdü və mask sinfə görə avtomatik təyin olunurdu. Bu sistem artıq istifadə olunmur. İndi mask ünvandan ayrı təyin olunur (CIDR). Sinif adlarını görsən belə, mask-ı həmişə ayrıca yoxla.<\/p><\/div>\n\n<h2 id=\"ipconfig\">Öz kompüterində ünvanları gör: ipconfig /all<\/h2>\n<p>Windows-da komanda sətrini aç (<b>Win + R<\/b> → <span class=\"m\">cmd<\/span> → Enter) və yaz:<\/p>\n<pre class=\"pre\"><span class=\"p\">C:\\&gt;<\/span>ipconfig /all\n\nEthernet adapter Ethernet:\n\n   Description . . . . . . . . . . . : Intel(R) Ethernet Connection\n   <b>Physical Address. . . . . . . . . : 3C-52-82-AA-10-5B<\/b>  <span class=\"c\">← MAC<\/span>\n   DHCP Enabled. . . . . . . . . . . : Yes\n   <b>IPv4 Address. . . . . . . . . . . : 192.168.1.37(Preferred)<\/b>  <span class=\"c\">← IP<\/span>\n   <b>Subnet Mask . . . . . . . . . . . : 255.255.255.0<\/b>  <span class=\"c\">← mask<\/span>\n   <b>Default Gateway . . . . . . . . . : 192.168.1.1<\/b>  <span class=\"c\">← router<\/span>\n   DHCP Server . . . . . . . . . . . : 192.168.1.1\n   DNS Servers . . . . . . . . . . . : 192.168.1.1<\/pre>\n<p>Bu çıxışda gördüyün hər sətir sonrakı mövzulara bağlıdır: <b>Subnet Mask<\/b> və <b>Default Gateway<\/b> növbəti mövzuda və Part 2-də, <b>DHCP<\/b> və <b>DNS<\/b> isə Part 2-də öyrəniləcək. İndilik <b>Physical Address<\/b> (MAC) və <b>IPv4 Address<\/b> sətirlərini tanı.<\/p>\n<p>macOS və Linux-da: <span class=\"m\">ifconfig<\/span> və ya <span class=\"m\">ip addr<\/span> (MAC üçün <span class=\"m\">ether<\/span> / <span class=\"m\">link/ether<\/span> sətrinə bax).<\/p>\n<div class=\"box box-pt\"><h4>Packet Tracer-də<\/h4><p>PC-yə klik et → <b>Desktop<\/b> nişanı → <b>IP Configuration<\/b>: orada IP, mask və gateway yazırsan (Static) və ya DHCP seçirsən. <b>Command Prompt<\/b>-da <span class=\"m\">ipconfig /all<\/span> işlədə bilərsən. PT-nin çıxışı Windows-unkinə oxşardır, amma sətirlərin düzülüşü bir qədər fərqli ola bilər. Packet Tracer interfeysini 8-ci mövzuda ətraflı görəcəksən.<\/p><\/div>\n<details class=\"box box-think\"><summary>Dayan və düşün: ipconfig 169.254.20.5 göstərir. Nə baş verib?<\/summary><div class=\"ans\">Kompüter DHCP server axtarıb, cavab ala bilməyib və özünə link-local ünvan verib. Bu ünvan yalnız eyni link daxilində işləyir, internetə və ya başqa network-ə çıxış yoxdur. Yoxlanacaq ilk şeylər: kabel/Wi-Fi qoşulub mu, DHCP server işləyirmi.<\/div><\/details>\n","p1/t02/cheat":"<h2>Qısa xülasə<\/h2>\n<div class=\"cheat-box\"><ul class=\"cheat\">\n<li>Mask IP-nin hansı hissəsinin network, hansı hissəsinin host olduğunu göstərir.<\/li>\n<li>Mask-da 1 = network biti, 0 = host biti. Əvvəl hamısı 1, sonra hamısı 0.<\/li>\n<li>Prefix length (/24) = mask-dakı 1-lərin sayı. /24 = 255.255.255.0.<\/li>\n<li>Mask oktetində yalnız bu dəyərlər olur: 0, 128, 192, 224, 240, 248, 252, 254, 255.<\/li>\n<li>Network address = IP AND mask (host bitləri sıfırlanır).<\/li>\n<li>Broadcast address = host bitlərinin hamısı 1.<\/li>\n<li>İstifadə olunan host sayı = 2<sup>h<\/sup> − 2 (h = host bitləri). Network və broadcast ünvanı host-a verilmir.<\/li>\n<li>/25=126 host, /26=62, /27=30, /28=14, /29=6, /30=2.<\/li>\n<li>Blok ölçüsü = 256 − mask-ın maraqlı oktetindəki dəyər.<\/li>\n<li>Network = IP-nin oktetindən kiçik və ya bərabər ən böyük blok misli. Broadcast = növbəti network − 1.<\/li>\n<li>Host hədəfin eyni network-də olub-olmadığına <b>öz mask-ı<\/b> ilə qərar verir.<\/li>\n<li>Eyni network → birbaşa göndərir (ARP ilə hədəfin MAC-i). Fərqli network → default gateway-ə göndərir (ARP ilə gateway-in MAC-i).<\/li>\n<li>Default gateway host ilə eyni subnet-də olmalıdır.<\/li>\n<li>Subnetting: n bit borc götürsən 2<sup>n<\/sup> subnet alınır, prefix n qədər artır.<\/li>\n<li>Bu kursda yalnız bərabər bölmə var (VLSM yoxdur).<\/li>\n<\/ul><\/div>\n<h2>Bu mövzudakı əmrlər<\/h2>\n<table class=\"cmd-table\">\n<tr><td>ipconfig<span class=\"where\">Windows CMD<\/span><\/td><td>IP, mask və default gateway-i göstərir. Üçünü də subnet qaydasına görə yoxla.<\/td><\/tr>\n<tr><td>ping &lt;ünvan&gt;<span class=\"where\">Windows CMD, PT PC<\/span><\/td><td>Eyni network-dəki və ya gateway ünvanına ping ataraq konfiqurasiyanı sına.<\/td><\/tr>\n<\/table>\n<h2>Sürətli cədvəl<\/h2>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Prefix<\/th><th>Mask (son oktet)<\/th><th>Blok<\/th><th>Host<\/th><\/tr>\n<tr><td class=\"m\">/25<\/td><td class=\"m\">128<\/td><td>128<\/td><td>126<\/td><\/tr><tr><td class=\"m\">/26<\/td><td class=\"m\">192<\/td><td>64<\/td><td>62<\/td><\/tr><tr><td class=\"m\">/27<\/td><td class=\"m\">224<\/td><td>32<\/td><td>30<\/td><\/tr><tr><td class=\"m\">/28<\/td><td class=\"m\">240<\/td><td>16<\/td><td>14<\/td><\/tr><tr><td class=\"m\">/29<\/td><td class=\"m\">248<\/td><td>8<\/td><td>6<\/td><\/tr><tr><td class=\"m\">/30<\/td><td class=\"m\">252<\/td><td>4<\/td><td>2<\/td><\/tr><\/table><\/div>\n","p1/t02/explain":"<h2 id=\"mask-why\">Mask nəyi həll edir?<\/h2>\n<p>Əvvəlki mövzuda öyrəndin ki, IP ünvanının bir hissəsi network-ü, bir hissəsi host-u göstərir. Amma <span class=\"m\">192.168.1.10<\/span> ünvanına baxanda hardan bilmək olar ki, network <span class=\"m\">192.168.1<\/span>-dir, yoxsa <span class=\"m\">192.168<\/span>? Ünvanın özündə bu məlumat yoxdur. Sərhədi <b>subnet mask<\/b> göstərir.<\/p>\n<p><b>Qayda:<\/b> mask 32 bitdir. Mask-da 1 olan bitlər IP ünvanının network hissəsinə, 0 olan bitlər host hissəsinə uyğun gəlir.<\/p>\n<p><b>Niyə lazımdır:<\/b> hər cihaz bir sual verməlidir: \"göndərmək istədiyim ünvan mənim network-ümdədirmi?\" Cavab \"bəli\" olsa paketi birbaşa hədəfə göndərir, \"xeyr\" olsa default gateway-ə (router-ə) verir. Cihazın bütün dünyanın marşrut cədvəli yoxdur, bu tək müqayisə onun bütün qərarıdır. Müqayisə üçün network hissəsinin harada bitdiyini bilmək lazımdır, onu da mask verir.<\/p>\n\n<h2 id=\"mask-binary\">Mask ikilikdə<\/h2>\n<p>Mask həmişə <b>əvvəl ardıcıl 1-lər, sonra ardıcıl 0-lar<\/b> olur. Məsələn <span class=\"m\">255.255.255.0<\/span> ikilikdə belədir:<\/p>\n<pre class=\"pre\">11111111.11111111.11111111.00000000\n\\_________ 24 bit 1 ________/ \\__ 8 bit 0 __/\n   network hissəsi              host hissəsi<\/pre>\n<p>Birdən-birə 1-lərin sayını yazmaq qısadır: bu mask <b>/24<\/b> (prefix length) adlanır, yəni \"ilk 24 bit network-dür\". Bu yazı forması <b>CIDR notation<\/b>-dır: <span class=\"m\">192.168.1.0/24<\/span>.<\/p>\n<p><b>Niyə 1-lər və 0-lar qarışa bilməz:<\/b> bu, hesablamanı sadə saxlayır: network hissəsi həmişə ünvanın əvvəlindən başlayan bir blokdur və onu tək rəqəmlə (prefix length) demək mümkündür. Qarışıq mask (məsələn <span class=\"m\">255.255.253.0<\/span>: 253 = 11111101) etibarsızdır. Buna görə mask-ın bir oktetində yalnız bu 9 dəyər ola bilər: <span class=\"m\">0, 128, 192, 224, 240, 248, 252, 254, 255<\/span>.<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Prefix<\/th><th>Mask<\/th><th>Host bitləri<\/th><th>İstifadə olunan host<\/th><th>Blok ölçüsü<\/th><\/tr>\n<tr><td class=\"m\">/8<\/td><td class=\"m\">255.0.0.0<\/td><td>24<\/td><td>16 777 214<\/td><td>—<\/td><\/tr>\n<tr><td class=\"m\">/16<\/td><td class=\"m\">255.255.0.0<\/td><td>16<\/td><td>65 534<\/td><td>—<\/td><\/tr>\n<tr><td class=\"m\">/24<\/td><td class=\"m\">255.255.255.0<\/td><td>8<\/td><td>254<\/td><td>—<\/td><\/tr>\n<tr><td class=\"m\">/25<\/td><td class=\"m\">255.255.255.128<\/td><td>7<\/td><td>126<\/td><td>128<\/td><\/tr>\n<tr><td class=\"m\">/26<\/td><td class=\"m\">255.255.255.192<\/td><td>6<\/td><td>62<\/td><td>64<\/td><\/tr>\n<tr><td class=\"m\">/27<\/td><td class=\"m\">255.255.255.224<\/td><td>5<\/td><td>30<\/td><td>32<\/td><\/tr>\n<tr><td class=\"m\">/28<\/td><td class=\"m\">255.255.255.240<\/td><td>4<\/td><td>14<\/td><td>16<\/td><\/tr>\n<tr><td class=\"m\">/29<\/td><td class=\"m\">255.255.255.248<\/td><td>3<\/td><td>6<\/td><td>8<\/td><\/tr>\n<tr><td class=\"m\">/30<\/td><td class=\"m\">255.255.255.252<\/td><td>2<\/td><td>2<\/td><td>4<\/td><\/tr><\/table><\/div>\n<p><b>Blok ölçüsü<\/b> sütunu növbəti bölmələrdə lazım olacaq: mask-ın \"maraqlı\" oktetinin dəyəri 256-dan çıxılanda alınır (məsələn 256 − 192 = 64).<\/p>\n<div data-sim=\"bitgrid\" data-opts='{\"ip\":\"192.168.1.10\",\"prefix\":24,\"title\":\"Prefix-i dəyiş: mask və network hissəsi necə dəyişir?\"}'><\/div>\n<details class=\"box box-think\"><summary>Dayan və düşün: /26 mask onluq formada nədir?<\/summary><div class=\"ans\">/26 = 26 bit 1: <span class=\"m\">11111111.11111111.11111111.11000000<\/span>. Üç oktet 255-dir. Dördüncü oktet 11000000 = 128 + 64 = 192. Cavab: <b>255.255.255.192<\/b>.<\/div><\/details>\n\n<h2 id=\"and\">AND əməliyyatı: network ünvanını tapmaq<\/h2>\n<p>Bir IP ünvanın hansı network-də olduğunu tapmaq üçün IP ünvanı mask ilə bit-bit <b>AND<\/b> edirsən. AND qaydası: iki bit də 1 olanda nəticə 1, qalan hallarda 0.<\/p>\n<p><b>Niyə bu işləyir:<\/b> mask-ın 1 olan yerində AND IP-nin bitini olduğu kimi saxlayır (1 AND x = x). Mask-ın 0 olan yerində IP-nin biti nə olursa olsun nəticə 0 olur (0 AND x = 0). Beləliklə host bitləri sıfırlanır, network bitləri qalır. Nəticə <b>network ünvanıdır<\/b>.<\/p>\n<pre class=\"pre\">IP:    192.168.1.77  = 11000000.10101000.00000001.<b>010<\/b>01101\nMask:  255.255.255.224 = 11111111.11111111.11111111.<b>111<\/b>00000\nAND:                     11000000.10101000.00000001.<b>010<\/b>00000  = 192.168.1.64<\/pre>\n<p>Bu network-ün digər vacib ünvanları host bitlərinə görə müəyyən olunur:<\/p>\n<ul>\n<li><b>Network address<\/b>: host bitlərinin hamısı 0 (yuxarıdakı kimi, 192.168.1.64). Network-ün özünü təmsil edir, cihaza verilmir.<\/li>\n<li><b>Broadcast address<\/b>: host bitlərinin hamısı 1 (192.168.1.95). Network daxilində hamıya göndərmək üçündür, cihaza verilmir.<\/li>\n<li><b>Host ünvanları<\/b>: ikisinin arasındakılar (192.168.1.65 – 192.168.1.94).<\/li>\n<\/ul>\n<p>Buna görə istifadə olunan host sayı <b>2<sup>h<\/sup> − 2<\/b>-dir (h = host bitlərinin sayı). Niyə 2 çıxılır: network ünvanı və broadcast ünvanı host-a verilə bilməz. /27-də h = 5: 2<sup>5<\/sup> − 2 = 30.<\/p>\n<div data-sim=\"bitgrid\" data-opts='{\"ip\":\"192.168.1.77\",\"prefix\":27,\"title\":\"AND-i bitlərdə gör: 192.168.1.77/27\"}'><\/div>\n\n<h2 id=\"same-network\">Host qərarı: eyni network-dürmü?<\/h2>\n<p>İndi mask-ın əsas işinə qayıdaq. PC-A paket göndərmək istəyəndə bunu edir:<\/p>\n<ol>\n<li>Hədəf IP-ni <b>öz mask-ı<\/b> ilə AND edir.<\/li>\n<li>Nəticəni öz network ünvanı ilə müqayisə edir.<\/li>\n<li>Eynidirsə: hədəf eyni network-dədir. PC-A paketi <b>birbaşa<\/b> hədəfə göndərir (əvvəl ARP ilə hədəfin MAC ünvanını tapır).<\/li>\n<li>Fərqlidirsə: hədəf başqa network-dədir. PC-A paketi <b>default gateway-ə<\/b> göndərir, yəni gateway-in MAC ünvanını tapıb kadrı ona ünvanlayır.<\/li>\n<\/ol>\n<p><b>Vacib məqam:<\/b> hər host bu qərarı <b>öz mask-ı<\/b> ilə verir. Hədəfin mask-ını bilmir (onu bilməyin yolu yoxdur). Ona görə iki host-un mask-ları fərqli yazılsa, biri digərini \"eyni network\" görə bilər, digəri isə yox, və ping bir tərəfdən işləyib digər tərəfdən işləməyə bilər.<\/p>\n<div data-sim=\"samenet\"><\/div>\n<div class=\"box box-pt\"><h4>Packet Tracer-də yoxla<\/h4><p>İki PC-ni bir switch-ə qoş. Birinə <span class=\"m\">192.168.1.10 / 255.255.255.0<\/span>, digərinə <span class=\"m\">192.168.1.200 / 255.255.255.128<\/span> yaz (ikincidə mask fərqlidir). Hər iki PC-dən digərinə ping at və nəticələri müqayisə et. Niyə fərqli olduğunu yuxarıdakı qərar qaydasından çıxarmağa çalış. (PC-ni qoşmağı və IP yazmağı 8-ci mövzuda öyrənəcəksən, indi yalnız nəzəri bax.)<\/p><\/div>\n\n<h2 id=\"fast-method\">Tez hesablama üsulu<\/h2>\n<p>İkilik hesablamaya hər dəfə keçmək lazım deyil. 4 addım:<\/p>\n<ol>\n<li><b>Maraqlı oktet<\/b>: mask-ın 255 də, 0 da olmayan oktet (/26-da dördüncü oktet, /20-də üçüncü oktet).<\/li>\n<li><b>Blok ölçüsü<\/b> = 256 − mask-ın o oktetdəki dəyəri (/26: 256 − 192 = 64).<\/li>\n<li><b>Network<\/b> = IP-nin həmin oktetindəki dəyərdən kiçik və ya ona bərabər olan ən böyük blok misli. Sonrakı oktetlər 0, əvvəlkilər olduğu kimi.<\/li>\n<li><b>Broadcast<\/b> = növbəti network − 1. İlk host = network + 1, son host = broadcast − 1.<\/li>\n<\/ol>\n<p><b>Misal 1:<\/b> <span class=\"m\">192.168.1.77/27<\/span>. Maraqlı oktet dördüncüdür (mask 224), blok = 32. Bloklar: 0, 32, 64, 96. 77 → 64 ≤ 77 &lt; 96, deməli network <b>192.168.1.64<\/b>, broadcast 96 − 1 = <b>192.168.1.95<\/b>. Host-lar .65 – .94.<\/p>\n<p><b>Misal 2:<\/b> <span class=\"m\">172.16.20.20/20<\/span>. /20 = 255.255.240.0, maraqlı oktet üçüncüdür (240), blok = 16. 20 üçün: 16 ≤ 20 &lt; 32 → network <b>172.16.16.0<\/b>. Broadcast: üçüncü oktet 32 − 1 = 31, sonrakı oktet 255 → <b>172.16.31.255<\/b>.<\/p>\n\n<h2 id=\"split\">Subnetting: network-ü hissələrə bölmək<\/h2>\n<p><b>Subnetting<\/b> böyük bir network-ü bir neçə kiçik network-ə (subnet) bölməkdir. <b>Niyə bölürlər:<\/b> (1) bir network-də hamı bir-birinin broadcast-ını alır, network böyüdükcə bu trafik artır; (2) fərqli qruplar (məsələn şöbələr) ayrı network-də olanda aralarındakı trafiki router və ACL ilə idarə etmək olur; (3) ünvanlar boşuna israf olunmur.<\/p>\n<p><b>Necə bölürlər:<\/b> host hissəsindən bir neçə bit \"borc götürülür\" və subnet nömrəsi üçün işlənir. Borc götürülən hər bit mask-a bir yeni 1 əlavə edir.<\/p>\n<ul>\n<li>n bit borc götürsən: <b>2<sup>n<\/sup> subnet<\/b> alınır.<\/li>\n<li>Qalan host bitləri h − n olur: hər subnet-də <b>2<sup>(h−n)<\/sup> − 2<\/b> host.<\/li>\n<li>Yeni prefix = köhnə prefix + n.<\/li>\n<\/ul>\n<p><b>Misal:<\/b> <span class=\"m\">192.168.10.0/24<\/span>-ü 4 subnet-ə bölək. 2<sup>n<\/sup> = 4 → n = 2 bit. Yeni prefix /26, mask 255.255.255.192, blok ölçüsü 64. Subnet-lər: <span class=\"m\">.0, .64, .128, .192<\/span>. Hər birində 62 host.<\/p>\n<div data-sim=\"splitnet\"><\/div>\n<div class=\"box box-note\"><h4>Bu kursda yalnız bərabər bölmə<\/h4><p>Burada bütün subnet-lər eyni ölçülüdür (fixed-length). Fərqli ölçülü subnet-lər (VLSM) bu kursun əhatəsinə daxil deyil.<\/p><\/div>\n<details class=\"box box-think\"><summary>Dayan və düşün: /24 network-ü 8 subnet-ə bölmək üçün neçə bit lazımdır?<\/summary><div class=\"ans\">2<sup>n<\/sup> = 8 → n = 3 bit. Yeni prefix /27, hər subnet-də 2<sup>5<\/sup> − 2 = 30 host. Bloklar 32-lik addımla: .0, .32, .64, .96, .128, .160, .192, .224.<\/div><\/details>\n\n<h2 id=\"host-config\">Host-u düzgün konfiqurasiya etmək<\/h2>\n<p>Statik konfiqurasiyada hər host üçün üç dəyər yazılır: <b>IP ünvanı<\/b>, <b>subnet mask<\/b>, <b>default gateway<\/b>. Qayda: <b>gateway host ilə eyni subnet-də olmalıdır<\/b>. Niyə: host gateway-ə kadr göndərmək üçün onun MAC ünvanını ARP ilə soruşur, ARP isə yalnız eyni network daxilində işləyir.<\/p>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Səhv<\/th><th>Nəticə<\/th><\/tr>\n<tr><td>Mask səhv yazılıb (məs. /25 əvəzinə /24)<\/td><td>Host eyni network-də olmayan cihazları \"eyni network\" sayır və birbaşa göndərməyə çalışır (ARP
