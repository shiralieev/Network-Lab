<li><b>Flood:<\/b> Destination MAC cədvəldə yoxdur (unknown unicast) → gələn port istisna, bütün portlara.<\/li>\n<li><b>Broadcast<\/b> (FF:FF:FF:FF:FF:FF) həmişə flood olunur. Multicast default flood (IGMP snooping olmasa).<\/li>\n<li>Switch Source MAC-dən öyrənir, Destination MAC-dən yox. Broadcast MAC heç vaxt cədvələ düşmür.<\/li>\n<li><b>Aging:<\/b> default 300 saniyə istifadə olunmayan giriş silinir. MAC başqa portdan görünəndə giriş dərhal yenilənir.<\/li>\n<li>Bir portda çox MAC = arxada hub, başqa switch və ya access point var. Tək PC portunda yüzlərlə MAC anormaldır.<\/li>\n<li>Switch kadrı <b>dəyişmir<\/b> (MAC-lər, EtherType, heç bir sahə). Router isə hər link üçün yeni Ethernet başlığı qurur və TTL azaldır.<\/li>\n<li><b>Collision domain:<\/b> hub bütün portları bir domain edir. Switch-in hər portu ayrıdır. Full-duplex portda collision olmur.<\/li>\n<li><b>Broadcast domain:<\/b> switch bölmür (VLAN olmadan). Router hər interface-i ayrı domain edir.<\/li>\n<li>ARP cache = IP → MAC (host, router). MAC address table = MAC → port (switch). Fərqli cədvəllərdir.<\/li>\n<li>Troubleshooting: MAC cədvəldə yoxdur = switch ondan kadr görməyib (Layer 1). MAC düzgün portdadır, ping yoxdur = Layer 3 problemi.<\/li>\n<li><b>MAC flapping:<\/b> eyni MAC iki port arasında dəyişir. Loop və ya duplicate/saxta MAC.<\/li>\n<li><b>MAC flooding:<\/b> təsadüfi MAC-lərlə cədvəli doldurmaq. Switch bilinməyənləri flood edir, hücumçu dinləyir. Müdafiə: <b>port security<\/b> (4-cü hissə).<\/li>\n<\/ul><\/div>\n<h2>Bu mövzudakı əmrlər<\/h2>\n<table class=\"cmd-table\">\n<tr><td>show mac address-table<span class=\"where\">Cisco switch (PT 2960-da işləyir)<\/span><\/td><td>MAC cədvəlini göstərir. Köhnə IOS-da: <span class=\"m\">show mac-address-table<\/span>.<\/td><\/tr>\n<tr><td>show mac address-table dynamic<span class=\"where\">Cisco switch<\/span><\/td><td>Yalnız öyrənilmiş (DYNAMIC) girişləri göstərir.<\/td><\/tr>\n<tr><td>show mac address-table address &lt;mac&gt;<span class=\"where\">real IOS, PT-də yoxla<\/span><\/td><td>Bir MAC-in hansı portda olduğunu göstərir.<\/td><\/tr>\n<tr><td>show mac address-table interface fa0/1<span class=\"where\">real IOS, PT-də yoxla<\/span><\/td><td>Bir portun arxasındakı MAC-ləri göstərir.<\/td><\/tr>\n<tr><td>show mac address-table count<span class=\"where\">real IOS, PT-də yoxla<\/span><\/td><td>Cədvəldəki giriş sayını və tutumu göstərir.<\/td><\/tr>\n<tr><td>show mac address-table aging-time<span class=\"where\">real IOS, PT-də yoxla<\/span><\/td><td>Aging müddətini göstərir (default 300).<\/td><\/tr>\n<tr><td>clear mac address-table dynamic<span class=\"where\">privileged EXEC (enable)<\/span><\/td><td>Bütün dynamic girişləri silir. Switch yenidən öyrənir.<\/td><\/tr>\n<tr><td>mac address-table aging-time 600<span class=\"where\">global config, real IOS<\/span><\/td><td>Aging müddətini 600 saniyə edir.<\/td><\/tr>\n<\/table>\n<h2>Qərar cədvəli<\/h2>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Destination MAC<\/th><th>Cədvəldə<\/th><th>Qərar<\/th><\/tr>\n<tr><td>Unicast<\/td><td>Başqa portda<\/td><td><b>Forward<\/b> (yalnız o porta)<\/td><\/tr>\n<tr><td>Unicast<\/td><td>Gələn portda<\/td><td><b>Filter<\/b> (atır)<\/td><\/tr>\n<tr><td>Unicast<\/td><td>Yoxdur<\/td><td><b>Flood<\/b> (unknown unicast)<\/td><\/tr>\n<tr><td>Broadcast<\/td><td>Həmişə yox<\/td><td><b>Flood<\/b><\/td><\/tr><\/table><\/div>\n","p1/t07/explain":"<h2 id=\"why-switch\">Switch nə üçün lazımdır: hub ilə müqayisə<\/h2>\n<p>Cihazları bir-birinə qoşmaq üçün ilk cihaz <b>hub<\/b> idi. Hub <b>Layer 1<\/b> cihazıdır: bir portdan gələn siqnalı (bitləri) olduğu kimi <b>bütün digər portlara<\/b> təkrarlayır. O, kadrın başlığını oxumur, ona görə kadrın kimə getdiyini bilmir.<\/p>\n<p>Bundan iki problem çıxır:<\/p>\n<ul>\n<li><b>Trafik hamıya çatır.<\/b> PC-A PC-B-yə göndərəndə PC-C və PC-D də kadrı alır. Onların NIC-i Destination MAC öz MAC-i olmadığı üçün kadrı atır, amma siqnal kabeldə var. Bu cihazda dinləmə proqramı (məsələn Wireshark) işləyirsə, kadrı oxuya bilər.<\/li>\n<li><b>Collision.<\/b> Hub-ın bütün portları eyni mühiti paylaşır. İki cihaz eyni anda göndərsə, siqnallar toqquşur və hər iki kadr zədələnir. Cihazlar <b>CSMA/CD<\/b> qaydası ilə işləyir: göndərməzdən əvvəl kabeli dinlə, toqquşma olsa dayan, təsadüfi müddət gözlə və yenidən göndər. Cihaz sayı artdıqca toqquşma çoxalır və şəbəkə yavaşlayır.<\/li>\n<\/ul>\n<p><b>Switch<\/b> <b>Layer 2<\/b> cihazıdır. O, kadrı <b>oxuyur<\/b>: Destination MAC-ə baxır və kadrı yalnız lazım olan porta göndərir. Bunun üçün switch-in öz yaddaşı var: <b>MAC address table<\/b>.<\/p>\n<div class=\"figure\"><svg viewBox=\"0 0 760 260\" role=\"img\" aria-label=\"Hub kadrı bütün portlara təkrarlayır, switch yalnız hədəf porta göndərir\">\n<text x=\"185\" y=\"22\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Hub (Layer 1)<\/text>\n<text x=\"575\" y=\"22\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Switch (Layer 2)<\/text>\n<line x1=\"380\" y1=\"10\" x2=\"380\" y2=\"250\" class=\"ln\" style=\"opacity:.35\"/>\n<line x1=\"55\" y1=\"78\" x2=\"150\" y2=\"108\" class=\"ln\"/><line x1=\"315\" y1=\"78\" x2=\"220\" y2=\"108\" class=\"ln\"/><line x1=\"55\" y1=\"176\" x2=\"150\" y2=\"144\" class=\"ln\"/><line x1=\"315\" y1=\"176\" x2=\"220\" y2=\"144\" class=\"ln\"/>\n<rect x=\"135\" y=\"108\" width=\"100\" height=\"36\" rx=\"4\" class=\"fill-yel\"/><text x=\"185\" y=\"131\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\">Hub<\/text>\n<rect x=\"20\" y=\"44\" width=\"70\" height=\"34\" rx=\"4\" class=\"box-s\"/><text x=\"55\" y=\"66\" text-anchor=\"middle\" font-size=\"13\">PC-A<\/text>\n<rect x=\"280\" y=\"44\" width=\"70\" height=\"34\" rx=\"4\" class=\"fill-ok\"/><text x=\"315\" y=\"66\" text-anchor=\"middle\" font-size=\"13\">PC-B<\/text>\n<rect x=\"20\" y=\"176\" width=\"70\" height=\"34\" rx=\"4\" class=\"fill-bad\"/><text x=\"55\" y=\"198\" text-anchor=\"middle\" font-size=\"13\">PC-C<\/text>\n<rect x=\"280\" y=\"176\" width=\"70\" height=\"34\" rx=\"4\" class=\"fill-bad\"/><text x=\"315\" y=\"198\" text-anchor=\"middle\" font-size=\"13\">PC-D<\/text>\n<text x=\"55\" y=\"38\" text-anchor=\"middle\" font-size=\"12\">B-yə göndərir<\/text><text x=\"315\" y=\"38\" text-anchor=\"middle\" font-size=\"12\">qəbul edir<\/text>\n<text x=\"55\" y=\"228\" text-anchor=\"middle\" font-size=\"12\">alır, NIC atır<\/text><text x=\"315\" y=\"228\" text-anchor=\"middle\" font-size=\"12\">alır, NIC atır<\/text>\n<line x1=\"445\" y1=\"78\" x2=\"540\" y2=\"108\" class=\"ln\"/><line x1=\"705\" y1=\"78\" x2=\"610\" y2=\"108\" class=\"ln\"/><line x1=\"445\" y1=\"176\" x2=\"540\" y2=\"144\" class=\"ln\"/><line x1=\"705\" y1=\"176\" x2=\"610\" y2=\"144\" class=\"ln\"/>\n<rect x=\"525\" y=\"108\" width=\"100\" height=\"36\" rx=\"4\" class=\"fill-blue\"/><text x=\"575\" y=\"131\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\">Switch<\/text>\n<rect x=\"410\" y=\"44\" width=\"70\" height=\"34\" rx=\"4\" class=\"box-s\"/><text x=\"445\" y=\"66\" text-anchor=\"middle\" font-size=\"13\">PC-A<\/text>\n<rect x=\"670\" y=\"44\" width=\"70\" height=\"34\" rx=\"4\" class=\"fill-ok\"/><text x=\"705\" y=\"66\" text-anchor=\"middle\" font-size=\"13\">PC-B<\/text>\n<rect x=\"410\" y=\"176\" width=\"70\" height=\"34\" rx=\"4\" class=\"box-s\"/><text x=\"445\" y=\"198\" text-anchor=\"middle\" font-size=\"13\">PC-C<\/text>\n<rect x=\"670\" y=\"176\" width=\"70\" height=\"34\" rx=\"4\" class=\"box-s\"/><text x=\"705\" y=\"198\" text-anchor=\"middle\" font-size=\"13\">PC-D<\/text>\n<text x=\"445\" y=\"38\" text-anchor=\"middle\" font-size=\"12\">B-yə göndərir<\/text><text x=\"705\" y=\"38\" text-anchor=\"middle\" font-size=\"12\">qəbul edir<\/text>\n<text x=\"445\" y=\"228\" text-anchor=\"middle\" font-size=\"12\">heç nə görmür<\/text><text x=\"705\" y=\"228\" text-anchor=\"middle\" font-size=\"12\">heç nə görmür<\/text>\n<\/svg><div class=\"fig-cap\">PC-A-dan PC-B-yə bir kadr. Hub onu hamıya təkrarlayır, switch yalnız PC-B-nin olduğu porta göndərir.<\/div><\/div>\n<details class=\"box box-think\"><summary>Dayan və düşün: hub-da PC-C kadrı \"atır\". Bu niyə hələ də təhlükəsizlik problemidir?<\/summary><div class=\"ans\">NIC kadrı atır, çünki Destination MAC onun MAC-i deyil. Amma siqnal onun kabelinə çatıb. NIC-i \"hamısını qəbul et\" rejiminə keçirən (promiscuous mode) proqram bütün kadrları oxuya bilər. Yəni hub-da hər cihaz başqalarının trafikini görə bilər. Switch-də isə unicast kadr yalnız hədəf portuna gedir.<\/div><\/details>\n\n<h2 id=\"table\">MAC address table<\/h2>\n<p>Switch-in yaddaşı sadə bir cədvəldir: <b>MAC ünvanı → port<\/b>. Cədvələ <b>CAM table<\/b> də deyilir. Bu cədvəli heç kim əllə doldurmur, switch özü öyrənir.<\/p>\n<pre class=\"pre\"><span class=\"p\">Switch#<\/span>show mac address-table\n          Mac Address Table\n-------------------------------------------\n\nVlan    Mac Address       Type        Ports\n----    -----------       --------    -----\n   1    0001.4321.aaaa    DYNAMIC     Fa0/1\n   1    0001.4321.bbbb    DYNAMIC     Fa0/2\nTotal Mac Addresses for this criterion: 2<\/pre>\n<p>Hər sətirdə dörd məlumat var:<\/p>\n<ul>\n<li><b>Vlan<\/b>: MAC hansı VLAN-da öyrənilib. Hələlik hər şey VLAN 1-dədir. VLAN-ları 3-cü hissədə görəcəksən.<\/li>\n<li><b>Mac Address<\/b>: cihazın MAC ünvanı. Cisco cihazları onu <span class=\"m\">0001.4321.aaaa<\/span> formatında göstərir.<\/li>\n<li><b>Type<\/b>: <span class=\"m\">DYNAMIC<\/span> switch-in öyrəndiyi giriş (müəyyən müddətdən sonra silinir), <span class=\"m\">STATIC<\/span> əllə yazılmış giriş.<\/li>\n<li><b>Ports<\/b>: bu MAC-in <b>arxasında olduğu<\/b> port. \"Arxasında\" sözü vacibdir: bir port bir cihaza qoşulu ola bilər, amma başqa switch-ə və ya hub-a qoşulubsa, onun arxasında çox MAC ola bilər.<\/li>\n<\/ul>\n<p>İndiyə qədər üç cədvəl tanıdın. Onları qarışdırma:<\/p>\n<ul>\n<li><b>ARP cache<\/b> (host, router): <b>IP → MAC<\/b>. \"Bu IP-nin MAC-i nədir?\"<\/li>\n<li><b>MAC address table<\/b> (switch): <b>MAC → port<\/b>. \"Bu MAC hansı porta getməlidir?\"<\/li>\n<li><b>Routing table<\/b> (router, 3-cü hissədə): <b>şəbəkə → növbəti hop<\/b>.<\/li>\n<\/ul>\n\n<h2 id=\"actions\">Dörd qərar: learn, forward, flood, filter<\/h2>\n<p><b>Qayda:<\/b> switch-ə hər kadr gələndə iki iş görür və <b>bu sıra ilə<\/b>:<\/p>\n<ol>\n<li><b>Learn (öyrənmək).<\/b> Kadrın <b>Source MAC<\/b>-inə baxır və yazır: \"bu MAC kadrın gəldiyi portun arxasındadır\". Giriş yoxdursa əlavə edir, varsa yalnız aging sayğacını yeniləyir, başqa portda yazılıbsa portu dəyişir.<\/li>\n<li><b>Qərar.<\/b> Kadrın <b>Destination MAC<\/b>-ini cədvəldə axtarır və dörd nəticədən biri olur.<\/li>\n<\/ol>\n<ul>\n<li><b>Forward:<\/b> Destination MAC cədvəldə <b>başqa<\/b> portdadır. Kadr yalnız o porta göndərilir.<\/li>\n<li><b>Filter:<\/b> Destination MAC cədvəldə kadrın gəldiyi portun <b>özündədir<\/b>. Hədəf göndərənlə eyni seqmentdədir və artıq kadrı alıb. Switch kadrı atır.<\/li>\n<li><b>Flood:<\/b> Destination MAC cədvəldə <b>yoxdur<\/b> (unknown unicast). Switch hara göndərəcəyini bilmir, ona görə kadrı gələn port istisna olmaqla <b>VLAN-dakı bütün portlara<\/b> göndərir.<\/li>\n<li><b>Flood (broadcast):<\/b> Destination <span class=\"m\">FF:FF:FF:FF:FF:FF<\/span>. Bu ünvan heç vaxt cədvəldə olmur, kadr həmişə flood olunur. Multicast da default olaraq flood olunur (dördüncü mövzuda IGMP snooping ilə bunu gördün).<\/li>\n<\/ul>\n<p><b>Niyə Source MAC-dən öyrənir, Destination MAC-dən yox?<\/b> Source MAC-i switch əmin şəkildə bilir: kadr elə bu portdan gəldi, deməli bu MAC bu portun arxasındadır. Destination MAC isə hara getdiyini deyir, harada olduğunu yox. Eyni səbəbdən broadcast ünvan heç vaxt cədvələ düşmür: cihaz Source MAC kimi <span class=\"m\">FF:FF:FF:FF:FF:FF<\/span> göndərmir.<\/p>\n<p><b>Niyə bilinməyənə flood edir?<\/b> Switch-in başqa seçimi yoxdur: kadrı atsa, ilk kadr heç vaxt çatmazdı. Flood çatmağı təmin edir. Hədəf cavab verəndə switch onun Source MAC-ini öyrənir və sonrakı kadrlar artıq flood olunmur.<\/p>\n<p>Simulyatorda yoxla. Hər dəfə \"Göndər\" basanda switch-in qərarını əvvəl təxmin et:<\/p>\n<ol>\n<li>Cədvəl boşdur. PC-A-dan PC-B-yə göndər. Qərar nə olacaq, cədvəldə neçə giriş yaranacaq?<\/li>\n<li>İndi PC-B-dən PC-A-ya göndər. Bu dəfə qərar nədir?<\/li>\n<li>PC-A-dan \"Bilinməyən MAC\"-a göndər. Niyə flood olunur?<\/li>\n<li>\"Broadcast\" seç. Cədvəldə yeni giriş yaranırmı?<\/li>\n<li>Hub qutusunu işarələ, PC-C ilə PC-D-ni eyni porta qoş. PC-C-dən PC-D-yə göndər. <b>Filter<\/b> qərarını tapmağa çalış.<\/li>\n<\/ol>\n<div data-sim=\"switchsim\"><\/div>\n\n<h2 id=\"walkthrough\">İlk ping zamanı switch-in işi<\/h2>\n<p>İndi beşinci və altıncı mövzunu switch tərəfindən birləşdir. PC-A (Fa0/1) ilk dəfə PC-B-yə (Fa0/2) ping atır. Cədvəl boşdur. Switch-də dörd port var: A, B, C, D.<\/p>\n<pre class=\"pre\">1. A → hamıya   ARP request (Dst FF:FF:FF:FF:FF:FF)\n   Switch: learn A = Fa0/1.  Broadcast → flood: Fa0/2, Fa0/3, Fa0/4\n   Cədvəl: A→Fa0/1\n\n2. B → A        ARP reply (unicast, Dst = A-nın MAC-i)\n   Switch: learn B = Fa0/2.  Dst A cədvəldə Fa0/1 → forward yalnız Fa0/1\n   Cədvəl: A→Fa0/1, B→Fa0/2\n\n3. A → B        ICMP echo request (Dst = B-nin MAC-i)\n   Switch: Dst B cədvəldə Fa0/2 → forward yalnız Fa0/2\n\n4. B → A        ICMP echo reply\n   Switch: Dst A cədvəldə Fa0/1 → forward yalnız Fa0/1<\/pre>\n<p>Müşahidə: PC-C və PC-D yalnız <b>birinci<\/b> kadrı (ARP request broadcast) aldılar. Sonrakı üç kadr onlara çatmadı. Yəni switch-in cədvəli doldukca trafik yalnız iştirakçılara qalır.<\/p>\n<div class=\"box box-pt\"><h4>Packet Tracer-i artıq tanıyırsansa<\/h4><p>Packet Tracer-də iki PC və switch qur. Switch CLI-da ping-dən əvvəl <span class=\"m\">show mac address-table<\/span> yaz, sonra PC-dən ping at və əmri təkrarla. Cədvəlin necə dolduğunu görəcəksən. Packet Tracer-i hələ öyrənməmisənsə, bunu 8-ci mövzudan sonra et: bu mövzunun labı Packet Tracer tələb etmir.<\/p><\/div>\n<details class=\"box box-think\"><summary>Dayan və düşün: A-nın ARP cache-ində B var, amma switch-də B-nin girişi aging səbəbindən silinib. A ping atır. Nə baş verir?<\/summary><div class=\"ans\">A-nın ARP cache-i hələ B-nin MAC-ini saxlayır, ona görə A yeni ARP göndərmir və kadrı birbaşa B-nin MAC-i ilə qurur. Switch bu Destination MAC-i cədvəldə tapmır (unknown unicast) və kadrı <b>flood<\/b> edir. B kadrı alır və cavab verir, switch B-ni yenidən öyrənir. Ping işləyir, sadəcə bir kadr hamıya getdi. Real şəbəkədə bu tez-tez baş verir: switch cədvəli çox vaxt 300 saniyədən sonra silir, host-un ARP cache-i isə bundan uzun yaşaya bilər.<\/div><\/details>\n\n<h2 id=\"aging\">Aging, köçürülən MAC və bir portda çox MAC<\/h2>\n<p><b>Aging.<\/b> Switch öyrəndiyi hər girişə sayğac qoyur. MAC-dən hər yeni kadr gələndə sayğac sıfırlanır. Cihaz susanda sayğac artır və <b>300 saniyə<\/b> (Catalyst switch-lərdə default) istifadə olunmayan giriş silinir.<\/p>\n<p><b>Niyə silinir?<\/b> Cədvəl məhdud yaddaşdır (model asılı olaraq bir neçə min giriş). Üstəlik cihazlar söndürülür və ya köçürülür. Köhnə giriş saxlansaydı, trafik artıq orada olmayan cihazın portuna gedərdi.<\/p>\n<p><b>Köçürülən MAC.<\/b> Cihaz Fa0/1-dən çıxarılıb Fa0/5-ə taxılır. Növbəti kadr Fa0/5-dən gələndə switch eyni MAC-i yeni portda görür və girişi <b>dərhal<\/b> yeniləyir. Aging-i gözləməz. Bu rahatlıqdır, amma həm də zəiflikdir: kimsə başqasının MAC-ini Source MAC kimi yazsa (MAC spoofing), switch o MAC-in trafikini hücumçunun portuna yönəldə bilər. Switch kimin hansı MAC-ə sahib olduğunu yoxlamır.<\/p>\n<p><b>Bir portda çox MAC.<\/b> Adi access port bir cihaza qoşulur və cədvəldə bir MAC görürsən. Əgər bir portda çox MAC varsa, onun arxasında hub, başqa switch və ya Wi-Fi access point var. Bu normal ola bilər (uplink portu hamının MAC-ini öyrənir), amma tək PC portunda yüzlərlə MAC anormaldır.<\/p>\n\n<h2 id=\"domains\">Collision domain və broadcast domain<\/h2>\n<p>Dördüncü mövzuda broadcast domain-i gördün. İndi onunla bərabər <b>collision domain<\/b> anlayışı lazımdır. Bunlar iki ayrı sualdır:<\/p>\n<ul>\n<li><b>Collision domain:<\/b> eyni mühiti paylaşan və eyni anda göndərəndə toqquşa bilən cihazlar. Sual: \"kim kiminlə toqquşa bilər?\"<\/li>\n<li><b>Broadcast domain:<\/b> bir broadcast-ı alan cihazlar. Sual: \"broadcast kimə çatır?\"<\/li>\n<\/ul>\n<div class=\"tbl-wrap\"><table class=\"tbl\"><tr><th>Cihaz<\/th><th>Collision domain<\/th><th>Broadcast domain<\/th><\/tr>\n<tr><td>Hub<\/td><td>Bütün portlar <b>bir<\/b> collision domain-dir<\/td><td>Bütün portlar bir broadcast domain-dir<\/td><\/tr>\n<tr><td>Switch<\/td><td>Hər port <b>ayrı<\/b> collision domain-dir<\/td><td>Bütün portlar (eyni VLAN-da) <b>bir<\/b> broadcast domain-dir<\/td><\/tr>\n<tr><td>Router<\/td><td>Hər interface ayrı collision domain-dir<\/td><td>Hər interface <b>ayrı<\/b> broadcast domain-dir<\/td><\/tr><\/table><\/div>\n<div class=\"figure\"><svg viewBox=\"0 0 760 300\" role=\"img\" aria-label=\"İki broadcast domain və switch portlarına, hub seqmentinə görə collision domain-lər\">\n<rect x=\"10\" y=\"20\" width=\"340\" height=\"270\" rx=\"8\" class=\"fill-blue\"/><text x=\"180\" y=\"42\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Broadcast domain 1<\/text>\n<rect x=\"470\" y=\"20\" width=\"280\" height=\"270\" rx=\"8\" class=\"fill-ok\"/><text x=\"610\" y=\"42\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Broadcast domain 2<\/text>\n<line x1=\"160\" y1=\"122\" x2=\"60\" y2=\"190\" class=\"ln\"/><line x1=\"180\" y1=\"122\" x2=\"135\" y2=\"190\" class=\"ln\"/><line x1=\"205\" y1=\"122\" x2=\"245\" y2=\"176\" class=\"ln\"/>\n<line x1=\"240\" y1=\"106\" x2=\"374\" y2=\"110\" class=\"ln\"/><line x1=\"446\" y1=\"110\" x2=\"540\" y2=\"106\" class=\"ln\"/>\n<line x1=\"560\" y1=\"122\" x2=\"530\" y2=\"190\" class=\"ln\"/><line x1=\"620\" y1=\"122\" x2=\"630\" y2=\"190\" class=\"ln\"/>\n<rect x=\"140\" y=\"90\" width=\"100\" height=\"32\" rx=\"4\" class=\"box-s\"/><text x=\"190\" y=\"111\" text-anchor=\"middle\" font-size=\"13\">Switch 1<\/text>\n<circle cx=\"410\" cy=\"110\" r=\"36\" class=\"fill-yel\"/><text x=\"410\" y=\"114\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\">Router<\/text>\n<rect x=\"540\" y=\"90\" width=\"100\" height=\"32\" rx=\"4\" class=\"box-s\"/><text x=\"590\" y=\"111\" text-anchor=\"middle\" font-size=\"13\">Switch 2<\/text>\n<rect x=\"30\" y=\"190\" width=\"60\" height=\"30\" rx=\"4\" class=\"box-s\"/><text x=\"60\" y=\"210\" text-anchor=\"middle\" font-size=\"13\">PC1<\/text>\n<rect x=\"105\" y=\"190\" width=\"60\" height=\"30\" rx=\"4\" class=\"box-s\"/><text x=\"135\" y=\"210\" text-anchor=\"middle\" font-size=\"13\">PC2<\/text>\n<rect x=\"500\" y=\"190\" width=\"60\" height=\"30\" rx=\"4\" class=\"box-s\"/><text x=\"530\" y=\"210\" text-anchor=\"middle\" font-size=\"13\">PC5<\/text>\n<rect x=\"600\" y=\"190\" width=\"60\" height=\"30\" rx=\"4\" class=\"box-s\"/><text x=\"630\" y=\"210\" text-anchor=\"middle\" font-size=\"13\">PC6<\/text>\n<rect x=\"180\" y=\"170\" width=\"130\" height=\"112\" rx=\"6\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/>\n<rect x=\"215\" y=\"176\" width=\"60\" height=\"26\" rx=\"4\" class=\"fill-yel\"/><text x=\"245\" y=\"194\" text-anchor=\"middle\" font-size=\"13\">Hub<\/text>\n<line x1=\"245\" y1=\"202\" x2=\"215\" y2=\"240\" class=\"ln\"/><line x1=\"245\" y1=\"202\" x2=\"285\" y2=\"240\" class=\"ln\"/>\n<rect x=\"190\" y=\"240\" width=\"50\" height=\"28\" rx=\"4\" class=\"box-s\"/><text x=\"215\" y=\"259\" text-anchor=\"middle\" font-size=\"13\">PC3<\/text>\n<rect x=\"260\" y=\"240\" width=\"50\" height=\"28\" rx=\"4\" class=\"box-s\"/><text x=\"285\" y=\"259\" text-anchor=\"middle\" font-size=\"13\">PC4<\/text>\n<text x=\"24\" y=\"252\" font-size=\"11\" class=\"t-dim\">kəsik xətt: hub seqmenti,<\/text><text x=\"24\" y=\"266\" font-size=\"11\" class=\"t-dim\">tək collision domain<\/text>\n<\/svg><div class=\"fig-cap\">Router iki broadcast domain yaradır. Switch-in hər portu ayrı collision domain-dir. Hub-ın arxasındakı cihazlar (kəsik xətt) switch portu ilə birlikdə bir collision domain-dir.<\/div><\/div>\n<p>Müasir şəbəkələrdə hər cihaz switch portuna ayrıca qoşulur və link <b>full-duplex<\/b> işləyir: eyni anda həm göndərə, həm qəbul edə bilir. Bu rejimdə toqquşma <b>olmur<\/b> və CSMA/CD lazım olmur. Hub artıq real şəbəkələrdə istifadə olunmur, amma collision domain anlayışı switch-in davranışını başa düşmək üçün vacibdir.<\/p>\n<details class=\"box box-think\"><summary>Dayan və düşün: yuxarıdakı şəkildə neçə collision domain və neçə broadcast domain var?<\/summary><div class=\"ans\"><b>2 broadcast domain<\/b> (router ayırır). <b>7 collision domain<\/b>: (1) Switch 1 – PC1, (2) Switch 1 – PC2, (3) hub seqmenti (Switch 1 – Hub – PC3 – PC4 hamısı birlikdə), (4) Switch 1 – Router, (5) Router – Switch 2, (6) Switch 2 – PC5, (7) Switch 2 – PC6. Hub-ın arxasındakı iki PC ayrıca sayılmır, çünki onlar hub ilə birlikdə eyni mühiti paylaşır.<\/div><\/details>\n<p>Switch kadrı <b>dəyişmir<\/b>. O, kadrın Source və Destination MAC-ini, EtherType-ı, heç bir sahəsini dəyişmir və IP başlığına baxmır. Router isə ötürəndə hər link üçün yeni Ethernet başlığı qurur və TTL-i azaldır (üçüncü mövzuda gördün). Buna görə switch cihazının IP ünvanı olmadan da kadrları ötürür. IP yalnız onu uzaqdan idarə etmək üçün lazımdır.<\/p>\n\n<h2 id=\"trouble\">Troubleshooting: cədvəl nə deyir<\/h2>\n<p>MAC address table həm də <b>sübut mənbəyidir<\/b>: switch hansı cihazı hansı portda gördüyünü yazır. \"PC-A PC-B-yə ping edə bilmir\" şikayətində cədvələ baxmaq sualı bölür:<\/p>\n<ul>\n<li><b>PC-A-nın MAC-i cədvəldə yoxdur.<\/b> Switch ondan heç bir kadr görməyib. Səbəb Layer 1-dədir: kabel, port <span class=\"m\">shutdown<\/span>, NIC söndürülüb.<\/li>\n<li><b>MAC cədvəldədir, amma gözlənilməyən portdadır.<\/b> Kabel başqa porta taxılıb və ya cihaz başqa switch-in arxasındadır.<\/li>\n<li><b>Hər iki MAC düzgün portlarda var, ping yenə də işləmir.<\/b> Switch öz işini görür. Problem Layer 3-dədir: səhv IP, mask, VLAN və ya host firewall-u.<\/li>\n<\/ul>\n<p>Hansı portda olduğunu tapmaq üçün: <span class=\"m\">show mac address-table address 0001.4321.aaaa<\/span> (real IOS-da; Packet Tracer-də eyni əmrin işlədiyini yoxla). Eyni cədvəl SOC üçün də faydalıdır: cihazın IP-si ARP ilə MAC-ə, MAC isə bu cədvəllə switch portuna çevrilir. Yəni \"şübhəli IP hansı fiziki porta qoşulub?\" sualının cavabı budur.<\/p>\n<h3 id=\"mac-flap\">MAC flapping<\/h3>\n<p>Eyni MAC cədvəldə iki port arasında sürətlə dəyişirsə, buna <b>MAC flapping<\/b> deyilir. Cisco IOS belə log yazır: <span class=\"m\">%SW_MATM-4-MACFLAP_NOTIF: Host 0001.4321.aaaa in vlan 1 is flapping between port Fa0/1 and port Fa0/2<\/span>. Səbəb: ya <b>loop<\/b> (kadr kabellərlə dövrə vurub başqa porta qayıdır), ya eyni MAC iki yerdə (duplicate və ya MAC spoofing). Loop-ları STP ilə 5-ci hissədə həll edəcəksən.<\/p>\n\n<h2 id=\"attack-flood\">MAC flooding: hücum və müdafiə<\/h2>\n<div class=\"box box-attack\"><h4>MAC flooding (CAM table overflow)<\/h4>\n<p><b>Problem:<\/b> switch hər yeni Source MAC-i avtomatik öyrənir və öyrənmə heç kimin icazəsini tələb etmir. Cədvəlin ölçüsü isə məhduddur.<\/p>\n<div class=\"attack-cols\">\n<div class=\"atk\"><h5>Hücum necə işləyir<\/h5><p>Switch portuna qoşulan hücumçu qısa müddətdə çox sayda <b>təsadüfi Source MAC<\/b> ilə kadr göndərir. Switch hər birini öyrənib cədvələ yazır və cədvəl dolur. Cədvəl dolu olanda yeni MAC-ləri öyrənə bilmir. Real istifadəçilərin MAC-i cədvəldə olmadığı üçün onların kadrları <b>unknown unicast<\/b> kimi flood olunur. Switch bu VLAN-da hub kimi davranır və hücumçu başqalarının trafikini görür.<\/p><\/div>\n<div class=\"def\"><h5>Necə aşkar edirsən<\/h5><p>Tək cihaz portunda qısa müddətdə minlərlə yeni MAC. <span class=\"m\">show mac address-table count<\/span> cədvəlin tutumuna yaxınlaşdığını göstərir. MAC-lər təsadüfi görünür (tanınan istehsalçı prefiksləri yoxdur). Switch-in CPU yükü artır, şəbəkə yavaşlayır.<\/p><\/div>\n<\/div>\n<div class=\"attack-cols\">\n<div class=\"atk\"><h5>Nəticə<\/h5><p>Eyni VLAN-dakı unicast trafikin dinlənilməsi (şifrəsiz protokollarda parollar, sessiyalar). Hücum üçün hücumçunun switch portuna fiziki və ya ələ keçirilmiş cihaz vasitəsilə çıxışı lazımdır. Başqa VLAN-ların trafiki bu yolla görünmür.<\/p><\/div>\n<div class=\"def\"><h5>Müdafiə<\/h5><p><b>Port security<\/b>: hər portda öyrənilə bilən MAC sayını məhdudlaşdırmaq (məsələn 2) və limit aşılanda portu söndürmək və ya kadrları atmaq (4-cü hissədə öyrənəcəksən). Əlavə: istifadə olunmayan portları söndürmək, şübhəli cihazı log ilə tapıb portu izolə etmək.<\/p><\/div>\n<\/div><\/div>\n<p>Bu hücumun niyə işlədiyini artıq bilirsən: switch öyrənməni Source MAC-ə əsasən edir və yoxlama etmir. Cədvəl dolanda isə switch-in başqa çıxış yolu yoxdur: bilinməyənə flood. Müdafiə də məhz öyrənməni məhdudlaşdırır.<\/p>\n"};
;

            { label: 'Bu birinci kadrın qərarı (flood / forward / filter)', placeholder: 'qərar', answers: ['flood'], wrong: 'Destination MAC (PC-B) cədvəldə var idi?' },
            { label: 'PC-B → PC-A kadrının qərarı', placeholder: 'qərar', answers: ['forward'], wrong: 'Bu anda PC-A-nın MAC-i cədvəldədir. Hansı portdadır?' },
            { label: 'İkinci kadrdan sonra cədvəldə neçə giriş var?', placeholder: 'rəqəm', check: r => r.trim() === '2', wrong: 'İndi PC-B-nin MAC-i də öyrənilib.' },
          ],
          hints: ['Qaydanı xatırla: əvvəl Source MAC öyrənilir, sonra Destination MAC cədvəldə axtarılır.'],
          solution: 'İlk kadr: Source A öyrənilir (1 giriş), Destination B cədvəldə yoxdur, flood. İkinci kadr: Source B öyrənilir (2 giriş), Destination A cədvəldə Fa0/1 portundadır, forward.' },

        { id: 's4', title: 'Kağız üzərində: beş kadr', type: 'form',
          body: '<p>Switch-in dörd portu var: PC-A <span class="m">Fa0/1</span>, PC-B <span class="m">Fa0/2</span>, PC-C <span class="m">Fa0/3</span>, PC-D <span class="m">Fa0/4</span>. Cədvəl <b>boşdur</b>. Beş kadr ardıcıllıqla gəlir. Hər kadr üçün qərarı yaz (flood, forward və ya filter).</p><pre class="pre">1.  A → B   (A Fa0/1 portundan)\n2.  B → A\n3.  C → A\n4.  A → D   (D hələ heç vaxt göndərməyib)\n5.  D → C</pre>',
          fields: [
            { label: '1-ci kadr', placeholder: 'qərar', answers: ['flood'], wrong: 'Cədvəl boşdur: B-nin yeri məlum deyil.' },

            { label: '5-ci kadr (D → C)', placeholder: 'qərar', answers: ['forward'], wrong: 'C cədvəldədir (3-cü kadr). Hansı portda?' },
          ],
          hints: ['Hər kadr üçün iki sual ver: (1) Source MAC cədvəldədirmi, yoxsa yeni yazılır? (2) Destination MAC cədvəldə varmı və hansı portdadır?'],
          solution: '1: flood (cədvəl boş). 2: forward (A cədvəldədir). 3: forward (A Fa0/1). 4: flood (D bilinmir). 4-cü kadrdan sonra giriş sayı 3 (A, B, C). 5: forward (C Fa0/3).',
          after: '<p>Cədvəl yalnız <b>göndərənlərdən</b> öyrənir. D yalnız 5-ci kadrda göndərəndə öyrənilir.</p>' },

        { id: 's5', title: 'Praktika switch-i: cədvəl necə dolur', type: 'terminal',
          body: '<p>Sağda switch-in vəziyyəti görünür. Aşağıdakı düymələr PC-lərin kadr göndərməsini simulyasiya edir.</p><ol><li>Üç düyməni bas: PC-A, PC-B və PC-C kadr göndərsin.</li><li><span class="m">show mac address-table</span> yaz və cədvəli oxu.</li><li><span class="m">enable</span> yaz, sonra <span class="m">clear mac address-table dynamic</span>.</li><li>Cədvələ yenidən bax.</li></ol>',
          term: { kind: 'switch', hostname: 'SW1', title: 'SW1', ports: ['Fa0/1', 'Fa0/2', 'Fa0/3', 'Fa0/4'], cables: { 'Fa0/1': 'PC-A', 'Fa0/2': 'PC-B', 'Fa0/3': 'PC-C', 'Fa0/4': 'PC-D' }, macPanel: true,

            ],
            goals: [
              { text: 'PC-A, PC-B və PC-C düymələrini bas', test: d => new Set(d.act || []).size >= 3 },
              { text: '<span class="m">show mac address-table</span> işlət', test: d => d.history.some(l => shRe.test(l)) },
              { text: '<span class="m">enable</span> yaz, sonra <span class="m">clear mac address-table dynamic</span> işlət', test: d => d.history.some(l => clRe.test(l)) },
              { text: 'Silindikdən sonra <span class="m">show mac address-table</span> yenidən işlət', test: d => { const i = d.history.findIndex(l => clRe.test(l)); return i >= 0 && d.history.slice(i + 1).some(l => shRe.test(l)); } },

          after: '<p>Müşahidə: hər düymədən sonra cədvəldə bir giriş əlavə olundu. <span class="m">clear</span> hamısını sildi. Bu, aging-in (300 saniyə) etdiyi işin sürətli versiyasıdır: switch hər şeyi yenidən öyrənəcək. Silmək heç bir cihazı pozmur.</p>' },

        { id: 's6', title: 'Cədvəli oxu: Fa0/2-də üç MAC', type: 'choice',
          body: '<p>Switch-də:</p><pre class="pre"><span class="p">SW1#</span>show mac address-table\nVlan    Mac Address       Type        Ports\n----    -----------       --------    -----\n   1    0001.4321.aaaa    DYNAMIC     Fa0/1\n   1    0001.4321.bbbb    DYNAMIC     Fa0/2\n   1    0001.4321.cccc    DYNAMIC     Fa0/2\n   1    0001.4321.dddd    DYNAMIC     Fa0/2\n   1    0001.4321.eeee    DYNAMIC     Fa0/3</pre><p>Fa0/2 portunda üç fərqli MAC var. Bu nə deməkdir?</p>',
          options: [
            { t: 'Fa0/2-nin arxasında hub, başqa switch və ya access point var, cihazlar oradadır.', ok: true, why: 'Cədvəl "MAC → port (arxasında olan)" saxlayır. Bir portda çox MAC varsa, onun arxasında bir neçə cihaz var, yəni port hub-a, başqa switch-ə və ya access point-ə gedir. Bu normal topologiyadır.' },
            { t: 'Üç MAC mütləq MAC flooding hücumudur, port yoxlanmadan dərhal söndürülməlidir.', why: 'Üç MAC hücum əlaməti deyil. Hücumda qısa müddətdə minlərlə təsadüfi MAC görünür. Bir portda bir neçə MAC hub, switch və ya access point-in arxasında normaldır.' },
            { t: 'Switch səhv edib və eyni MAC-i üç dəfə cədvələ yazıb, cədvəl yenilənməlidir.', why: 'MAC-lər fərqlidir (bbbb, cccc, dddd). Cədvəldə hər MAC bir dəfə yazılır, bunlar üç ayrı cihazdır.' },
            { t: 'Fa0/2 üç VLAN-ın üzvüdür, ona görə hər VLAN üçün cədvəldə ayrıca MAC yazılıb.', why: 'Vlan sütununa bax: hamısı 1-dir. Üç fərqli VLAN olsaydı, bu sütun fərqli olardı. Burada bir VLAN və üç MAC var.' },
          ],
          hints: ['Cədvəl hər MAC üçün nəyi göstərir: cihazın özünü, yoxsa arxasında olduğu portu?'],

        { id: 's7', title: 'Ticket 1: ping işləyir, amma niyə hamıya getdi?', type: 'choice',
          body: '<p>PC-A-nın ARP cache-ində PC-B (192.168.1.20) var. Switch-də isə PC-B-nin MAC-i artıq yoxdur: 300 saniyə susduğu üçün aging onu silib. PC-A ping göndərir. Nə baş verəcək?</p>',
          options: [
            { t: 'İlk kadr flood olunur, B cavab verir, switch onu yenidən öyrənir.', ok: true, why: 'PC-A-nın ARP cache-i hələ B-nin MAC-ini bilir, ona görə yeni ARP yoxdur və kadr birbaşa B-nin MAC-i ilə qurulur. Switch bu Destination MAC-i tapmır (unknown unicast) və flood edir. B cavab verəndə switch onu öyrənir.' },
            { t: 'Ping uğursuz olur, çünki switch B-ni tanımır və kadrı atır, ARP də kömək etmir.', why: 'Switch bilinməyən unicast kadrı atmır, flood edir. Atsaydı, hər aging-dən sonra ilk ping uğursuz olardı və şəbəkə bu yolla işləməzdi.' },
            { t: 'PC-A yeni ARP göndərməli olur, çünki switch ARP cache-i də silir və bunu bildirir.', why: 'ARP cache host-dadır, switch ona toxunmur. Switch yalnız öz MAC cədvəlini silir. İki ayrı cədvəldir.' },
            { t: 'Switch kadrı atır və PC-A-ya ICMP Destination Unreachable mesajı göndərir.', why: 'Switch Layer 2 cihazıdır, ICMP mesajı yaratmır. ICMP Unreachable göndərən router-lərdir.' },
          ],
          hints: ['Switch-in cədvəlində Destination MAC yoxdur. Dörd qərardan hansı bu hala uyğundur?'],
          after: '<p>Bu real şəbəkədə tez-tez baş verir və adətən heç kim hiss etmir: bir kadr hamıya gedir, sonra hər şey yenə unicast olur.</p>' },

        { id: 's8', title: 'Ticket 2: filter nə vaxt?', type: 'choice',
          body: '<p>PC-C və PC-D bir hub-ın arxasındadır. Hub switch-in <span class="m">Fa0/3</span> portuna qoşulub. Cədvəldə C və D hər ikisi Fa0/3 portundadır. PC-C PC-D-yə kadr göndərir və kadr Fa0/3 portundan switch-ə gəlir. Switch nə edir?</p>',
          options: [
            { t: 'Filter: kadrı atır, çünki D artıq hub vasitəsilə kadrı alıb.', ok: true, why: 'Destination MAC cədvəldə kadrın gəldiyi portdadır (Fa0/3). C və D eyni seqmentdədir və hub kadrı D-yə özü çatdırıb. Switch kadrı başqa yerə ötürmür, atır.' },
            { t: 'Forward: kadrı yenidən Fa0/3 portuna qaytarır ki, D kadrı alsın.', why: 'Switch kadrı heç vaxt gələn portdan geri göndərmir. Üstəlik D kadrı artıq alıb, təkrar göndərmək lazım deyil.' },
            { t: 'Flood: kadrı bütün digər portlara göndərir, çünki hub-dan gəlir.', why: 'Flood yalnız Destination MAC cədvəldə olmayanda (və ya broadcast olanda) baş verir. D cədvəldə var və yeri məlumdur.' },
            { t: 'Kadrı Fa0/1 və Fa0/2 portlarına göndərir ki, hədəfi tapsın.', why: 'Hədəfin yeri məlumdur və Fa0/1, Fa0/2-də deyil. Switch yalnız lazım olan yerə göndərir, bu halda heç yerə.' },
          ],
          hints: ['D hansı portdadır və kadr hansı portdan gəlib?'],
          after: '<p>Filter nadir görünür, çünki müasir şəbəkələrdə hub yoxdur. Amma o, "switch kadrı yalnız lazım olan yerə göndərir" qaydasının sərhəd halıdır.</p>' },

        { id: 's9', title: 'Domain sayı', type: 'form',
          body: '<p>Aşağıdakı şəbəkədə say. Hub-ın arxasındakı cihazlar hub və switch portu ilə birlikdə bir collision domain-dir. Switch-lər default VLAN-dadır.</p><div class="figure"><svg viewBox="0 0 760 280" role="img" aria-label="Topologiya: router, üç switch və bir hub"><rect x="10" y="20" width="360" height="250" rx="8" class="fill-blue"/><text x="190" y="42" text-anchor="middle" font-size="14" font-weight="700">Sol hissə</text><rect x="450" y="20" width="300" height="250" rx="8" class="fill-ok"/><text x="600" y="42" text-anchor="middle" font-size="14" font-weight="700">Sağ hissə</text><line x1="130" y1="110" x2="60" y2="170" class="ln"/><line x1="150" y1="110" x2="140" y2="170" class="ln"/><line x1="210" y1="100" x2="260" y2="130" class="ln"/><line x1="300" y1="160" x2="300" y2="210" class="ln"/><line x1="210" y1="92" x2="376" y2="95" class="ln"/><line x1="444" y1="95" x2="520" y2="95" class="ln"/><line x1="545" y1="110" x2="510" y2="170" class="ln"/><line x1="595" y1="110" x2="625" y2="160" class="ln"/><line x1="625" y1="186" x2="615" y2="225" class="ln"/><line x1="635" y1="186" x2="685" y2="225" class="ln"/><rect x="110" y="80" width="100" height="30" rx="4" class="box-s"/><text x="160" y="100" text-anchor="middle" font-size="13">SW1</text><rect x="250" y="130" width="100" height="30" rx="4" class="box-s"/><text x="300" y="150" text-anchor="middle" font-size="13">SW2</text><circle cx="410" cy="95" r="34" class="fill-yel"/><text x="410" y="99" text-anchor="middle" font-size="14" font-weight="700">R1</text><rect x="520" y="80" width="100" height="30" rx="4" class="box-s"/><text x="570" y="100" text-anchor="middle" font-size="13">SW3</text><rect x="30" y="170" width="60" height="30" rx="4" class="box-s"/><text x="60" y="190" text-anchor="middle" font-size="13">PC1</text><rect x="110" y="170" width="60" height="30" rx="4" class="box-s"/><text x="140" y="190" text-anchor="middle" font-size="13">PC2</text><rect x="270" y="210" width="60" height="30" rx="4" class="box-s"/><text x="300" y="230" text-anchor="middle" font-size="13">PC3</text><rect x="480" y="170" width="60" height="30" rx="4" class="box-s"/><text x="510" y="190" text-anchor="middle" font-size="13">PC4</text><rect x="600" y="160" width="60" height="26" rx="4" class="fill-yel"/><text x="630" y="178" text-anchor="middle" font-size="13">Hub</text><rect x="590" y="225" width="50" height="28" rx="4" class="box-s"/><text x="615" y="244" text-anchor="middle" font-size="13">PC5</text><rect x="660" y="225" width="50" height="28" rx="4" class="box-s"/><text x="685" y="244" text-anchor="middle" font-size="13">PC6</text></svg><div class="fig-cap">R1 iki interface ilə SW1 və SW3-ə qoşulub. SW1 ilə SW2 kabellə birləşib. SW3-ün bir portuna hub qoşulub (arxasında PC5 və PC6).</div></div>',
          fields: [
            { label: 'Broadcast domain sayı', placeholder: 'rəqəm', check: r => r.trim() === '2', wrong: 'Router-in neçə interface-i var? Switch-lər arasındakı kabel broadcast domain-i ayırmır.' },
            { label: 'Collision domain sayı', placeholder: 'rəqəm', check: r => r.trim() === '8', wrong: 'Hər switch portu ayrı domain-dir. Hub seqmenti (hub, PC5, PC6 və SW3-ə gedən link) bir domain sayılır. Linkləri bir-bir say.' },
          ],
          hints: ['Linkləri bir-bir say: SW1 portları (PC1, PC2, SW2, R1), SW2 (PC3), SW3 (PC4, hub seqmenti, R1).'],
          solution: 'Broadcast: 2 (R1 ayırır). Collision: SW1–PC1, SW1–PC2, SW1–SW2, SW2–PC3, SW1–R1, R1–SW3, SW3–PC4, hub seqmenti (SW3–Hub–PC5–PC6) = 8.' },

        { id: 's10', title: 'Ticket 3: A-nın MAC-i cədvəldə yoxdur', type: 'choice',
          body: '<p>PC-A (Fa0/1) PC-B-yə (Fa0/2) ping edə bilmir. İkisi də eyni switch-dədir və IP, mask düzgündür. PC-A saniyələr əvvəl bir neçə dəfə ping atıb. Switch-də:</p><pre class="pre"><span class="p">SW1#</span>show mac address-table\nVlan    Mac Address       Type        Ports\n----    -----------       --------    -----\n   1    0001.4321.bbbb    DYNAMIC     Fa0/2\nTotal Mac Addresses for this criterion: 1</pre><p>PC-A-nın MAC-i <span class="m">0001.4321.aaaa</span>-dır. Ən məntiqli növbəti addım nədir?</p>',
          options: [
            { t: 'PC-A-nın portunu (Fa0/1) və kabelini yoxla: switch ondan kadr görməyib.', ok: true, why: 'PC-A ping atıb, yəni kadr göndərib. Əgər kadr switch-ə çatsaydı, switch onun Source MAC-ini öyrənərdi. Cədvəldə aaaa yoxdur, deməli kadrlar switch-ə çatmır: kabel, port (shutdown) və ya NIC problemi (Layer 1).' },
            { t: 'PC-A-nın IP ünvanını dəyiş, çünki switch kadrları IP ilə yönləndirir.', why: 'Switch IP-yə baxmır, yalnız MAC ilə işləyir. Cədvəldə PC-A-nın MAC-inin olmaması IP ayarı ilə izah olunmur: IP səhv olsa belə, ARP kadrı switch-ə çatıb MAC-i öyrədərdi.' },
            { t: 'Aging müddətini artır ki, PC-A-nın girişi tez silinməsin və qalsın.', why: 'PC-A-nın girişi silinməyib, heç yaranmayıb. PC-A saniyələr əvvəl göndərib, aging 300 saniyədir. Problem aging deyil.' },
            { t: 'Switch-i yenidən yüklə, çünki MAC cədvəli xarabdır və yenilənməlidir.', why: 'Cədvəl xarab deyil: PC-B-nin girişi var. Yeniləmək əvvəl səbəbi tapmadan sübut yox, təxmindir.' },
          ],
          hints: ['PC-A kadr göndərib. Kadr switch-ə çatsa cədvəldə nə olardı?'],
          after: '<p>Metod: <b>MAC cədvəldə yoxdur = switch ondan kadr görməyib</b>. Əvvəl Layer 1 yoxlanılır (kabel, port statusu). Cədvəldə hər iki MAC varsa, problem artıq Layer 3-dədir.</p>' },

        { id: 's11', title: 'SOC: bir portda minlərlə MAC', type: 'choice',
          body: '<p>Monitoring bu xəbərdarlığı verdi: access switch-də <span class="m">Fa0/7</span> portunda 40 saniyə ərzində <b>6000</b> yeni MAC öyrənilib. Fa0/7 ofisdəki tək bir kompüterin portudur. MAC-lər təsadüfi görünür, tanınan istehsalçı prefiksləri yoxdur. Switch-in ümumi cədvəli tutumuna yaxınlaşıb. Bu nədir və ilk addımın nədir?</p>',
          options: [
            { t: 'MAC flooding: həmin portu izolə edib kompüteri tapıram, sonra port security qururam.', ok: true, why: 'Tək kompüter portunda qısa müddətdə minlərlə təsadüfi MAC cədvəli doldurmaq cəhdidir. Cədvəl dolanda switch bilinməyən unicast-ı flood edəcək və trafik dinlənə bilər. Əvvəl port izolə olunur, cihaz tapılır, uzunmüddətli həll port security-dir.' },
            { t: 'Normaldır: switch bütün MAC-ləri öyrənməlidir və tutuma yaxınlaşmaq təbiidir.', why: 'Switch öyrənməlidir, amma tək kompüter portunda 40 saniyədə 6000 təsadüfi MAC normal deyil. Normal access portu bir MAC görür.' },
            { t: 'ARP spoofing: hücumçu gateway-in MAC-ini saxtalaşdırır, ona görə cədvəl dolur.', why: 'ARP spoofing bir IP üçün saxta MAC cavabıdır və cədvəli doldurmur. Burada minlərlə fərqli Source MAC var, bu MAC flooding-dir.' },
            { t: 'Aging müddəti çox yüksəkdir: onu azaldıb cədvəlin özü təmizlənməsini gözləyirəm.', why: 'Aging-i azaltmaq hücumu dayandırmır: hücumçu 40 saniyədə 6000 MAC göndərə bilirsə, qısa aging də onu qarşılaya bilməz. Əvvəl mənbə dayandırılmalıdır.' },
          ],
          hints: ['Normal access portunda neçə MAC olmalıdır? Bu portda nə qeyri-adidir?'],
          after: '<p>Doğrulamaq üçün: <span class="m">show mac address-table interface fa0/7</span> ilə MAC-lərə baxarsan. Əgər Fa0/7 əslində başqa switch-ə gedən uplink olsaydı, çox MAC normal olardı. Buna görə əvvəl portun nəyə qoşulduğunu yoxlayırsan: roldan asılı olaraq eyni rəqəm normal və ya hücum ola bilər.</p>' },

        { id: 's12', title: 'Log oxu: MAC flapping', type: 'choice',
          body: '<p>Switch log-da bir neçə saniyədə dəfələrlə:</p><pre class="pre">%SW_MATM-4-MACFLAP_NOTIF: Host 0001.4321.aaaa in vlan 1\n  is flapping between port Fa0/1 and port Fa0/2\n%SW_MATM-4-MACFLAP_NOTIF: Host 0001.4321.aaaa in vlan 1\n  is flapping between port Fa0/2 and port Fa0/1</pre><p>Bu nə deməkdir?</p>',
